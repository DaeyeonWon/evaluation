          items:
            $ref: '#/components/schemas/RolePermission'
        roles:
          type: array
          items:
            type: object
            required:
              - name
              - permissions
            properties:
              name:
                type: string
              label:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
        permissions:
          type: array
          items:
            type: object
            required:
              - key
              - label
            properties:
              key:
                type: string
              label:
                type: string
    WorkflowResults:
      type: object
      required:
        - rows
        - summary
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ResultRow'
        summary:
          oneOf:
            - $ref: '#/components/schemas/ResultsSummary'
            - type: 'null'
    PipelineListItem:
