  /stream:
    get:
      tags:
        - Realtime
      summary: Server-Sent Events
      description: >-
        Every message carries `id: <epoch>-<seq>` (seq monotonic across all event types per server process; epoch changes on restart). On connect: `retry:
        3000`, `event: hello` (`SseHello`), then — if `Last-Event-ID` (sent automatically by EventSource on native reconnect) or `?last_event_id=` names a
        buffered id — every missed message in order (`hello.resumed: true`), then an immediate `tick` and live messages. The mock keeps a ring buffer of
        all non-`tick` messages (≤ 5,000 and ≤ 5 min; `tick` is a full snapshot, so only a fresh one is sent). Unknown, expired or other-process ids get
        `hello.resync: true` and no replay — clients must refetch. `: keep-alive` comment every 15 s.
      operationId: get__stream
      parameters:
        - name: types
          in: query
          schema:
            type: string
            examples:
              - tick,transition,job
          description: comma-separated subset of hello,tick,transition,event,log,alert,audit,dlq,sim,job (default all)
        - name: last_event_id
          in: query
          schema:
            type: string
          description: fallback for Last-Event-ID when the client recreates EventSource (format `<epoch>-<seq>`)
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: last SSE id the client saw; EventSource sends it on native reconnect
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-sse-events:
        hello:
          $ref: '#/components/schemas/SseHello'
        tick:
          $ref: '#/components/schemas/TickSnapshot'
        transition:
          $ref: '#/components/schemas/TransitionMessage'
        event:
          $ref: '#/components/schemas/WorkflowEvent'
        log:
          $ref: '#/components/schemas/LogEntry'
        alert:
          $ref: '#/components/schemas/Alert'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        dlq:
          $ref: '#/components/schemas/DeadLetter'
        sim:
          $ref: '#/components/schemas/SimState'
        job:
          $ref: '#/components/schemas/PipelineJobTransition'
components:
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: aipo_session
      description: mock mode signed session cookie
    iap:
      type: apiKey
      in: header
      name: x-goog-iap-jwt-assertion
      description: IAP JWT (verified against IAP_AUDIENCE); upstream identity via x-console-user-* headers
  parameters:
    Range:
      name: range
      in: query
      schema:
        type: string
        examples:
          - today
          - yesterday
          - 1h
          - 6h
          - 24h
          - 7d
          - 30d
          - 12h
          - 48h
      description: Preset or last-N (`<N>h`/`<N>d`, 1h…90d). Default today (KST). `from`/`to` win over `range`.
    From:
      name: from
      in: query
      schema:
        type: string
      description: epoch ms or ISO-8601 (prefer `Z`). Inclusive.
    To:
      name: to
      in: query
      schema:
        type: string
      description: epoch ms or ISO-8601. Missing = now. Inclusive.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Language:
      name: language
      in: query
      schema:
        type: array
        items:
          $ref: '#/components/schemas/LangCode'
      style: form
      explode: false
      description: comma-separated and/or repeated
    LanguageOne:
      name: language
      in: query
      schema:
        $ref: '#/components/schemas/LangCode'
    Q:
      name: q
      in: query
      schema:
        type: string
      description: case-insensitive substring search
    PipelineJobId:
      name: pipeline_job_id
      in: query
      schema:
        type: string
      description: root or child job id; matches descendants unless job_scope=self
    JobScopeTree:
      name: job_scope
      in: query
      schema:
        type: string
        enum:
          - self
          - tree
        default: tree
    PipelineIdOne:
      name: pipeline_id
      in: query
      schema:
        type: string
    NodePath:
      name: node_path
      in: query
      schema:
        type: string
        examples:
          - response_judge/safety_check/pii_scan
    WorkflowIdQ:
      name: workflow_id
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: >-
        Recommended on every POST/PATCH (required by the real API for replay/cancel/capacity/config). Scope: METHOD + path + key, TTL 10 min (real: 24 h). A
        repeat returns the first response with header `idempotent-replay: true`.
    DryRun:
      name: dry_run
      in: query
      schema:
        type: boolean
      description: 1/true → impact analysis only, nothing changes, reason optional
    WorkflowIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^wf-\d{8}-(ko|en|ja|es)-\d{4}$
        examples:
          - wf-20261112-ko-0033
    DeadLetterIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples:
          - dlq-20261112-007
      description: dead_letter_id (GET also accepts a workflow_id)
    AlertIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples:
          - ALT-0012
    LangPath:
      name: lang
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LangCode'
    PipelineIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples:
          - bixby-eval-full
          - policy-guard
  responses:
    BadRequest:
      description: INVALID_ARGUMENT — details.field / details.allowed / details.min / details.max
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    Unauthenticated:
      description: UNAUTHENTICATED (no or invalid session / IAP JWT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    Forbidden:
      description: FORBIDDEN (missing permission; key permission.denied | permission.apiDenied | permission.operatorRequired)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    Conflict:
      description: CONFLICT (state does not allow the transition, e.g. already terminal / REPLAYING)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    Internal:
      description: INTERNAL (message key code.INTERNAL, no internals)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
  schemas:
    LangCode:
      type: string
      enum:
        - ko
        - en
        - ja
        - es
    WorkflowStatus:
      type: string
      enum:
        - RECEIVED
        - VALIDATED
        - QUEUED
