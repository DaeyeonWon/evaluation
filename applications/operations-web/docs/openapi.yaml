        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StageSummary'
    ComponentDurationList:
      allOf:
        - $ref: '#/components/schemas/RangedListMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ComponentDuration'
    VersionComparisonList:
      allOf:
        - $ref: '#/components/schemas/RangedListMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VersionComparison'
    LanguageSummaryList:
      allOf:
        - $ref: '#/components/schemas/RangedListMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LanguageSummary'
    DailyMetricsList:
      allOf:
        - $ref: '#/components/schemas/RangedListMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DailyMetrics'
    PipelineList:
      allOf:
        - $ref: '#/components/schemas/RangedListMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PipelineListItem'
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEntry'
            range:
              $ref: '#/components/schemas/ResolvedRange'
    GcsListingRanged:
      allOf:
        - $ref: '#/components/schemas/GcsListing'
        - type: object
          properties:
            range:
              oneOf:
                - $ref: '#/components/schemas/ResolvedRange'
                - type: 'null'
              description: null when range=all
    SseEnvelope:
      type: object
      description: 'Wire format of one SSE message: `id: <stream_seq>\nevent: <type>\ndata: <json>\n\n` (id required in the real API; the mock omits it).'
      properties:
        id:
          type: string
          description: monotonic per stream partition, e.g. 1731390000000-000042
        event:
          type: string
          enum:
            - hello
            - tick
            - transition
            - event
            - log
            - alert
            - audit
            - dlq
            - sim
            - job
        data: {}
    SseHello:
      type: object
      required:
        - sim
        - serverTime
      properties:
        sim:
          $ref: '#/components/schemas/SimState'
        lastEventId:
          type: string
          description: SSE id at connect time (`<epoch>-<seq>`); also the `id:` of this hello message
        resumed:
          type: boolean
          description: missed messages after the client's Last-Event-ID were replayed right after this hello
        resync:
          type: boolean
          description: the client's Last-Event-ID could not be backfilled (unknown / expired / server restarted) — refetch all data
        serverTime:
          type: integer
