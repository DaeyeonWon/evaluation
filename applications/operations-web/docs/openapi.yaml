                $ref: '#/components/schemas/Alert'
            openOutsideRange:
              type: integer
              description: non-RESOLVED alerts opened outside the range
    IncidentList:
      allOf:
        - $ref: '#/components/schemas/RangedListMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Incident'
    ReplayList:
