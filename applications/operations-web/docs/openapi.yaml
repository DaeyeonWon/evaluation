# AIPO Operations API — OpenAPI 3.1
# Generated from src/lib/types.ts + src/app/api/v1/** (see docs/integration-spec.md §2). components.schemas mirror src/lib/types.ts 1:1 — change both together.
openapi: 3.1.0
info:
  title: AIPO Operations API
  version: 1.0.0
  summary: Contract between the AIPO Operations Console (Next.js) and the FastAPI Operations API.
  description: >-
    Generated from src/lib/types.ts (schemas) and src/app/api/v1/** (paths). See docs/integration-spec.md.


    Conventions: timestamps are epoch ms numbers; `timestamp`/`*Iso` strings are preformatted (events/audit KST +09:00, logs UTC Z). List params accept
    comma-separated or repeated values. Errors are ApiErrorBody `{ error: { code, message, key?, details? } }` localized by cookie `console_locale` →
    Accept-Language. Extensions: `x-permission` (console permission key, `public` = none), `x-range` (honors range/from/to and echoes `range`), `x-source`
    (system of record), `x-freshness` (max staleness), `x-mock-only`.
servers:
  - url: /api/v1
    description: via the console (proxy mode → OPERATIONS_API_URL)
  - url: https://ops-api.internal/api/v1
    description: Operations API (internal; console-only access)
security:
  - consoleSession: []
  - iap: []
tags:
  - name: Overview
  - name: Capacity
  - name: Workflows
  - name: Pipelines
  - name: Events & Logs
  - name: DLQ
  - name: Results
  - name: Analytics
  - name: Stages & Files
  - name: Config
  - name: Identity
  - name: Realtime
  - name: Simulator
paths:
  /overview:
    get:
      tags:
        - Overview
      summary: Live KPIs (today, KST) + capacity + inRange KPIs
      operationId: get__overview
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: true
      x-source: Firestore (live counters) + BigQuery aipo_ops (inRange)
      x-freshness: ≤5s live part; ≤60s inRange
  /meta:
    get:
      tags:
        - Overview
      summary: Static catalog, registry, data window
      operationId: get__meta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaCatalog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: registry (config) + BigQuery min(ts)
      x-freshness: cache 5 min; refetch on SSE sim/config
  /languages/capacity:
    get:
      tags:
        - Capacity
      summary: Capacity snapshot (all languages + global)
      operationId: get__languages_capacity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacitySnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore capacity/*, languages/*, reservations, workflows
      x-freshness: ≤5s
  /languages/{lang}/capacity:
    get:
      tags:
        - Capacity
      summary: One language's capacity
      operationId: get__languages_lang_capacity
      parameters:
        - $ref: '#/components/parameters/LangPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageCapacity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore
      x-freshness: ≤5s
    patch:
      tags:
        - Capacity
      summary: Change language capacity / pause / resume (audited)
      operationId: patch__languages_lang_capacity
      parameters:
        - $ref: '#/components/parameters/LangPath'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityPatchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: capacity:write
      x-range: false
      x-source: Firestore transaction languages/{lang} + capacity/{lang} + audit + outbox(pipeline.config.updated)
  /capacity/global:
    get:
      tags:
        - Capacity
      summary: Global capacity
      operationId: get__capacity_global
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCapacity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore capacity/global
      x-freshness: ≤5s
    patch:
      tags:
        - Capacity
      summary: Change global capacity (audited)
      operationId: patch__capacity_global
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalCapacityPatchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCapacityChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: capacity:write
      x-range: false
  /capacity/history:
    get:
      tags:
        - Capacity
      summary: Active slots / queue depth series per language
      operationId: get__capacity_history
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: granularity
          in: query
          schema:
            type: string
            enum:
              - auto
              - 5m
              - 1h
              - 6h
            default: auto
          description: 'auto: ≤26h→5m (when 5-min data covers the range), ≤8d→1h, else 6h (max of bucket)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: true
      x-source: BigQuery aipo_ops.capacity_snapshots
      x-freshness: ≤5 min
  /reservations:
    get:
      tags:
        - Capacity
      summary: Capacity Slot reservations (bare array, newest first)
      operationId: get__reservations
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - ACTIVE
                - RELEASED
                - ORPHANED
        - $ref: '#/components/parameters/LanguageOne'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore reservations
      x-freshness: ≤5s
  /workflows:
    get:
      tags:
        - Workflows
      summary: Workflow list (Explorer, Board, ⌘K)
      operationId: get__workflows
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Language'
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowStatus'
        - name: version
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: pipeline_version (alias pipeline_version)
        - name: pipeline_id
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: alias pipeline
        - name: model_version
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: alias model
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/StageId'
        - name: event_type
          in: query
          schema:
            type: string
        - name: batch_id
          in: query
          schema:
            type: string
        - name: error_code
          in: query
          schema:
            type: string
        - name: error_category
          in: query
          schema:
            $ref: '#/components/schemas/FailureCategory'
        - name: has_retries
          in: query
          schema:
            type: boolean
        - name: replay
          in: query
          schema:
            type: boolean
        - name: active
          in: query
          schema:
            type: boolean
          description: non-terminal only
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/WorkflowIdQ'
        - $ref: '#/components/parameters/PipelineJobId'
        - name: range_by
          in: query
          schema:
            type: string
            enum:
              - active
              - created
              - updated
            default: active
          description: active = lifetime [created_at, completed_at ?? ∞] overlaps the range
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created_desc
              - created_asc
              - wait_desc
              - run_desc
              - updated_desc
              - attempts_desc
            default: created_desc
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: true
      x-source: Firestore workflows (active) ∪ BigQuery workflow_runs (history)
      x-freshness: ≤5s for active rows
  /workflows/{id}:
    get:
      tags:
        - Workflows
      summary: Full workflow document incl. attempts and legacy DAG
      operationId: get__workflows_id
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore workflows/{id} + attempts/*
      x-freshness: ≤5s
  /workflows/{id}/attempts:
    get:
      tags:
        - Workflows
      summary: Attempt history, retry policy, replay chain
      operationId: get__workflows_id_attempts
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptHistory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore attempts + replays
  /workflows/{id}/dag:
    get:
      tags:
        - Workflows
      summary: LEGACY six-phase DAG projection
      operationId: get__workflows_id_dag
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
  /workflows/{id}/pipeline-runs:
    get:
      tags:
        - Pipelines
      summary: Root + child PipelineJob tree per attempt
      operationId: get__workflows_id_pipeline_runs
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPipelineRuns'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore pipeline_jobs (+ Vertex AI getPipelineJob for task details)
      x-freshness: ≤10s
  /workflows/{id}/events:
    get:
      tags:
        - Workflows
      summary: Event Timeline (bare array, ascending, ts ≤ now)
      operationId: get__workflows_id_events
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Firestore workflows/{id}/events (hot) → BigQuery workflow_events
      x-freshness: ≤5s
  /workflows/{id}/logs:
    get:
      tags:
        - Workflows
      summary: Log Explorer for one workflow (not ranged)
      operationId: get__workflows_id_logs
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
        - name: severity
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Severity'
        - name: min_severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: component
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: service
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: attempt
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: event_type
          in: query
          schema:
            type: string
        - name: trace_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PipelineJobId'
        - $ref: '#/components/parameters/JobScopeTree'
        - $ref: '#/components/parameters/NodePath'
        - name: error_code
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Q'
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: Cloud Logging (jsonPayload.workflow_id) / BigQuery log sink for >30d
      x-freshness: ≤10s
  /workflows/{id}/results:
    get:
      tags:
        - Results
      summary: Result rows + summary (SUCCEEDED workflows only)
      operationId: get__workflows_id_results
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: false
      x-source: BigQuery utterance_results (workflow_id)
  /workflows/{id}/cancel:
    post:
      tags:
        - Workflows
      summary: Cancel a non-terminal workflow (audited)
      operationId: post__workflows_id_cancel
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: workflow:cancel
      x-range: false
      x-source: Firestore cancel_requested_at + outbox(pipeline.batch.cancel.requested) → Workflows cancels PipelineJob
  /pipelines:
    get:
      tags:
        - Pipelines
      summary: Registry + run summaries
      operationId: get__pipelines
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - root
              - sub
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: true
      x-source: registry + BigQuery pipeline_job_runs (+ Firestore pipeline_jobs for running)
      x-freshness: ≤30s
  /pipelines/{id}:
    get:
      tags:
        - Pipelines
      summary: 'Pipeline detail: DAG, node stats, recent runs'
      operationId: get__pipelines_id
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/PipelineIdPath'
        - name: version
          in: query
          schema:
            type: string
          description: 'default: latest non-deprecated'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: true
      x-source: registry + BigQuery pipeline_node_runs
  /pipelines/{id}/runs:
    get:
      tags:
        - Pipelines
      summary: Runs (one row per job; root or child)
      operationId: get__pipelines_id_runs
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/PipelineIdPath'
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobStatus'
        - name: version
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/WorkflowIdQ'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - start_desc
              - start_asc
              - duration_desc
            default: start_desc
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      x-permission: view
      x-range: true
      x-source: BigQuery pipeline_job_runs ∪ Firestore pipeline_jobs (RUNNING)
  /pipeline-jobs/{jobId}:
    get:
      tags:
        - Pipelines
      summary: One PipelineJob (root or child) + recent logs/events + ancestors
      operationId: get__pipeline_jobs_jobId
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
