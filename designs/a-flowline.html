<title>Flowline 관제 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: mission-control. Slim nav rail at left, a status strip on top, and a full-width horizontal pipeline rail that carries batch tokens; everything else drills down from it (slide-over inspector, detail with breadcrumbs). Dark-first. */
:root {
  color-scheme: dark;
  --bg: #0b111b;
  --bg-2: #0f1724;
  --surface: #131c2b;
  --surface-2: #182234;
  --surface-3: #1f2b40;
  --line: #222f45;
  --line-2: #2e3d57;
  --text: #dce4f0;
  --text-2: #a9b5c8;
  --muted: #7a889f;
  --faint: #56637a;
  --accent: #74c2dd;
  --accent-ink: #062431;
  --accent-soft: rgba(116, 194, 221, .13);
  --glow: .9;
  --shadow: 0 18px 48px rgba(0, 0, 0, .45);
  --term-bg: #080d15;
  --term-text: #c4d0e2;
  --term-ts: #6f7f98; --term-info: #7fb7e8; --term-warn: #e8b24a; --term-err: #f07c7c; --term-debug: #7a8699; --term-notice: #8fd3a8; --term-svc: #b49cf0; --term-wid: #d9e3f2; --term-trace: #f3a3a3;

  --st-success: #3fb871; --st-running: #3987e5; --st-queued: #9aa0aa; --st-retry: #e0a42a;
  --st-failed: #e66767; --st-dlq: #a77ff0; --st-cancelled: #8b929c;
  --l-ko: #3987e5; --l-en: #d95926; --l-ja: #199e70; --l-es: #c98500;

  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "D2Coding", monospace;

  --r-1: 4px; --r-2: 8px; --r-3: 12px;
  --rail-w: 84px;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e8ecf2; --bg-2: #f3f5f9; --surface: #ffffff; --surface-2: #f3f6fa; --surface-3: #e7ecf3;
    --line: #d6dde8; --line-2: #c2ccdb; --text: #111d2f; --text-2: #3b4a60; --muted: #637189; --faint: #8f9bb0;
    --accent: #176f94; --accent-ink: #ffffff; --accent-soft: rgba(23, 111, 148, .10); --glow: .35;
    --shadow: 0 18px 48px rgba(22, 36, 60, .18); --term-bg: #0f1825; --term-text: #c9d4e4;
    --st-success: #1f8f4e; --st-running: #2a78d6; --st-queued: #7a8190; --st-retry: #c27a00;
    --st-failed: #d23f3f; --st-dlq: #7d3cc8; --st-cancelled: #5c6370;
    --l-ko: #2a78d6; --l-en: #eb6834; --l-ja: #1baf7a; --l-es: #eda100;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e8ecf2; --bg-2: #f3f5f9; --surface: #ffffff; --surface-2: #f3f6fa; --surface-3: #e7ecf3;
  --line: #d6dde8; --line-2: #c2ccdb; --text: #111d2f; --text-2: #3b4a60; --muted: #637189; --faint: #8f9bb0;
  --accent: #176f94; --accent-ink: #ffffff; --accent-soft: rgba(23, 111, 148, .10); --glow: .35;
  --shadow: 0 18px 48px rgba(22, 36, 60, .18); --term-bg: #0f1825; --term-text: #c9d4e4;
  --st-success: #1f8f4e; --st-running: #2a78d6; --st-queued: #7a8190; --st-retry: #c27a00;
  --st-failed: #d23f3f; --st-dlq: #7d3cc8; --st-cancelled: #5c6370;
  --l-ko: #2a78d6; --l-en: #eb6834; --l-ja: #1baf7a; --l-es: #eda100;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 13px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, code, .num { font-family: var(--f-mono); }
.num, td, .tnum { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--accent-soft); }
svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.t-success { --tone: var(--st-success); } .t-running { --tone: var(--st-running); } .t-queued { --tone: var(--st-queued); }
.t-retry { --tone: var(--st-retry); } .t-failed { --tone: var(--st-failed); } .t-dlq { --tone: var(--st-dlq); } .t-cancelled { --tone: var(--st-cancelled); }
.t-accent { --tone: var(--accent); }

/* ── shell ── */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.nav { grid-row: 1 / 3; background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: stretch; padding: 12px 8px; gap: 2px; position: relative; z-index: 5; }
.brand { display: grid; place-items: center; gap: 4px; padding: 4px 0 14px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 34px; height: 34px; }
.brand-name { font: 600 10px/1 var(--f-mono); letter-spacing: .14em; color: var(--text-2); }
.nav-btn { display: grid; justify-items: center; gap: 4px; padding: 9px 2px 8px; border: 0; background: none; border-radius: var(--r-2); color: var(--muted); cursor: pointer; position: relative; transition: color .2s, background .2s; }
.nav-btn svg.ic { width: 19px; height: 19px; }
.nav-btn span { font-size: 10.5px; line-height: 1.2; letter-spacing: -.01em; text-align: center; }
.nav-btn:hover { color: var(--text); background: var(--surface-2); }
.nav-btn[aria-current="page"] { color: var(--text); background: var(--accent-soft); }
.nav-btn[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-btn .badge { position: absolute; top: 4px; right: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--st-dlq); color: #fff; font: 600 10px/16px var(--f-mono); }
.nav-btn[data-screen="detail"][disabled] { opacity: .35; cursor: default; }
.nav-spacer { flex: 1; }
.mock-mark { margin-top: 8px; text-align: center; font: 600 9.5px/1.3 var(--f-mono); letter-spacing: .12em; color: var(--st-retry); border: 1px dashed color-mix(in srgb, var(--st-retry) 55%, transparent); border-radius: var(--r-1); padding: 5px 2px; }

.strip { grid-column: 2; display: flex; align-items: center; gap: 14px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--bg-2); min-width: 0; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }
.strip-title { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.strip-title b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.strip-title small { color: var(--muted); font: 400 11px/1.3 var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-2); overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.clock { font: 500 13px/1 var(--f-mono); color: var(--text); display: grid; gap: 2px; }
.clock small { font-size: 10px; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--f-mono); letter-spacing: .1em; color: var(--st-success); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 1.6s infinite; }
.live.paused { color: var(--muted); } .live.paused i { animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.gcap { display: grid; gap: 4px; min-width: 150px; }
.gcap-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.gcap-top b { font: 600 12px var(--f-mono); color: var(--text); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; position: relative; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); transition: width .6s var(--ease); }
.simctl { display: inline-flex; align-items: center; gap: 6px; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: var(--r-2); border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); cursor: pointer; }
.icon-btn:hover { color: var(--text); border-color: var(--accent); }
.opsel { font-size: 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-2); padding: 4px 6px; max-width: 150px; }

main { grid-column: 2; overflow: auto; min-width: 0; position: relative; scroll-behavior: smooth; }
.screen { padding: 18px 20px 40px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.screen.enter { animation: viewIn .38s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── type ── */
.h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.h2 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.eyebrow { font: 600 10.5px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); font-size: 12px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head-row > div { min-width: 0; }

/* ── containers by role ── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-3); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 8px; flex-wrap: wrap; }
.panel-b { padding: 4px 14px 14px; min-width: 0; }
.grid { display: grid; gap: 14px; min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-7-5 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.g-5-7 { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.chart { width: 100%; height: 230px; }
.chart.tall { height: 300px; }
.chart.short { height: 180px; }

/* ── pills / chips ── */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; font-size: 11.5px; font-weight: 500; white-space: nowrap; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tone) 32%, transparent); }
.pill svg.ic { width: 13px; height: 13px; }
.pill.sm { height: 19px; font-size: 11px; padding: 0 6px 0 5px; }
.pill .spin, .spin { animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.lang { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--f-mono); text-transform: uppercase; color: var(--text-2); }
.lang i { width: 8px; height: 8px; border-radius: 2px; background: var(--lc); }
.lc-ko { --lc: var(--l-ko); } .lc-en { --lc: var(--l-en); } .lc-ja { --lc: var(--l-ja); } .lc-es { --lc: var(--l-es); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: var(--r-1); background: var(--surface-3); color: var(--text-2); font: 500 11px/1.6 var(--f-mono); white-space: nowrap; }
.kbd { font: 500 11px var(--f-mono); color: var(--muted); }
.idlink { font: 500 12px var(--f-mono); color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; text-align: left; }
.idlink:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* ── buttons / fields ── */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-2); border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s, transform .1s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--st-failed); border-color: color-mix(in srgb, var(--st-failed) 45%, transparent); background: color-mix(in srgb, var(--st-failed) 8%, transparent); }
.btn.dlqb { color: var(--st-dlq); border-color: color-mix(in srgb, var(--st-dlq) 45%, transparent); background: color-mix(in srgb, var(--st-dlq) 9%, transparent); }
.btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 11px; color: var(--muted); }
.inp { height: 30px; padding: 0 9px; border-radius: var(--r-2); border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font-size: 12.5px; min-width: 0; width: 100%; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { height: auto; padding: 7px 9px; resize: vertical; min-height: 60px; }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.toggle { position: relative; width: 34px; height: 19px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--line-2); cursor: pointer; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); transition: transform .2s var(--ease), background .2s; }
.toggle[aria-checked="true"] { background: color-mix(in srgb, var(--st-success) 30%, transparent); border-color: var(--st-success); }
.toggle[aria-checked="true"]::after { transform: translateX(15px); background: var(--st-success); }

/* ── tables ── */
.tbl-wrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr { transition: background .15s; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr.sel { background: var(--accent-soft); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.wrap { white-space: normal; min-width: 220px; }
.tbl th button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; font: inherit; }
.tbl tr.flash td { animation: rowflash 1.4s ease-out; }
@keyframes rowflash { from { background: var(--accent-soft); } to { background: transparent; } }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 12.5px; border: 1px dashed var(--line-2); border-radius: var(--r-2); }

/* ── orchestration rail ── */
.rail-panel { position: relative; background:
  radial-gradient(1200px 300px at 70% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%),
  linear-gradient(var(--surface), var(--surface)); border: 1px solid var(--line); border-radius: var(--r-3); overflow: hidden; }
.rail-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px 0; flex-wrap: wrap; }
.rail-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; font-size: 11.5px; color: var(--muted); }
.rail-legend span { display: inline-flex; align-items: center; gap: 5px; }
.rail-legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--lc); box-shadow: 0 0 8px color-mix(in srgb, var(--lc) calc(var(--glow) * 100%), transparent); }
.rail-scroll { overflow-x: auto; overflow-y: hidden; padding: 0 6px 4px; }
#rail { display: block; width: 100%; min-width: 1100px; height: auto; }
#rail .grid-dots { fill: var(--line); }
#rail .edge { fill: none; stroke: var(--line-2); stroke-width: 1.6; }
#rail .edge.flow { stroke: color-mix(in srgb, var(--accent) 45%, var(--line-2)); stroke-dasharray: 3 7; animation: flow 1.2s linear infinite; }
#rail .edge.tone { stroke: var(--tone); stroke-opacity: .7; }
#rail .edge.dashed { stroke-dasharray: 6 6; }
#rail .edge-label { fill: var(--muted); font: 500 10px var(--f-mono); }
#rail .edge-label.tone { fill: var(--tone); }
@keyframes flow { to { stroke-dashoffset: -20; } }
#rail .node { cursor: pointer; }
#rail .node .box { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1; transition: stroke .2s, fill .2s; }
#rail .node.branch .box { fill: var(--surface); }
#rail .node:hover .box, #rail .node:focus-visible .box { stroke: var(--accent); fill: var(--surface-3); }
#rail .node:focus { outline: none; }
#rail .node.active .box { stroke: var(--accent); stroke-width: 1.6; }
#rail .node .hot { fill: none; stroke: var(--tone); stroke-width: 2; opacity: 0; }
#rail .node.pinged .hot { animation: ping .9s ease-out; }
@keyframes ping { 0% { opacity: .9; } 100% { opacity: 0; } }
#rail .n-label { fill: var(--text); font: 600 12.5px var(--f-ui); }
#rail .n-sub { fill: var(--muted); font: 400 10px var(--f-mono); }
#rail .n-count { fill: var(--text); font: 600 22px var(--f-mono); font-variant-numeric: tabular-nums; }
#rail .n-unit { fill: var(--muted); font: 400 10px var(--f-ui); }
#rail .n-icon { stroke: var(--accent); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#rail .spark { fill: none; stroke: var(--accent); stroke-width: 1.3; }
#rail .spark-a { fill: var(--accent); opacity: .12; stroke: none; }
#rail .spark-dot { fill: var(--accent); }
#rail .tok { fill: var(--lc); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--lc) calc(var(--glow) * 100%), transparent)); cursor: pointer; }
#rail .tok.retry { stroke: var(--st-retry); stroke-width: 1.5; }
#rail .tok:hover { stroke: var(--text); stroke-width: 1.5; }
#rail .fly { fill: var(--lc); filter: drop-shadow(0 0 6px var(--lc)); pointer-events: none; }
#rail .more { fill: var(--muted); font: 500 10px var(--f-mono); }
#rail .lane-label { fill: var(--faint); font: 600 9.5px var(--f-mono); letter-spacing: .14em; }
.rail-foot { display: flex; gap: 18px; padding: 8px 16px 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }
.rail-foot b { color: var(--text); font: 500 11.5px var(--f-mono); }
.ticker { display: flex; gap: 8px; align-items: center; min-width: 0; flex: 1 1 0; max-width: 100%; overflow: hidden; white-space: nowrap; }
.ticker .tk { display: inline-flex; gap: 6px; align-items: center; animation: tkIn .5s var(--ease) both; }
@keyframes tkIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

/* KPI band: one instrument strip, not separate cards */
.kpis { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-3); }
.kpi { padding: 12px 14px; display: grid; gap: 3px; border-left: 1px solid var(--line); min-width: 0; text-align: left; background: none; border-top: 0; border-right: 0; border-bottom: 0; color: inherit; cursor: pointer; }
.kpi:first-child { border-left: 0; }
.kpi:hover { background: var(--surface-2); }
.kpi .k-l { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-l svg.ic { width: 13px; height: 13px; color: var(--tone, var(--muted)); }
.kpi .k-v { font: 600 22px/1.15 var(--f-mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .k-s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* capacity bars */
.caps { display: grid; gap: 12px; }
.cap-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 200px; gap: 12px; align-items: center; }
.cap-row .lname { display: grid; gap: 1px; }
.cap-row .lname b { font-size: 12.5px; font-weight: 600; }
.slots { display: flex; gap: 3px; flex-wrap: wrap; }
.slot { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-3); border: 1px solid var(--line-2); transition: background .4s, border-color .4s; }
.slot.on { background: var(--lc); border-color: var(--lc); box-shadow: 0 0 6px color-mix(in srgb, var(--lc) calc(var(--glow) * 80%), transparent); }
.slot.rsv { background: color-mix(in srgb, var(--lc) 35%, transparent); border-color: var(--lc); }
.slot.q { background: none; border-style: dashed; border-color: color-mix(in srgb, var(--lc) 60%, transparent); }
.cap-meta { font: 500 11.5px/1.35 var(--f-mono); text-align: right; color: var(--text-2); }
.cap-meta b { color: var(--text); font-size: 14px; }
.statchip { font: 600 10px var(--f-mono); letter-spacing: .06em; padding: 1px 5px; border-radius: 3px; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent); }

/* feed lists */
.feed { display: grid; max-height: 330px; overflow: auto; }
.feed-row { display: grid; grid-template-columns: 74px 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 12px; }
.feed-row.new { animation: tkIn .45s var(--ease) both; }
.feed-row .ft { font: 400 11px var(--f-mono); color: var(--muted); }
.feed-row .fn { font: 500 11.5px var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row .fn small { color: var(--muted); font-family: var(--f-ui); margin-left: 6px; }
.sev-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); justify-self: center; }
.alert-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.alert-row .bar { align-self: stretch; border-radius: 2px; background: var(--tone); }
.alert-row b { font-size: 12.5px; font-weight: 600; }
.alert-row p { margin: 2px 0 0; color: var(--text-2); font-size: 12px; }

/* drawer / inspector */
.scrim { position: fixed; inset: 0; background: rgba(4, 8, 14, .45); z-index: 40; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--bg-2); border-left: 1px solid var(--line-2); box-shadow: var(--shadow); z-index: 41; display: grid; grid-template-rows: auto auto minmax(0, 1fr); animation: slideIn .32s var(--ease) both; padding-top: env(safe-area-inset-top, 0px); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
.drawer-h { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.drawer-h .dh-icon { width: 38px; height: 38px; border-radius: var(--r-2); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.drawer-h .dh-icon svg.ic { width: 20px; height: 20px; }
.drawer-h > div { min-width: 0; flex: 1; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 10px 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .ct { font: 500 10.5px var(--f-mono); color: var(--muted); background: var(--surface-3); border-radius: 8px; padding: 0 5px; }
.drawer-b { overflow: auto; padding: 14px 18px 24px; min-width: 0; }

/* terminal */
.term { background: var(--term-bg); color: var(--term-text); border-radius: var(--r-2); font: 400 11.5px/1.6 var(--f-mono); padding: 10px 12px; height: 420px; overflow: auto; border: 1px solid var(--line); }
.term .ln { white-space: pre-wrap; word-break: break-all; }
.term .ln.new { animation: tkIn .35s var(--ease) both; }
.term .ts { color: var(--term-ts); }
.term .sv-INFO { color: var(--term-info); } .term .sv-WARNING { color: var(--term-warn); } .term .sv-ERROR, .term .sv-CRITICAL { color: var(--term-err); } .term .sv-DEBUG { color: var(--term-debug); } .term .sv-NOTICE { color: var(--term-notice); }
.term .svc { color: var(--term-svc); }
.term-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.caret { display: inline-block; width: 7px; height: 13px; background: var(--term-text); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

pre.json { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-2); padding: 10px 12px; font: 400 11.5px/1.55 var(--f-mono); overflow: auto; max-height: 340px; color: var(--text-2); }
pre.json .k { color: var(--accent); } pre.json .s { color: var(--st-success); } pre.json .n { color: var(--st-retry); } pre.json .b { color: var(--st-dlq); }
pre.trace { margin: 0; background: var(--term-bg); color: var(--term-trace); border-radius: var(--r-2); padding: 10px 12px; font: 400 11px/1.55 var(--f-mono); overflow: auto; max-height: 260px; }

.kv { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 6px 14px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv dd.mono { font-size: 11.5px; }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-2); overflow: hidden; }
.metric-grid > div { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; }
.metric-grid small { color: var(--muted); font-size: 11px; }
.metric-grid b { font: 600 17px var(--f-mono); font-variant-numeric: tabular-nums; }

/* detail */
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.crumbs button { background: none; border: 0; color: var(--text-2); cursor: pointer; padding: 2px 4px; border-radius: var(--r-1); font: inherit; }
.crumbs button:hover { color: var(--accent); background: var(--accent-soft); }
.crumbs .cur { color: var(--text); font-family: var(--f-mono); }
.crumbs svg.ic { width: 13px; height: 13px; }
.summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.summary-ids { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 18px; margin-top: 12px; }
.summary-ids > div { display: grid; gap: 2px; min-width: 0; }
.summary-ids small { color: var(--muted); font-size: 11px; }
.summary-ids span { font: 500 12px var(--f-mono); overflow-wrap: anywhere; }
.statebar { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; }
.statebar > div { flex: 1 0 74px; padding: 6px 6px 5px; border-top: 3px solid var(--line-2); font-size: 10.5px; color: var(--faint); display: grid; gap: 1px; }
.statebar > div.done { border-top-color: var(--tone); color: var(--text-2); }
.statebar > div.now { border-top-color: var(--tone); color: var(--text); background: color-mix(in srgb, var(--tone) 10%, transparent); }
.statebar small { font: 400 10px var(--f-mono); color: var(--muted); }
#dag { display: block; width: 100%; min-width: 720px; height: auto; }
#dag .dnode { cursor: pointer; }
#dag .dnode rect.b { fill: var(--surface-2); stroke: var(--tone); stroke-width: 1.2; }
#dag .dnode.sel rect.b { stroke-width: 2.4; fill: var(--surface-3); }
#dag .dnode.failed rect.b { fill: color-mix(in srgb, var(--st-failed) 12%, var(--surface-2)); stroke-width: 2; }
#dag .dnode .ring { fill: none; stroke: var(--st-failed); stroke-width: 2; opacity: .55; animation: failRing 1.8s ease-out infinite; }
@keyframes failRing { 0% { opacity: .7; } 100% { opacity: 0; } }
#dag .dl { fill: var(--text); font: 600 12px var(--f-ui); }
#dag .ds { fill: var(--muted); font: 400 10.5px var(--f-mono); }
#dag .dt { fill: var(--tone); font: 500 10.5px var(--f-ui); }
#dag .pbg { fill: var(--surface-3); } #dag .pfg { fill: var(--tone); transition: width .6s var(--ease); }
#dag .dedge { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
#dag .dedge.on { stroke: var(--st-success); stroke-opacity: .6; }
#dag .dedge.live { stroke: var(--st-running); stroke-dasharray: 4 6; animation: flow 1s linear infinite; }
#dag .dic { stroke: var(--tone); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.timeline { display: grid; max-height: 520px; overflow: auto; }
.tl-row { display: grid; grid-template-columns: 92px 16px minmax(0, 1fr); gap: 8px; position: relative; padding: 4px 0; cursor: pointer; border-radius: var(--r-1); }
.tl-row:hover { background: var(--surface-2); }
.tl-row::before { content: ""; position: absolute; left: 107px; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
.tl-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tone); margin: 5px 0 0 3.5px; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--surface); }
.tl-row .tt { font: 400 11px/1.6 var(--f-mono); color: var(--muted); text-align: right; }
.tl-row .tn { font: 500 11.5px/1.6 var(--f-mono); }
.tl-row .tn small { font-family: var(--f-ui); color: var(--muted); margin-left: 6px; font-size: 11.5px; }
.tl-row.open { background: var(--surface-2); }
.tl-row .tp { grid-column: 3; margin-top: 4px; }
.tl-sep { font: 600 10px var(--f-mono); letter-spacing: .1em; color: var(--accent); padding: 8px 0 3px 116px; }
.logs { display: grid; max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--term-bg); }
.log { display: grid; grid-template-columns: 96px 64px 140px minmax(0, 1fr); gap: 10px; padding: 3px 10px; font: 400 11.5px/1.6 var(--f-mono); color: var(--term-text); cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, .04); }
.log:hover { background: rgba(255, 255, 255, .04); }
.log .m { white-space: pre-wrap; word-break: break-word; min-width: 0; }
.log .c { color: var(--term-svc); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .t { color: var(--term-ts); }
.log-x { padding: 8px 10px 12px 10px; background: rgba(255, 255, 255, .03); }
.log-x pre { background: rgba(0, 0, 0, .3); color: var(--term-text); border-color: rgba(255,255,255,.08); }
.attempts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.att { border: 1px solid var(--line); border-radius: var(--r-2); padding: 12px; display: grid; gap: 8px; background: var(--surface-2); position: relative; min-width: 0; }
.att.cur { border-color: var(--accent); }
.att-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.att .err { font: 400 11.5px/1.5 var(--f-mono); color: var(--st-failed); background: color-mix(in srgb, var(--st-failed) 8%, transparent); border-radius: var(--r-1); padding: 6px 8px; overflow-wrap: anywhere; }
.att .delta { font-size: 11.5px; color: var(--st-retry); }
.backoff { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--st-retry); font: 500 11px var(--f-mono); }
.minidag { display: flex; gap: 3px; }
.minidag i { flex: 1; height: 5px; border-radius: 2px; background: var(--tone); }

/* modal & toast */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal-card { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-3); box-shadow: var(--shadow); width: min(760px, 100%); max-height: calc(100vh - 32px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: pop .25s var(--ease) both; min-width: 0; }
@keyframes pop { from { transform: scale(.97) translateY(6px); opacity: 0; } }
.modal-h { display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.modal-b { padding: 14px 16px; overflow: auto; min-width: 0; display: grid; gap: 12px; align-content: start; }
.modal-f { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.csvbox { width: 100%; height: 300px; font: 400 11px/1.5 var(--f-mono); background: var(--term-bg); color: var(--term-text); border: 1px solid var(--line); border-radius: var(--r-2); padding: 10px; resize: vertical; white-space: pre; }
.note { display: flex; gap: 8px; padding: 9px 11px; border-radius: var(--r-2); font-size: 12px; line-height: 1.5; background: color-mix(in srgb, var(--tone, var(--accent)) 9%, transparent); border: 1px solid color-mix(in srgb, var(--tone, var(--accent)) 28%, transparent); color: var(--text-2); }
.note svg.ic { color: var(--tone, var(--accent)); margin-top: 2px; }
.note b { color: var(--text); }
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 80; max-width: calc(100vw - 32px); }
.toast { background: var(--surface-3); border: 1px solid var(--line-2); border-left: 3px solid var(--tone, var(--accent)); border-radius: var(--r-2); padding: 9px 12px; font-size: 12.5px; box-shadow: var(--shadow); animation: tkIn .3s var(--ease) both; max-width: 380px; }

/* capacity screen */
.lang-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-3); padding: 14px; display: grid; gap: 12px; position: relative; overflow: hidden; min-width: 0; }
.lcard::after { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 2px; background: var(--lc); opacity: .8; }
.lcard-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.lcard-h b { font-size: 15px; }
.gauge { position: relative; height: 92px; display: grid; place-items: center; }
.gauge svg { width: 150px; height: 92px; }
.gauge .gv { position: absolute; bottom: 4px; text-align: center; font: 600 22px/1 var(--f-mono); }
.gauge .gv small { display: block; font: 400 10.5px var(--f-ui); color: var(--muted); margin-top: 3px; }
.lstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 11.5px; }
.lstats small { color: var(--muted); display: block; }
.lstats b { font: 500 13px var(--f-mono); }
.lstats b.over { color: var(--st-failed); }
.editor { border-top: 1px dashed var(--line-2); padding-top: 12px; display: grid; gap: 10px; }
.editor .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.perm { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* results */
.file-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-3); }
.file-card .fi { width: 42px; height: 42px; border-radius: var(--r-2); display: grid; place-items: center; background: color-mix(in srgb, var(--st-success) 14%, transparent); color: var(--st-success); }
.file-card .fi svg.ic { width: 22px; height: 22px; }
.file-card code { font-size: 12px; overflow-wrap: anywhere; word-break: break-all; }
.file-card > div { min-width: 0; overflow-wrap: anywhere; }
.file-card .tag { white-space: normal; }
[style*="display:grid"] > *, .utt > *, .panel-b > *, .att > *, .confirm > *, .editor > * { min-width: 0; }
.passbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-3); }
.passbar i { display: block; transition: width .6s var(--ease); }
.big-rate { font: 600 40px/1 var(--f-mono); letter-spacing: -.03em; }
.utt { display: grid; gap: 12px; }
.utt-q { font-size: 16px; font-weight: 500; line-height: 1.45; }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cmp > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-2); padding: 10px; display: grid; gap: 4px; min-width: 0; }
.cmp small { color: var(--muted); font-size: 11px; }
.cmp .mismatch { color: var(--st-failed); }
.score { display: flex; align-items: center; gap: 10px; }
.score .meter { flex: 1; height: 8px; }

/* dlq */
.cat-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.cat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; color: inherit; }
.cat:hover { border-color: var(--line-2); }
.cat[aria-pressed="true"] { border-color: var(--st-dlq); background: color-mix(in srgb, var(--st-dlq) 8%, var(--surface)); }
.cat .cn { font: 600 20px var(--f-mono); }
.cat small { color: var(--muted); font-size: 11px; }
.cat .ch { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 500; }
.confirm { border: 1px solid color-mix(in srgb, var(--st-retry) 45%, transparent); background: color-mix(in srgb, var(--st-retry) 6%, var(--surface)); border-radius: var(--r-2); padding: 12px; display: grid; gap: 10px; animation: pop .22s var(--ease) both; }
.steps { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.steps b { color: var(--text); }
.steps .on { color: var(--st-retry); }

.callout { border-left: 3px solid var(--tone); padding: 10px 14px; background: color-mix(in srgb, var(--tone) 8%, transparent); border-radius: 0 var(--r-2) var(--r-2) 0; font-size: 12.5px; }
.callout b { color: var(--tone); }
.drift { color: var(--st-retry); font-weight: 600; }

/* page-load orchestration */
.boot .nav { animation: navIn .5s var(--ease) both; }
.boot .strip { animation: fade .5s .1s both; }
.boot #rail .node { animation: nodeIn .5s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 150ms); }
.boot #rail .edge { stroke-dasharray: 600; animation: draw 1s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 250ms); }
.boot #rail .edge.flow { animation: draw 1s var(--ease) both, flow 1.2s linear infinite 1.4s; }
.boot .kpis, .boot .boot-late { animation: viewIn .5s .55s var(--ease) both; }
@keyframes navIn { from { transform: translateX(-16px); opacity: 0; } }
@keyframes nodeIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
#rail .node { transform-box: fill-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; animation-delay: 0ms !important; }
  #rail .edge.flow { stroke-dasharray: none; }
  .boot #rail .edge { stroke-dasharray: none; }
}

/* responsive */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi:nth-child(5) { border-left: 0; }
  .kpi:nth-child(n+5) { border-top: 1px solid var(--line); }
  .lang-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .g-7-5, .g-5-7, .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .nav { grid-row: 3; grid-column: 1; flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--line); padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .brand, .nav-spacer, .mock-mark { display: none; }
  .nav-btn { min-width: 64px; }
  .nav-btn[aria-current="page"]::before { left: 10px; right: 10px; top: -4px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  .strip, main { grid-column: 1; }
  .strip { padding: 8px 16px; gap: 10px; }
  .strip .mock-inline { display: inline-flex !important; }
  .gcap { min-width: 120px; }
  .screen { padding: 14px 16px 30px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .lang-cards { grid-template-columns: minmax(0, 1fr); }
  .cap-row { grid-template-columns: 56px minmax(0, 1fr); }
  .cap-row .cap-meta { grid-column: 1 / -1; text-align: left; }
  .file-card { grid-template-columns: auto minmax(0, 1fr); }
  .file-card > :last-child { grid-column: 1 / -1; }
  .summary { grid-template-columns: minmax(0, 1fr); }
  .cmp { grid-template-columns: minmax(0, 1fr); }
  .log { grid-template-columns: 80px 56px minmax(0, 1fr); }
  .log .c { display: none; }
  .editor .row3 { grid-template-columns: minmax(0, 1fr); }
}
.mock-inline { display: none; }

/* ── QA pass: fluid tables, tail identity, inline confirms ── */
.tbl.fluid td { white-space: normal; overflow-wrap: anywhere; }
.tbl.fluid td .pill, .tbl.fluid td .lang, .tbl.fluid td .tag { white-space: nowrap; }

  const from = el._v == null ? to : el._v; el._v = to;
  if (RM.matches || from === to || !isFinite(from) || !isFinite(to)) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), D = 600;
  cancelAnimationFrame(el._raf);
  const step = t => { const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

const HIST = {};
(function seedHist() {
  const fm = M.metrics.fiveMin, n = fm.ts.length, take = 36;
  const sumAt = (obj, i) => LANGS.reduce((a, l) => a + (obj[l][i] || 0), 0);
  const c = stageCounts();
  Object.keys(POS).forEach(id => {
    const arr = [];
    for (let k = take; k > 0; k--) {
      const i = Math.max(0, n - k);
      let v;
      if (id === 'registry_queue') v = sumAt(fm.queue, i);
      else if (id === 'vertex') v = sumAt(fm.active, i) * 0.75;
      else if (id === 'gcs_input' || id === 'event_bus') v = sumAt(fm.utterances, i) / 100;
      else if (id === 'results') v = sumAt(fm.completed, i);
      else v = Math.max(0, c[id] + Math.round(Math.sin(k * 0.32 + id.length) * 1.4 + Math.sin(k * 0.11) * 0.8));
      arr.push(v);
    }
    arr.push(c[id]); HIST[id] = arr;
  });
})();
function pushHist(c) { Object.keys(HIST).forEach(id => { let v = c[id]; if (id === 'results' || id === 'gcs_input' || id === 'event_bus') { const fm = M.metrics.fiveMin, i = fm.ts.length - 1; v = id === 'results' ? LANGS.reduce((a, l) => a + fm.completed[l][i], 0) : LANGS.reduce((a, l) => a + fm.utterances[l][i], 0) / 100; } HIST[id].push(v); if (HIST[id].length > 37) HIST[id].shift(); }); }
function sparkPath(arr, x, y, w, h) {
  const max = Math.max(1, ...arr), min = Math.min(...arr), span = Math.max(1, max - min);

  const line = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
  return { line, area: line + ` L${x + w},${y + h} L${x},${y + h} Z`, end: pts[pts.length - 1] };
}

function validateRetry(sec) {

  if (v('cf-b2') === '' || !Number.isInteger(b2) || b2 < 10 || b2 > 3600) errs['cf-b2'] = '10–3600초 정수';
  else if (!errs['cf-b1'] && b2 < b1) errs['cf-b2'] = `backoff 2는 backoff 1(${b1}s) 이상이어야 합니다`;
  if (v('cf-wto') === '' || !Number.isInteger(wto) || wto < 10 || wto > 360) errs['cf-wto'] = '10–360분 정수';
  if (v('cf-pto') === '' || !Number.isInteger(pto) || pto < 10 || pto > 360) errs['cf-pto'] = '10–360분 정수';
  else if (!errs['cf-wto'] && pto > wto) errs['cf-pto'] = `Pipeline timeout은 Workflow timeout(${wto}분) 이하여야 합니다`;
  ['cf-retries', 'cf-b1', 'cf-b2', 'cf-wto', 'cf-pto'].forEach(id => { const i = $('#' + id, sec); i.setAttribute('aria-invalid', String(!!errs[id])); const e = $('#' + id + '-err', sec); e.hidden = !errs[id]; e.innerHTML = errs[id] ? `${ic('alert-triangle')}${esc(errs[id])}` : ''; });

    <div class="grid g2">
      <div class="panel"><div class="panel-h"><div class="h2">${ic('gauge')}Language · Global Capacity</div><button class="btn sm" data-go="capacity">Capacity 화면에서 편집 ${ic('chevron-right')}</button></div><div class="panel-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>언어</th><th class="r">maxConcurrent</th><th class="r">starts/min</th><th class="r">weight</th><th class="r">batch</th><th>상태</th></tr></thead><tbody>
        ${M.languages.map(l => `<tr><td>${lang(l.code)} ${esc(l.name)}</td><td class="r mono">${l.maxConcurrent}</td><td class="r mono">${l.maxStartsPerMinute}</td><td class="r mono">${l.priorityWeight}</td><td class="r mono">${l.batchSize}</td><td>${l.paused ? `<span class="pill sm t-cancelled">${ic('pause')}일시 중지</span>` : `<span class="pill sm t-success">${ic('check')}활성</span>`}</td></tr>`).join('')}
        <tr><td><b>Global</b></td><td class="r mono"><b>${C.global.maxConcurrent}</b></td><td class="r mono">${C.global.maxStartsPerMinute}</td><td colspan="3" class="sub">언어별 합계 ${M.languages.reduce((a, l) => a + l.maxConcurrent, 0)}</td></tr></tbody></table></div></div></div>
      <div class="panel"><div class="panel-h"><div class="h2">${ic('rotate-ccw')}Retry · Timeout</div></div><div class="panel-b" style="display:grid;gap:10px">
        <div class="filters" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">
          <label class="field"><span>maxRetries (자동 재실행)</span><input class="inp mono" type="number" id="cf-retries" min="0" max="${C.retry.maxAttempts - 1}" step="1" value="${C.retry.maxRetries}" aria-describedby="cf-retries-err">${fe('cf-retries')}</label>
          <label class="field"><span>backoff 1 (s)</span><input class="inp mono" type="number" id="cf-b1" min="10" step="1" value="${C.retry.backoffSeconds[0]}" aria-describedby="cf-b1-err">${fe('cf-b1')}</label>
          <label class="field"><span>backoff 2 (s)</span><input class="inp mono" type="number" id="cf-b2" min="10" step="1" value="${C.retry.backoffSeconds[1]}" aria-describedby="cf-b2-err">${fe('cf-b2')}</label>
          <label class="field"><span>Workflow timeout (분)</span><input class="inp mono" type="number" id="cf-wto" min="10" step="1" value="${C.workflowTimeoutMin}" aria-describedby="cf-wto-err">${fe('cf-wto')}</label>
          <label class="field"><span>Pipeline timeout (분)</span><input class="inp mono" type="number" id="cf-pto" min="10" step="1" value="${C.pipelineTimeoutMin}" aria-describedby="cf-pto-err">${fe('cf-pto')}</label>
          <label class="field"><span>Reservation lease (분)</span><input class="inp mono" type="number" id="cf-lease" value="${C.reservationLeaseMin}" disabled></label>
        </div>
        <div class="note">${ic('info')}<span>최대 자동 실행 횟수는 <b>${C.retry.maxAttempts}회로 고정</b>(계획서 §4.3)이며 maxRetries는 ${C.retry.maxAttempts - 1}을 넘을 수 없습니다. 재시도 불가: ${C.retry.nonRetryable.map(x => `<span class="tag">${x}</span>`).join(' ')} · 제한적 Retry: ${Object.entries(C.retry.limitedRetry).map(([k, v]) => `<span class="tag">${k} ${v}회</span>`).join(' ')}</span></div>
        <label class="field"><span>변경 사유</span><input class="inp" id="cf-rt-reason" placeholder="예: LLM Judge 지연 대응"></label>
        <div style="display:flex;justify-content:flex-end"><button class="btn sm primary" id="cf-rt-save" ${can('config.write') ? '' : 'disabled'}>${ic('check')}적용</button></div></div></div>
      <div class="panel"><div class="panel-h"><div class="h2">${ic('list-ordered')}Queue Priority</div></div><div class="panel-b" style="display:grid;gap:10px">
        <div class="filters" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
          <label class="field"><span>언어 내 선택</span><select class="inp" id="cf-qmode">${['PRIORITY_THEN_FIFO', 'FIFO'].map(v => opt(v, v, C.queuePolicy.mode)).join('')}</select></label>
          <label class="field"><span>언어 간 배분</span><select class="inp" id="cf-qcross">${['WEIGHTED_ROUND_ROBIN', 'DEFICIT_ROUND_ROBIN', 'STRICT_PRIORITY'].map(v => opt(v, v, C.queuePolicy.crossLanguage)).join('')}</select></label>
          <label class="field"><span>Aging (+1 / N분)</span><input class="inp mono" type="number" id="cf-aging" value="${C.queuePolicy.aging.boostPerMinutes}"></label>
          <label class="field"><span>최대 boost</span><input class="inp mono" type="number" id="cf-maxboost" value="${C.queuePolicy.aging.maxBoost}"></label>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12.5px"><button class="toggle" role="switch" id="cf-aging-on" aria-checked="${C.queuePolicy.aging.enabled}" aria-label="Aging 사용"></button>Starvation 방지 Aging 사용 <span class="sub">(아래 사유와 함께 적용)</span></div>
        <label class="field"><span>변경 사유</span><input class="inp" id="cf-q-reason" placeholder="예: ko 적체 시 es 기아 방지"></label>
        <div style="display:flex;justify-content:flex-end"><button class="btn sm primary" id="cf-q-save" ${can('config.write') ? '' : 'disabled'}>${ic('check')}적용</button></div></div></div>
      <div class="panel"><div class="panel-h"><div class="h2">${ic('users')}운영자 권한</div></div><div class="panel-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>권한</th><th>Viewer</th><th>Operator</th><th>Admin</th></tr></thead><tbody>${C.rolePermissions.map(p => `<tr><td>${esc(p.permission)}</td>${['Viewer', 'Operator', 'Admin'].map(r => `<td>${p[r] ? `<span style="color:var(--st-success)" aria-label="허용">${ic('check')}</span>` : `<span style="color:var(--faint)" aria-label="불가">—</span>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div style="margin-top:10px;display:grid;gap:4px">${M.operators.map(o => `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px"><span>${esc(o.name)} <span class="sub">${esc(o.team)}</span></span><span class="tag">${o.role}</span></div>`).join('')}</div></div></div>
    </div>
    <div class="panel"><div class="panel-h"><div class="h2">${ic('layers')}Pipeline Version</div><span class="sub">default ${esc(C.defaultPipelineVersion)} · 승격은 사유 입력 후 적용</span></div><div class="panel-b"><div class="tbl-wrap"><table class="tbl fluid"><thead><tr><th>버전</th><th>상태</th><th class="r">트래픽</th><th>모델 · Judge</th><th>릴리스</th><th>메모 · Template</th><th>기본 버전</th></tr></thead><tbody>
        ${C.pipelineVersionDetails.map(v => `<tr><td class="mono nw"><b>${esc(v.version)}</b></td><td>${verPill(v.status)}</td><td class="r mono nw">${v.trafficPct}%</td><td style="min-width:170px"><div class="mono" style="font-size:11.5px">${esc(v.modelUnderTest)}</div><div class="mono-sub">judge ${esc(v.judgeModel)}</div></td><td class="mono nw">${F.date(v.releasedAt)}</td><td style="min-width:260px">${esc(v.notes || '')}<div class="mono-sub">${esc(v.templateUri)}</div></td><td class="nw">${v.version === C.defaultPipelineVersion ? `<span class="pill sm t-success">${ic('check')}현재 기본값</span>` : v.status !== 'DEPRECATED' ? `<button class="btn sm" data-promote="${v.version}" ${can('version.promote') ? '' : 'disabled'}>${ic('chevron-right')}기본값으로</button>` : '<span class="sub">승격 불가</span>'}</td></tr>`).join('')}
      </tbody></table></div><div id="cf-promote"></div></div></div>
    <div class="panel"><div class="panel-h"><div class="h2">${ic('cpu')}서비스 활성화 상태</div><span class="sub">스위치를 누르면 사유 입력 후 적용됩니다</span></div><div class="panel-b"><div class="tbl-wrap"><table class="tbl fluid" id="cf-svc-tbl"><thead><tr><th>활성</th><th>서비스</th><th>상태</th><th>버전 · revision</th><th class="r">인스턴스</th><th class="r">오류율</th><th class="r">p95</th></tr></thead><tbody>
        ${C.services.map(s => `<tr><td class="nw"><span class="toggle-cell"><button class="toggle" role="switch" data-svc="${s.id}" aria-checked="${s.enabled}" aria-label="${esc(s.name)} 활성" ${can('config.write') ? '' : 'disabled'}></button><small>${s.enabled ? '켜짐' : '꺼짐'}</small></span></td><td style="min-width:170px"><b>${esc(s.name)}</b><div class="mono-sub">${esc(s.runtime)}</div></td><td style="min-width:150px"><span class="pill sm t-${s.status === 'HEALTHY' ? 'success' : 'retry'}">${ic(s.status === 'HEALTHY' ? 'check-circle' : 'alert-triangle')}${s.status}</span>${s.note ? `<div class="sub" style="margin-top:2px">${esc(s.note)}</div>` : ''}</td><td><div class="mono-sub">${esc(s.version)} · ${esc(s.revision)}</div></td><td class="r mono nw">${s.instances} <span class="sub">(${s.minInstances}–${s.maxInstances})</span></td><td class="r mono nw">${F.pct(s.errorRate, 2)}</td><td class="r mono nw">${s.p95LatencyMs}ms</td></tr>`).join('')}</tbody></table></div></div></div>
    <div class="panel"><div class="panel-h"><div class="h2">${ic('bell')}알림 정책</div><span class="sub">계획서 §7.5 · 스위치를 누르면 사유 입력 후 적용됩니다</span></div><div class="panel-b"><div class="tbl-wrap"><table class="tbl fluid" id="cf-ap-tbl"><thead><tr><th>사용</th><th>정책</th><th>조건</th><th>심각도</th><th>채널</th></tr></thead><tbody>
        ${C.alertPolicies.map(p => `<tr><td class="nw"><span class="toggle-cell"><button class="toggle" role="switch" data-ap="${p.id}" aria-checked="${p.enabled}" aria-label="${esc(p.name)}" ${can('config.write') ? '' : 'disabled'}></button><small>${p.enabled ? '켜짐' : '꺼짐'}</small></span></td><td style="min-width:220px"><b>${esc(p.name)}</b><div class="mono-sub">${esc(p.metric)}</div></td><td style="min-width:180px"><span class="mono" style="font-size:11.5px">${esc(p.condition)}</span></td><td>${sevPill(p.severity)}</td><td class="nw"><div class="mono" style="font-size:11px;color:var(--muted);line-height:1.5">${p.channels.map(esc).join('<br>')}</div></td></tr>`).join('')}</tbody></table></div></div></div>
    <div class="panel"><div class="panel-h"><div class="h2">${ic('shield')}감사 로그</div><select class="inp" id="cf-audit-f" style="width:auto" aria-label="Action 필터">${opt('', '전체 Action', S.auditF || '')}${Object.keys(AUDIT_TONE).map(a => opt(a, a, S.auditF || '')).join('')}</select></div><div class="panel-b" id="cf-audit">${auditHTML()}</div></div>`;
  hydrateIcons(sec);
  const rer = () => { const st = $('#main').scrollTop; R.config(sec); hydrateIcons(sec); $('#main').scrollTop = st; };
  const paintAudit = () => { const a = $('#cf-audit'); if (a) { a.innerHTML = auditHTML(); hydrateIcons(a); } auditLen = M.audit.length; };
  ['cf-retries', 'cf-b1', 'cf-b2', 'cf-wto', 'cf-pto'].forEach(id => { $('#' + id, sec).addEventListener('input', () => validateRetry(sec)); });
  validateRetry(sec);
  $('#cf-rt-save', sec).onclick = () => {
    const errs = validateRetry(sec); const k = Object.keys(errs);
    if (k.length) { toast(`${ic('alert-triangle')} 입력값을 확인하세요 · ${esc(errs[k[0]])}`, 'failed'); $('#' + k[0], sec).focus(); return; }
    cfgSave('Retry · Timeout', reason => {
      const mr = +$('#cf-retries').value, b = [+$('#cf-b1').value, +$('#cf-b2').value];
      M.actions.updateRetryPolicy({ maxRetries: mr, backoffSeconds: b }, { operator: S.operator, reason });
      const wto = +$('#cf-wto').value, pto = +$('#cf-pto').value;
      if (wto !== C.workflowTimeoutMin || pto !== C.pipelineTimeoutMin) { const before = { workflowTimeoutMin: C.workflowTimeoutMin, pipelineTimeoutMin: C.pipelineTimeoutMin }; C.workflowTimeoutMin = wto; C.pipelineTimeoutMin = pto; C.runtimeConfig.workflowTimeoutMin = wto; C.runtimeConfig.pipelineTimeoutMin = pto; localAudit('CONFIG_UPDATED', 'timeouts', before, { workflowTimeoutMin: wto, pipelineTimeoutMin: pto }, reason); }
      rer();
    }, 'cf-rt-reason');
  };
  $('#cf-aging-on', sec).onclick = e => { const b = e.currentTarget; b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true')); };
  $('#cf-q-save', sec).onclick = () => cfgSave('Queue Priority', reason => { const before = JSON.parse(JSON.stringify(C.queuePolicy)); C.queuePolicy.mode = $('#cf-qmode').value; C.queuePolicy.crossLanguage = $('#cf-qcross').value; C.queuePolicy.aging = { enabled: $('#cf-aging-on').getAttribute('aria-checked') === 'true', boostPerMinutes: +$('#cf-aging').value, maxBoost: +$('#cf-maxboost').value }; localAudit('CONFIG_UPDATED', 'queuePolicy', before, JSON.parse(JSON.stringify(C.queuePolicy)), reason); rer(); }, 'cf-q-reason');
  $$('[data-promote]', sec).forEach(b => b.onclick = () => { const v = b.dataset.promote; const box = $('#cf-promote', sec); const vc = M.metrics.versionComparison().find(x => x.version === v);
    box.innerHTML = `<div class="confirm" style="margin-top:10px"><div class="note t-retry">${ic('alert-triangle')}<span><b>${esc(v)}</b>을 기본 버전으로 승격합니다. 실행 중 PipelineJob은 기존 버전을 유지하고 신규 배치부터 적용됩니다.${v === 'v1.2-rc' ? ' device_control 캡슐 회귀(Analytics 참조)가 있습니다.' : ''} 발화 Pass rate ${vc ? F.pct(vc.utterancePassRate, 1) : '-'}</span></div><label class="field"><span>승격 사유 (필수)</span><input class="inp" id="pr-reason"></label><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn sm" id="pr-no">닫기</button><button class="btn sm primary" id="pr-yes">${ic('check')}승격</button></div></div>`;
    hydrateIcons(box); $('#pr-reason').focus(); $('#pr-no').onclick = () => box.innerHTML = '';
    $('#pr-yes').onclick = () => { const r = $('#pr-reason').value.trim(); if (!r) { toast('승격 사유를 입력하세요', 'retry'); return; } const before = C.defaultPipelineVersion; C.defaultPipelineVersion = v; C.runtimeConfig.defaultPipelineVersion = v; localAudit('PIPELINE_VERSION_PROMOTED', 'pipeline_version', { default: before }, { default: v }, r); toast(`${ic('check')} 기본 버전 ${esc(v)}`, 'success'); rer(); };
  });
  $$('[data-svc]', sec).forEach(b => b.onclick = () => { const s = C.services.find(x => x.id === b.dataset.svc); const to = !s.enabled;
    toggleConfirm(sec, b, { title: s.name, from: s.enabled ? '활성' : '비활성', to: to ? '활성' : '비활성', note: to ? '' : '비활성화하면 이 서비스가 처리하던 단계의 신규 작업이 멈춥니다. 진행 중 작업은 끝까지 진행됩니다.',
      onApply: reason => { s.enabled = to; localAudit('CONFIG_UPDATED', 'service:' + s.id, { enabled: !to }, { enabled: to }, reason); b.setAttribute('aria-checked', String(to)); b.nextElementSibling.textContent = to ? '켜짐' : '꺼짐'; toast(`${esc(s.name)} ${to ? '활성화' : '비활성화'} · 감사 로그 기록`, to ? 'success' : 'retry'); paintAudit(); } }); });
  $$('[data-ap]', sec).forEach(b => b.onclick = () => { const p = C.alertPolicies.find(x => x.id === b.dataset.ap); const to = !p.enabled;
    toggleConfirm(sec, b, { title: '알림 정책 · ' + p.name, from: p.enabled ? '사용' : '사용 안 함', to: to ? '사용' : '사용 안 함', note: to ? '' : `끄면 ${p.channels.join(', ')}로 가는 알림이 중단됩니다.`,
      onApply: reason => { p.enabled = to; localAudit('CONFIG_UPDATED', 'alertPolicy:' + p.id, { enabled: !to }, { enabled: to }, reason); b.setAttribute('aria-checked', String(to)); b.nextElementSibling.textContent = to ? '켜짐' : '꺼짐'; toast(`${esc(p.name)} 알림 ${to ? '사용' : '중지'} · 감사 로그 기록`, to ? 'success' : 'retry'); paintAudit(); } }); });
  $('#cf-audit-f', sec).onchange = e => { S.auditF = e.target.value; paintAudit(); };
};
let auditLen = M.audit.length;
LIVE.config = sec => { if (M.audit.length !== auditLen) { auditLen = M.audit.length; const a = $('#cf-audit'); if (a) { a.innerHTML = auditHTML(); hydrateIcons(a); } } };

/* ───────────── boot ───────────── */
hydrateIcons(document);
setThemeIcon(); setSimUI(); renderStrip();
(function boot() {
  let h = ''; try { h = (location.hash || '').replace('#', ''); } catch (e) { }
  go(SCREENS[h] && h !== 'detail' ? h : 'orch');
  if (RM.matches) $('#app').classList.remove('boot');
  sim.start(); setSimUI();
})();
</script>
