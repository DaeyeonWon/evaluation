<title>AIPO Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept — "Atlas": the §3.1 architecture is a pannable blueprint drawing that fills the screen; every other screen is a numbered drawing sheet under one horizontal tab strip, and a docked inspector reads whichever node you pick. */
:root{
  /* paper + ink */
  --paper:#edf1f4; --paper-2:#e3e9ee; --sheet:#f9fbfc; --sheet-2:#f2f5f8;
  --ink:#13233a; --ink-2:#44556b; --ink-3:#77849a; --ink-inv:#f9fbfc;
  --rule:#bfccd9; --rule-2:#d8e0e8; --grid:#dbe3ea; --grid-major:#c7d3de;
  --accent:#0a6c85; --accent-2:#0d87a6; --accent-soft:rgba(10,108,133,.10); --accent-ink:#ffffff;
  --mark:#b4552a; /* engineering redline used for annotations only */
  --shadow:0 1px 0 rgba(19,35,58,.04),0 6px 22px -10px rgba(19,35,58,.28);
  --overlay:rgba(19,35,58,.38);
  /* standardized status */
  --st-success:#1f8f4e; --st-running:#2a78d6; --st-queued:#7a8190; --st-retry:#c27a00; --st-failed:#d23f3f; --st-dlq:#7d3cc8; --st-cancelled:#5c6370;
  /* language series */
  --lg-ko:#2a78d6; --lg-en:#eb6834; --lg-ja:#1baf7a; --lg-es:#eda100;
  /* non-entity series (metrics, versions, cost lines) — never reuse language hues */
  --sx-metric:#0a6c85; --ver-1:#9aa8b6; --ver-2:#4f6378; --ver-3:#0d9bb8;
  --cost-1:#0a6c85; --cost-2:#8a5cd0; --cost-3:#c2417a; --cost-4:#4f4fc9; --cost-5:#8d6e4a; --cost-6:#6a8f1f; --cost-7:#a3adb8;
  /* type */
  --f-ui:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Gothic A1",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --t-xs:11px; --t-sm:12px; --t-md:13px; --t-lg:15px; --t-xl:20px; --t-2xl:28px;
  --top-h:56px; --insp-w:420px; --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a141e; --paper-2:#07101a; --sheet:#0f1c29; --sheet-2:#132333;
    --ink:#dbe5ee; --ink-2:#9fb1c3; --ink-3:#6c8094; --ink-inv:#0a141e;
    --rule:#26394d; --rule-2:#1b2c3d; --grid:#111f2c; --grid-major:#18293a;
    --accent:#3dbfdb; --accent-2:#6fd3ea; --accent-soft:rgba(61,191,219,.13); --accent-ink:#04202a;
    --mark:#e08a5c;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.7);
    --overlay:rgba(3,8,14,.62);
    --st-success:#3fb871; --st-running:#3987e5; --st-queued:#9aa0aa; --st-retry:#e0a42a; --st-failed:#e66767; --st-dlq:#a77ff0; --st-cancelled:#8b929c;
    --lg-ko:#3987e5; --lg-en:#d95926; --lg-ja:#199e70; --lg-es:#c98500;
    --sx-metric:#3dbfdb; --ver-1:#5f7489; --ver-2:#a3b4c6; --ver-3:#3dbfdb;
    --cost-1:#3dbfdb; --cost-2:#a98ae8; --cost-3:#e0679b; --cost-4:#8b8bf0; --cost-5:#c39d6f; --cost-6:#9cc243; --cost-7:#6c7a89;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a141e; --paper-2:#07101a; --sheet:#0f1c29; --sheet-2:#132333;
  --ink:#dbe5ee; --ink-2:#9fb1c3; --ink-3:#6c8094; --ink-inv:#0a141e;
  --rule:#26394d; --rule-2:#1b2c3d; --grid:#111f2c; --grid-major:#18293a;
  --accent:#3dbfdb; --accent-2:#6fd3ea; --accent-soft:rgba(61,191,219,.13); --accent-ink:#04202a;
  --mark:#e08a5c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.7);
  --overlay:rgba(3,8,14,.62);
  --st-success:#3fb871; --st-running:#3987e5; --st-queued:#9aa0aa; --st-retry:#e0a42a; --st-failed:#e66767; --st-dlq:#a77ff0; --st-cancelled:#8b929c;
  --lg-ko:#3987e5; --lg-en:#d95926; --lg-ja:#199e70; --lg-es:#c98500;
  --sx-metric:#3dbfdb; --ver-1:#5f7489; --ver-2:#a3b4c6; --ver-3:#3dbfdb;
  --cost-1:#3dbfdb; --cost-2:#a98ae8; --cost-3:#e0679b; --cost-4:#8b8bf0; --cost-5:#c39d6f; --cost-6:#9cc243; --cost-7:#6c7a89;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-md)/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:stretch;gap:0;min-height:var(--top-h);background:var(--sheet);border-bottom:1px solid var(--rule);padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;padding-right:18px;border-right:1px solid var(--rule-2);flex:none}
.brand svg{width:26px;height:26px}
.brand b{font-weight:800;font-size:15px;letter-spacing:.01em}
.brand small{display:block;font:500 10px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.08em;margin-top:3px}
.tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-left:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:0 12px;display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:600;font-size:var(--t-md);cursor:pointer;white-space:nowrap;position:relative}
.tab .no{font:500 10px var(--f-mono);color:var(--ink-3)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent)}
.tab .cnt{font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:2px;background:color-mix(in srgb,var(--st-dlq) 16%,transparent);color:var(--st-dlq)}
.tools{display:flex;align-items:center;gap:8px;flex:none;padding-left:10px}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);color:var(--ink);font-weight:600;font-size:var(--t-sm);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--ink-3);background:var(--sheet-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 45%,var(--rule))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:24px;padding:0 8px;font-size:var(--t-xs)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.icon{width:30px;padding:0;justify-content:center}
.kbd{font:500 10px var(--f-mono);border:1px solid var(--rule);border-bottom-width:2px;padding:1px 4px;border-radius:2px;color:var(--ink-3)}
.search-btn{min-width:200px;justify-content:flex-start;color:var(--ink-3);font-weight:500}
.search-btn .kbd{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;height:30px}
.seg button{appearance:none;border:0;background:var(--sheet);padding:0 8px;font:600 11px var(--f-mono);color:var(--ink-2);cursor:pointer;border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-inv)}
.clock{font:500 11px/1.2 var(--f-mono);color:var(--ink-2);text-align:right}
.clock b{display:block;color:var(--ink);font-size:12px}
.mock{font:700 10px/1 var(--f-mono);letter-spacing:.12em;padding:5px 7px;border:1px dashed var(--mark);color:var(--mark);border-radius:2px;white-space:nowrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--st-success);display:inline-block;box-shadow:0 0 0 0 color-mix(in srgb,var(--st-success) 60%,transparent);animation:pulse 1.8s infinite}
.paused .live-dot{background:var(--st-queued);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st-success) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- status pills ---------- */
.tone-success{--tc:var(--st-success)} .tone-running{--tc:var(--st-running)} .tone-queued{--tc:var(--st-queued)} .tone-retry{--tc:var(--st-retry)} .tone-failed{--tc:var(--st-failed)} .tone-dlq{--tc:var(--st-dlq)} .tone-cancelled{--tc:var(--st-cancelled)}
.pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px 0 6px;border-radius:2px;font-size:var(--t-xs);font-weight:700;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc) 30%,transparent);white-space:nowrap}
.pill.solid{background:var(--tc);color:var(--sheet);border-color:var(--tc)}
.tone-running .ico.spin{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lang{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-mono);text-transform:uppercase}
.lang::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lc)}
.lg-ko{--lc:var(--lg-ko)} .lg-en{--lc:var(--lg-en)} .lg-ja{--lc:var(--lg-ja)} .lg-es{--lc:var(--lg-es)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--rule);border-radius:2px;font:500 11px var(--f-mono);color:var(--ink-2);background:var(--sheet)}
.sev-ERROR,.sev-CRITICAL{color:var(--st-failed)} .sev-WARNING{color:var(--st-retry)} .sev-NOTICE{color:var(--st-running)} .sev-INFO{color:var(--ink-2)} .sev-DEBUG{color:var(--ink-3)}

/* ---------- views ---------- */
main{position:relative}
.view{animation:viewIn .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet{padding:20px 16px 48px;max-width:1520px;margin:0 auto;display:grid;gap:18px}
@media (min-width:720px){.sheet{padding-inline:24px}}
.sheet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.sheet-head h1{margin:0;font-size:var(--t-2xl);font-weight:800;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.sheet-head .dwg{font:500 11px var(--f-mono);color:var(--ink-3);letter-spacing:.06em;display:block;margin-bottom:6px}
.sheet-head p{margin:6px 0 0;color:var(--ink-2);max-width:68ch}
.sheet-head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:500 12px var(--f-mono);color:var(--ink-3)}
.crumbs button{appearance:none;border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit}
.crumbs .sep{opacity:.6}
.plate{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);min-width:0;position:relative}
.plate>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.plate>header h2{margin:0;font-size:var(--t-lg);font-weight:700}
.plate>header .ref{font:500 10px var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.plate .body{padding:14px;min-width:0}
.plate .body>*{min-width:0}
.plate.flush .body{padding:0}
.plate::before,.plate::after{content:"";position:absolute;width:7px;height:7px;border:1.5px solid var(--ink-3);pointer-events:none}
.plate::before{top:-4px;left:-4px;border-right:0;border-bottom:0}
.plate::after{bottom:-4px;right:-4px;border-left:0;border-top:0}
.grid{display:grid;gap:18px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.split{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.split.s-73{grid-template-columns:minmax(0,7fr) minmax(0,3fr)}.split.s-64{grid-template-columns:minmax(0,6fr) minmax(0,4fr)}.split.s-55{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.split.s-46{grid-template-columns:minmax(0,4fr) minmax(0,6fr)}}
.chart{height:250px;width:100%}
.chart.tall{height:320px}
.chart.short{height:190px}

/* KPI strip — measurement readouts, one ruled bar, not tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r)}
.kpi{padding:12px 14px 12px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-width:0;position:relative}
.kpi .k{font-size:var(--t-xs);color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font:600 26px/1.15 var(--f-mono);letter-spacing:-.02em;margin-top:6px;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--ink-3);margin-left:3px;font-weight:500}
.kpi .s{font:500 11px var(--f-mono);color:var(--ink-3);margin-top:2px}
.kpi[data-tone]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--tc)}
button.kpi{appearance:none;text-align:left;background:none;border-top:0;border-left:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;font:inherit;color:inherit}
button.kpi:hover{background:var(--sheet-2)}

/* tables */
.tbl-wrap{overflow:auto;max-width:100%;
  /* scroll affordance: edge shadows appear only while more columns are hidden */
  background:linear-gradient(to right,var(--sheet) 30%,transparent) left center/36px 100% no-repeat local,linear-gradient(to left,var(--sheet) 30%,transparent) right center/36px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/12px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/12px 100% no-repeat scroll}
.t td.cellwrap{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
table.t{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.t th{position:sticky;top:0;z-index:1;background:var(--sheet-2);text-align:left;font-weight:700;font-size:var(--t-xs);color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle;white-space:nowrap}
.t td.wrap{white-space:normal;min-width:220px}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--accent-soft)}
.t tr.sel td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.t tr.flash td{animation:rowflash 1.2s ease-out}
@keyframes rowflash{from{background:color-mix(in srgb,var(--accent) 24%,transparent)}to{background:transparent}}
.t .r{text-align:right}
.idc{font:500 12px var(--f-mono);color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:var(--t-sm)}
.empty b{display:block;color:var(--ink-2);font-size:var(--t-md);margin-bottom:4px}

/* form */
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:var(--t-xs);font-weight:700;color:var(--ink-2)}
.in,select.in,textarea.in{height:30px;padding:0 9px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);min-width:0;width:100%}
textarea.in{height:auto;min-height:64px;padding:7px 9px;resize:vertical}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));align-items:end}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
@media (min-width:560px){.filters .f-wide{grid-column:span 2}}
.chipset button{appearance:none;height:26px;padding:0 9px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px;font-size:var(--t-xs);font-weight:600;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.chipset button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--sheet-2);box-shadow:inset 0 -2px 0 var(--accent)}
.note{font-size:var(--t-sm);color:var(--ink-2);padding:9px 11px;border-left:2px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.note.warn{border-color:var(--st-retry);background:color-mix(in srgb,var(--st-retry) 10%,transparent)}
.note.bad{border-color:var(--st-failed);background:color-mix(in srgb,var(--st-failed) 9%,transparent)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;font-size:var(--t-sm)}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd.mono{font-size:12px}
pre.code{margin:0;font:12px/1.55 var(--f-mono);background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r);padding:10px 12px;overflow:auto;max-height:340px;white-space:pre;color:var(--ink)}
.j-k{color:var(--accent)} .j-s{color:var(--st-success)} .j-n{color:var(--st-retry)} .j-b{color:var(--st-dlq)} .j-z{color:var(--ink-3)}
.bar{height:6px;background:var(--paper-2);border-radius:1px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--tc,var(--accent));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.toast-wrap{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:90;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--ink-inv);padding:10px 14px;border-radius:var(--r);font-size:var(--t-sm);box-shadow:var(--shadow);animation:toastIn .3s ease-out both;max-width:380px}
@keyframes toastIn{from{transform:translateY(8px);opacity:.001}}

/* ---------- canvas ---------- */
.atlas{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);height:calc(100dvh - var(--top-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px}
.stage-wrap{position:relative;overflow:hidden;min-width:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--gs5,100px) var(--gs5,100px),var(--gs5,100px) var(--gs5,100px),var(--gs,20px) var(--gs,20px),var(--gs,20px) var(--gs,20px);
  background-position:var(--gx,0) var(--gy,0);cursor:grab;touch-action:none}
.stage-wrap.dragging{cursor:grabbing}
#atlasSvg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.n-box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.n-box.sub{fill:var(--sheet-2);stroke:var(--rule)}
.n-head{fill:var(--ink)}
.n-title{font:800 14px var(--f-ui);fill:var(--ink)}
.n-svc{font:500 10px var(--f-mono);fill:var(--ink-3);letter-spacing:.04em}
.n-txt{font:500 12.5px var(--f-ui);fill:var(--ink-2)}
.n-mono{font:500 11.5px var(--f-mono);fill:var(--ink-2)}
.n-big{font:600 22px var(--f-mono);fill:var(--ink)}
.n-tag{font:600 10px var(--f-mono);fill:var(--ink-3);letter-spacing:.08em}
.node{cursor:pointer}
.node .n-box{transition:stroke .2s,stroke-width .2s}
.node:hover .n-box.main{stroke:var(--accent);stroke-width:1.8}
.node.sel .n-box.main{stroke:var(--accent);stroke-width:2.4}
.node.sel .sel-ring{opacity:1}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .2s}
.node:focus{outline:none}
.node:focus-visible .n-box.main{stroke:var(--accent);stroke-width:2.6}
.edge{fill:none;stroke:var(--ink-3);stroke-width:1.4}
.edge.flow{stroke:var(--ec,var(--accent));stroke-dasharray:6 8;animation:dash var(--spd,2.4s) linear infinite;opacity:.9}
.edge.base{stroke:var(--ec,var(--ink-3));opacity:.32}
.edge.dashed.base{stroke-dasharray:3 4;opacity:.7}
@keyframes dash{to{stroke-dashoffset:-56}}
.e-label{font:600 10px var(--f-mono);fill:var(--ec,var(--ink-2));letter-spacing:.05em}
.e-label-bg{fill:var(--paper)}
.anno{font:500 10.5px var(--f-mono);fill:var(--mark);letter-spacing:.04em}
.anno-line{stroke:var(--mark);stroke-width:.8;fill:none;stroke-dasharray:2 3}
.dim{stroke:var(--ink-3);stroke-width:.7;fill:none}
.tok{transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .4s;cursor:pointer}
.tok circle.c{stroke:var(--sheet);stroke-width:1.5}
.tok:hover circle.c{stroke:var(--ink);stroke-width:2}
.tok .ring{fill:none;stroke-width:1.4}
.tok.running .ring{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center;stroke-dasharray:4 3}
.tok.hl circle.c{stroke:var(--accent);stroke-width:3}
.comet{pointer-events:none}
.badge-bg{stroke-width:1}
.port-bar{fill:var(--paper-2)}
.port-fill{transition:width .6s cubic-bezier(.2,.7,.2,1)}
.slot{fill:none;stroke:var(--rule);stroke-width:1}
.dagn{fill:var(--sheet);stroke:var(--rule);stroke-width:1}
.dagn.on{stroke:var(--st-running);stroke-width:1.4}
.pulse-ring{fill:none;stroke:var(--accent);stroke-width:2;animation:ringOut 1s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes ringOut{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.7)}}
.hud{position:absolute;z-index:5;background:color-mix(in srgb,var(--sheet) 92%,transparent);border:1px solid var(--rule);border-radius:var(--r);backdrop-filter:blur(4px)}
.hud.title-block{left:16px;top:14px;display:grid;grid-template-columns:auto auto;font-size:11px;max-width:calc(100% - 32px)}
.title-block>div{padding:6px 10px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
.title-block .tb-k{display:block;font:600 9px var(--f-mono);color:var(--ink-3);letter-spacing:.1em}
.title-block .tb-v{font:600 12px var(--f-mono);color:var(--ink)}
.title-block .tb-h{grid-column:1/-1;font-weight:800;font-size:14px}
.hud.zoom{right:16px;bottom:16px;display:flex;flex-direction:column}
.hud.zoom button{appearance:none;border:0;border-bottom:1px solid var(--rule-2);background:none;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.hud.zoom button:last-child{border-bottom:0}
.hud.zoom button:hover{background:var(--sheet-2)}
.hud.zoom .zl{font:600 10px var(--f-mono);text-align:center;padding:4px 0;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.hud.mini{left:16px;bottom:16px;width:220px;height:120px;overflow:hidden;cursor:pointer}
.hud.mini svg{width:100%;height:100%;display:block}
.mini-n{fill:var(--sheet-2);stroke:var(--ink-3);stroke-width:2}
.mini-v{fill:var(--accent-soft);stroke:var(--accent);stroke-width:4}
.hud.legend{right:62px;bottom:16px;padding:8px 10px;display:grid;gap:4px 12px;grid-template-columns:auto auto;font-size:11px;color:var(--ink-2)}
.hud.legend .lt{grid-column:1/-1;font:600 9px var(--f-mono);letter-spacing:.1em;color:var(--ink-3)}
.hud.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hud.legend i{width:9px;height:9px;border-radius:50%;background:var(--lc)}
.hud.ticker{right:16px;top:14px;width:300px;max-height:220px;overflow:hidden;font:500 11px/1.45 var(--f-mono)}
.ticker .th{padding:6px 10px;border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between;font:600 9px var(--f-mono);letter-spacing:.1em;color:var(--ink-3)}
.ticker ol{list-style:none;margin:0;padding:4px 0}
.ticker li{display:grid;grid-template-columns:58px 1fr;gap:6px;padding:2px 10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:tickIn .35s ease-out both}
.ticker li b{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
@keyframes tickIn{from{transform:translateX(10px);opacity:.001;background:var(--accent-soft)}}

/* HUD layout v2: slim title strip + bottom instrument band */
.hud.title-block{left:12px;top:10px;display:flex;align-items:stretch;flex-wrap:nowrap;max-width:calc(100% - 24px);overflow:hidden}
.title-block>div{padding:5px 10px;border-right:1px solid var(--rule-2);border-bottom:0;white-space:nowrap;display:flex;flex-direction:column;justify-content:center}
.title-block>div:last-child{border-right:0}
.title-block .tb-h{font-weight:800;font-size:12.5px;grid-column:auto}
.hud-band{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end;z-index:5;pointer-events:none}
.hud-band>.hud{position:static;pointer-events:auto}
.hud-band .hud.mini{width:170px;height:96px}
.hud-band .hud.ticker{width:330px;max-height:none;height:auto;flex:0 1 330px;min-width:0}
.hud-band .ticker li{padding:1px 10px;grid-template-columns:54px 1fr}
.hud-band .hud.legend{grid-template-columns:auto auto;padding:7px 10px;align-self:flex-end}
.hud-band .hud.zoom{margin-left:auto;flex-direction:row;align-items:center}
.hud-band .hud.zoom button{border-bottom:0;border-right:1px solid var(--rule-2)}
.hud-band .hud.zoom button:last-child{border-right:0}
.hud-band .hud.zoom .zl{border-bottom:0;border-right:1px solid var(--rule-2);padding:0 6px;width:46px}
@media (max-width:1180px){.hud-band .hud.legend{display:none}}
.hud-band .hud.pan-hint{font:500 11px var(--f-mono);color:var(--ink-2);padding:6px 8px;white-space:nowrap;align-self:flex-end;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hud-band .hud.pan-hint b{color:var(--accent)}
@media (max-width:900px){.hud-band .hud.ticker{display:none}.hud-band .hud.mini{width:128px;height:72px}}
/* inspector */
.insp{width:var(--insp-w);background:var(--sheet);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.insp-grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.insp-grip::after{content:"";position:absolute;left:3px;top:50%;width:2px;height:38px;margin-top:-19px;background:var(--rule);border-radius:1px}
.insp-grip:hover::after,.insp-grip.on::after{background:var(--accent)}
.insp-head{padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.insp-head .eyebrow{font:600 10px var(--f-mono);color:var(--ink-3);letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
.insp-head h2{margin:4px 0 2px;font-size:18px;font-weight:800;line-height:1.25}
.insp-head .res{font:500 11px var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.insp-head .desc{font-size:12px;color:var(--ink-2);margin:8px 0 0}
.insp-body{overflow:auto;flex:1;min-height:0}
.isec{border-bottom:1px solid var(--rule-2)}
.isec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:13px;position:sticky;top:0;background:var(--sheet);z-index:1}
.isec>summary::-webkit-details-marker{display:none}
.isec>summary .ix{font:600 10px var(--f-mono);color:var(--accent);width:22px}
.isec>summary .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-3)}
.isec>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform .2s;margin-left:6px}
.isec[open]>summary::after{transform:rotate(45deg)}
.isec .ib{padding:0 16px 14px}
.obj{display:grid;gap:2px;padding:8px 0;border-top:1px dashed var(--rule-2);font-size:12px}
.obj:first-child{border-top:0}
.obj .on{font:500 12px var(--f-mono);overflow-wrap:anywhere;color:var(--ink)}
.obj .om{font:500 10.5px var(--f-mono);color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.evrow{border-top:1px dashed var(--rule-2)}
.evrow>button{appearance:none;width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;padding:6px 0;cursor:pointer;align-items:baseline}
.evrow>button:hover .en{color:var(--accent)}
.evrow .et{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.evrow .en{font:600 11px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow .ew{font:500 10px var(--f-mono);color:var(--ink-3)}
.evrow pre{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
.evrow.new{animation:rowflash 1.4s ease-out}
.logstream{font:11px/1.55 var(--f-mono);background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r);max-height:300px;overflow:auto;padding:6px 0}
.logstream div{padding:1px 10px;white-space:pre-wrap;word-break:break-word}
.logstream div.new{animation:logIn .6s ease-out}
@keyframes logIn{from{background:var(--accent-soft)}}
.logstream .lt{color:var(--ink-3)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule-2);border:1px solid var(--rule-2)}
.mgrid div{background:var(--sheet);padding:8px 10px;min-width:0}
.mgrid .k{font-size:10.5px;color:var(--ink-3);font-weight:600}
.mgrid .v{font:600 15px var(--f-mono);overflow-wrap:anywhere}
.wfl{display:grid;gap:0}
.wfl button{appearance:none;border:0;border-top:1px dashed var(--rule-2);background:none;padding:6px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;cursor:pointer;font-size:12px}
.wfl button:hover .idc{color:var(--accent)}

@media (max-width:900px){
  .atlas{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}
  .insp{overflow:visible}
  .stage-wrap{height:min(72dvh,620px)}
  .insp{width:auto;border-left:0;border-top:1px solid var(--rule)}
  .insp-grip{display:none}
  .insp-body{overflow:visible}
  .isec .ib{max-height:300px;overflow:auto;overscroll-behavior:contain}
  .isec .ib .logstream{max-height:260px}
  .hud.ticker,.hud.legend{display:none}
  .hud.mini{width:150px;height:84px}
}
@media (max-width:1560px){.tab .no{display:none}.search-btn{min-width:0}.search-btn .lbl{display:none}}
@media (max-width:760px){
  .top{flex-wrap:wrap;padding-block:6px;gap:6px}
  .brand{border-right:0;padding-right:0}
  .tools{margin-left:auto;padding-left:0}
  .tabs{order:3;flex-basis:100%;padding-left:0;border-top:1px solid var(--rule-2);min-height:42px}
  .search-btn{min-width:0}
  .search-btn .lbl,.search-btn .kbd,.clock,.hide-sm{display:none}
  .hud.title-block{display:none}
}

/* palette + modal */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:80;display:grid;place-items:start center;padding:10vh 16px 16px;animation:fade .2s ease-out both}
@keyframes fade{from{opacity:.001}}
.dialog{width:min(640px,100%);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.2,1) both;max-height:80vh;display:flex;flex-direction:column}
.dialog.wide{width:min(980px,100%)}
@keyframes pop{from{transform:translateY(-8px) scale(.985);opacity:.001}}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.pal-in input{flex:1;border:0;background:none;font-size:15px;outline:none;min-width:0}
.pal-list{overflow:auto;padding:6px 0}
.pal-grp{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--ink-3);padding:8px 14px 4px}
.pal-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;font-size:13px}
.pal-item .sub{font:500 11px var(--f-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.dlg-head h3{margin:0;font-size:15px}
.dlg-body{padding:14px 16px;overflow:auto;display:grid;gap:12px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--rule)}

/* detail */
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;border:1px solid var(--ink);background:var(--sheet)} /* 18 grid units → 2/3/6 columns, no holes */
@media (min-width:640px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.summary{grid-template-columns:repeat(6,minmax(0,1fr))}}
#dNode{padding:14px 16px;min-width:0;overflow-wrap:anywhere}
#dNode .mono,#dNode code,#dNode dd{overflow-wrap:anywhere;word-break:break-word}
@media (max-width:1099px){#dNode{border-left:0!important;border-top:1px solid var(--rule-2)}}
.summary>div{padding:9px 12px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-width:0}
.summary .k{display:block;font:600 9.5px var(--f-mono);color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.summary .v{font:500 12.5px var(--f-mono);overflow-wrap:anywhere}
.summary .v.big{font:700 15px var(--f-ui)}
.att-tabs{display:flex;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;width:max-content;max-width:100%;overflow-x:auto}
.att-tabs button{appearance:none;border:0;border-right:1px solid var(--rule-2);background:var(--sheet);padding:5px 10px;font:600 11px var(--f-mono);cursor:pointer;color:var(--ink-2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.att-tabs button:last-child{border-right:0}
.att-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ink-inv)}
.att-tabs i{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.dag-wrap{overflow-x:auto;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border-bottom:1px solid var(--rule-2)}
.dag-wrap svg{display:block;min-width:760px;width:100%}
.dnode{cursor:pointer}
.dnode rect.b{fill:var(--sheet);stroke:var(--tc);stroke-width:1.4}
.dnode.failed rect.b{stroke-width:2.6;fill:color-mix(in srgb,var(--st-failed) 8%,var(--sheet))}
.dnode.sel rect.b{stroke:var(--accent);stroke-width:2.6}
.dnode:hover rect.b{filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.dnode text{fill:var(--ink)}
.dnode .dl{font:700 12px var(--f-ui)}
.dnode .dm{font:500 10px var(--f-mono);fill:var(--ink-3)}
.dedge{fill:none;stroke:var(--ink-3);stroke-width:1.3}
.dedge.on{stroke:var(--st-running);stroke-dasharray:5 6;animation:dash 1.6s linear infinite}
.timeline{list-style:none;margin:0;padding:0;position:relative;max-height:520px;overflow:auto}
.timeline li{display:grid;grid-template-columns:86px 18px minmax(0,1fr);gap:8px;align-items:start;padding:4px 0}
.timeline .tt{font:500 11px var(--f-mono);color:var(--ink-3);text-align:right;padding-top:2px}
.timeline .td{position:relative;height:100%}
.timeline .td::before{content:"";position:absolute;left:8px;top:0;bottom:-8px;width:1px;background:var(--rule)}
.timeline .td i{position:absolute;left:4px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--sheet);border:2px solid var(--tc)}
.timeline .tn{font:600 12px var(--f-mono)}
.timeline .tl{font-size:11.5px;color:var(--ink-2)}
.timeline button{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:500 10.5px var(--f-mono);cursor:pointer}
.logx{font:11.5px/1.5 var(--f-mono);max-height:520px;overflow:auto}
.logx .lr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.logx .lr{display:grid;grid-template-columns:92px 64px 120px minmax(0,1fr);gap:8px;padding:4px 12px;border-bottom:1px solid var(--rule-2);cursor:pointer;align-items:baseline}
.logx .lr:hover{background:var(--accent-soft)}
.logx .lr .m{white-space:pre-wrap;word-break:break-word}
.logx .lx{padding:8px 12px 12px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
@media (max-width:640px){.logx .lr{grid-template-columns:70px 54px minmax(0,1fr)}.logx .lr .c{display:none}}

/* capacity */
.cap{display:grid;gap:10px;padding:14px}
.cap-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cap-top h3{margin:0;font-size:17px;font-weight:800}
.cap-frac{font:600 30px/1 var(--f-mono);letter-spacing:-.02em}
.cap-frac small{font-size:15px;color:var(--ink-3)}
.slots{display:flex;flex-wrap:wrap;gap:3px;min-height:39px;align-content:flex-start} /* reserve 2 rows so 4/5/10/25-slot cards align */
.slots i{width:14px;height:18px;border:1px solid var(--rule);background:var(--paper-2);border-radius:1px;transition:background .4s}
.slots i.on{background:var(--lc);border-color:var(--lc)}
.slots i.res{background:color-mix(in srgb,var(--lc) 40%,transparent);border-color:var(--lc)}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-2);border:1px solid var(--rule-2)}
.stat-row>div{background:var(--sheet);padding:7px 9px;min-width:0}
.stat-row .k{font-size:10.5px;color:var(--ink-3);font-weight:600}
.stat-row .v{font:600 14px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-row .k{white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r);height:30px}
.stepper button{appearance:none;border:0;background:none;width:28px;height:100%;cursor:pointer;font-size:15px;color:var(--ink)}
.stepper input{width:46px;border:0;border-inline:1px solid var(--rule-2);text-align:center;height:100%;background:none;font:600 13px var(--f-mono)}
.diff{font:600 12px var(--f-mono)}
.diff .from{color:var(--ink-3);text-decoration:line-through}
.diff .to{color:var(--accent)}
.switch{appearance:none;width:34px;height:18px;border-radius:9px;background:var(--rule);position:relative;cursor:pointer;transition:background .2s;border:0;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--sheet);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}

/* DLQ */
.dlq-grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sheet-2);border-bottom:1px solid var(--rule-2);font-weight:700;font-size:12.5px}
.dlq-grp>summary::-webkit-details-marker{display:none}
.dlq-grp>summary .pol{font:500 11px var(--f-ui);color:var(--ink-3);font-weight:500}
.dlq-grp>summary .n{margin-left:auto;font:600 11px var(--f-mono)}
.dlq-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule-2);align-items:start;cursor:pointer}
.dlq-row:hover{background:var(--accent-soft)}
.dlq-row.sel{background:color-mix(in srgb,var(--accent) 13%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.dlq-row .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlq-row .t2{font-size:11.5px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm{border:1.5px solid var(--st-retry);border-radius:var(--r);padding:12px;display:grid;gap:10px;background:color-mix(in srgb,var(--st-retry) 6%,var(--sheet))}
.steps{display:flex;gap:6px;font:600 10.5px var(--f-mono);color:var(--ink-3);flex-wrap:wrap}
.steps span{padding:3px 7px;border:1px solid var(--rule);border-radius:2px}
.steps span.on{color:var(--ink);border-color:var(--ink)}
.steps span.done{color:var(--st-success);border-color:var(--st-success)}

/* results */
.res-file{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;border:1px solid var(--ink);background:var(--sheet);border-radius:var(--r)}
.res-file .uri{font:600 13px var(--f-mono);overflow-wrap:anywhere}
.res-file .meta{font:500 11px var(--f-mono);color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
.pf{display:flex;height:10px;border-radius:1px;overflow:hidden;background:var(--paper-2)}
.pf i{display:block;height:100%;transition:width .5s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--sheet);border-left:1px solid var(--rule);z-index:85;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slideIn .28s cubic-bezier(.2,.8,.2,1) both;padding-top:env(safe-area-inset-top,0px)}
@keyframes slideIn{from{transform:translateX(30px);opacity:.001}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-2);border:1px solid var(--rule-2)}
.cmp>div{background:var(--sheet);padding:8px 10px;min-width:0}
.cmp .k{font:600 9.5px var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.cmp .v{font-size:13px;overflow-wrap:anywhere}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--rule-2);flex-wrap:wrap;font-size:12px}

/* boot sequence */
.boot .node{animation:nodeIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.boot .edge.base,.boot .edge.flow{animation:edgeIn 1.1s ease-out both;animation-delay:calc(var(--i,0) * 70ms + 200ms)}
@keyframes nodeIn{from{opacity:.001;transform:translateY(10px)}}
@keyframes edgeIn{from{opacity:.001}}
.boot .top{animation:topIn .5s ease-out both}
@keyframes topIn{from{transform:translateY(-8px);opacity:.001}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .edge.flow{animation:none!important;stroke-dasharray:none;opacity:.55}
}

  return `<div class="note ${p[me.role] ? '' : 'bad'}">${A.icon('key-round')} 권한 <b>${esc(p.permission)}</b> — 허용 역할 ${esc(roles)}. 현재 계정 <b>${esc(me.name)}</b> (${esc(me.role)}) ${p[me.role] ? '실행 가능' : '<b>실행 불가</b> · 운영자 계정을 바꾸세요'}. 모든 변경은 감사 로그에 기록됩니다.</div>`;
};
A.operatorSelect = (id) => `<label class="field"><span>실행 계정</span><select class="in" id="${id}" data-opsel>${M.operators.map(o => `<option value="${o.id}" ${o.id === A.state.operator ? 'selected' : ''}>${esc(o.name)} · ${o.role}</option>`).join('')}</select></label>`;
document.addEventListener('change', e => { if (e.target.matches('[data-opsel]')) { A.state.operator = e.target.value; A.rerender(); } });

/* ---------- views registry + router ---------- */
A.views = {};
A.TABS = [
  {id:'atlas', no:'A-00', label:'오케스트레이션', icon:'map'},
  {id:'overview', no:'S-01', label:'개요', icon:'grid'},
  {id:'capacity', no:'S-02', label:'Capacity', icon:'gauge'},
  {id:'explorer', no:'S-03', label:'Explorer', icon:'search'},
  {id:'detail', no:'S-04', label:'Pipeline 상세', icon:'git-branch'},
  {id:'dlq', no:'S-05', label:'DLQ', icon:'archive-x'},
  {id:'results', no:'U-01', label:'평가 결과', icon:'table'},
  {id:'analytics', no:'S-07', label:'분석', icon:'bar-chart'},
  {id:'config', no:'S-06', label:'설정', icon:'sliders'}
];
function renderTabs(){
  const pend = M.dlq.filter(d => d.status === 'PENDING_REVIEW').length;
  $('#tabs').innerHTML = A.TABS.map(t => `<button class="tab" role="tab" data-go="${t.id}" aria-selected="${A.state.view === t.id}"><span class="no">${t.no}</span>${esc(t.label)}${t.id === 'dlq' && pend ? `<span class="cnt">${pend}</span>` : ''}</button>`).join('');
}
A.renderTabs = renderTabs;

A.go = (view, params = {}, opts = {}) => {
  const s = A.state;
  if (!opts.noPush && (s.view !== view || params.wfId && params.wfId !== s.wfId)) s.history.push({view: s.view, wfId: s.wfId, attempt: s.attempt, node: s.node, scroll: window.scrollY});
  if (s.history.length > 30) s.history.shift();
  Object.assign(s, params);
  if (view === 'detail' && !s.wfId) s.wfId = (M.workflows.find(w => w.status === 'RUNNING') || M.workflows[0]).workflow_id;
  s.view = view;
  try { history.replaceState(null, '', '#' + view); } catch (e) {}
  renderView(true);
  if (!opts.keepScroll) window.scrollTo(0, opts.scroll || 0);
};
A.back = () => {
  const h = A.state.history.pop();
  if (!h) return A.go('explorer', {}, {noPush: true});
  Object.assign(A.state, {wfId: h.wfId, attempt: h.attempt, node: h.node});
  A.go(h.view, {}, {noPush: true, scroll: h.scroll});
};
let current = null;
function renderView(fresh){
  const s = A.state; const v = A.views[s.view];
  renderTabs();
  const main = $('#main');
  if (fresh || current !== s.view) {
    if (current && A.views[current] && A.views[current].unmount) A.views[current].unmount();
    A.disposeCharts();
    main.innerHTML = `<section class="view" data-view="${s.view}"></section>`;
    current = s.view;
    v.mount(main.firstElementChild);
  } else if (v.update) v.update(main.firstElementChild);
}
A.rerender = () => renderView(true);
A.refresh = () => { const v = A.views[A.state.view]; if (v && v.update) v.update($('#main').firstElementChild); };
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); A.go(g.dataset.go); return; }
  const w = e.target.closest('[data-wf]');
  if (w && !e.target.closest('input,select,textarea,label')) { e.preventDefault(); A.go('detail', {wfId: w.dataset.wf, attempt: null, node: w.dataset.node || null}); return; }
  const b = e.target.closest('[data-back]');
  if (b) { e.preventDefault(); A.back(); }
});

/* ---------- charts ---------- */
A.charts = [];
A.disposeCharts = () => { A.charts.forEach(c => { try { c.ro && c.ro.disconnect(); c.chart.dispose(); } catch (e) {} }); A.charts = []; };
A.chartTheme = () => {
  const c = n => A.css(n);
  return {
    text: c('--ink'), text2: c('--ink-2'), text3: c('--ink-3'), grid: c('--rule-2'), rule: c('--rule'), bg: c('--sheet'),
    lang: {ko: c('--lg-ko'), en: c('--lg-en'), ja: c('--lg-ja'), es: c('--lg-es')},
    st: {success: c('--st-success'), running: c('--st-running'), queued: c('--st-queued'), retry: c('--st-retry'), failed: c('--st-failed'), dlq: c('--st-dlq'), cancelled: c('--st-cancelled')},
    accent: c('--accent'), mark: c('--mark'), mono: c('--f-mono'), ui: c('--f-ui'),
    metric: c('--sx-metric'), ver: {'v1.0': c('--ver-1'), 'v1.1': c('--ver-2'), 'v1.2-rc': c('--ver-3')},

};
A.baseOpt = (T, extra = {}) => Object.assign({
  animationDuration: A.reduced() ? 0 : 700, animationDurationUpdate: A.reduced() ? 0 : 500,
  textStyle: {fontFamily: T.ui, color: T.text2},
  grid: {left: 44, right: 14, top: 30, bottom: 28, containLabel: false},
  tooltip: {trigger: 'axis', backgroundColor: T.bg, borderColor: T.rule, textStyle: {color: T.text, fontSize: 12, fontFamily: T.ui}, axisPointer: {lineStyle: {color: T.text3, type: 'dashed'}}},
  legend: {top: 0, right: 0, icon: 'circle', itemWidth: 8, itemHeight: 8, textStyle: {color: T.text2, fontSize: 11}},
}, extra);
A.axisX = (T, data, extra = {}) => Object.assign({type: 'category', data, boundaryGap: false, axisLine: {lineStyle: {color: T.rule}}, axisTick: {show: false}, axisLabel: {color: T.text3, fontSize: 10, fontFamily: T.mono}}, extra);
A.axisY = (T, extra = {}) => Object.assign({type: 'value', splitLine: {lineStyle: {color: T.grid}}, axisLine: {show: false}, axisLabel: {color: T.text3, fontSize: 10, fontFamily: T.mono}}, extra);
/* mount: builder(T) returns option; stored so theme toggle rebuilds */
A.chart = (el, builder) => {
  if (!el || !window.echarts) { if (el) el.innerHTML = '<div class="empty"><b>차트 라이브러리를 불러오지 못했습니다</b>네트워크를 확인하세요.</div>'; return null; }
  const chart = echarts.init(el, null, {renderer: 'canvas'});
  chart.setOption(builder(A.chartTheme()));
  const rec = {el, chart, builder};
  if (window.ResizeObserver) { rec.ro = new ResizeObserver(() => chart.resize()); rec.ro.observe(el); }

  return rec;
};
A.updateChart = (rec) => { if (rec && rec.chart && !rec.chart.isDisposed()) rec.chart.setOption(rec.builder(A.chartTheme()), {notMerge: false, lazyUpdate: true}); };
A.rethemeCharts = () => A.charts.forEach(rec => { rec.chart.dispose(); rec.chart = echarts.init(rec.el); rec.chart.setOption(rec.builder(A.chartTheme())); if (rec.ro) { rec.ro.disconnect(); rec.ro = new ResizeObserver(() => rec.chart.resize()); rec.ro.observe(rec.el); } });

/* ---------- theme ---------- */
function themeNow(){ const t = document.documentElement.dataset.theme; if (t) return t; return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function paintThemeBtn(){ $('#themeToggle').innerHTML = A.icon(themeNow() === 'dark' ? 'sun' : 'moon'); $('#themeToggle').setAttribute('aria-label', themeNow() === 'dark' ? '라이트 테마로 전환' : '다크 테마로 전환'); }
$('#themeToggle').addEventListener('click', () => {
  document.documentElement.dataset.theme = themeNow() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('atlas-theme', document.documentElement.dataset.theme); } catch (e) {}
  paintThemeBtn(); A.rethemeCharts(); if (A.onTheme) A.onTheme();
});
try { const t = localStorage.getItem('atlas-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) { paintThemeBtn(); A.rethemeCharts(); if (A.onTheme) A.onTheme(); } });
paintThemeBtn();

/* ---------- simulator ---------- */
const sim = A.sim = M.createSimulator({speed: 1});
function paintSim(){
  const on = sim.isRunning();
  $('#simToggle').innerHTML = A.icon(on ? 'pause' : 'play');

  document.body.classList.toggle('paused', !on);

}
$('#simToggle').addEventListener('click', () => { sim.isRunning() ? sim.stop() : sim.start(); paintSim(); A.toast(sim.isRunning() ? '실시간 시뮬레이션을 재개했습니다.' : '실시간 시뮬레이션을 일시정지했습니다.'); });
$('#speedSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sim.setSpeed(+b.dataset.s); paintSim(); });
function paintClock(){ $('#clock').innerHTML = `<b>${F.time(M.now())}</b>${F.dateKo(M.now())} · 가상시계`; }
M.on('tick', () => { paintClock(); A.refresh(); });
M.on('dlq', () => renderTabs());

/* ---------- command palette ---------- */
function palItems(){
  const items = [];
  A.TABS.forEach(t => items.push({grp:'화면', icon:t.icon, label:`${t.label}`, sub:t.no, run:() => A.go(t.id), key:(t.label + ' ' + t.id + ' ' + t.no).toLowerCase()}));
  M.stages.forEach(st => items.push({grp:'오케스트레이션 단계', icon:st.icon, label:st.label.ko, sub:st.label.en, run:() => { A.state.stage = st.id; A.go('atlas'); }, key:(st.label.ko + ' ' + st.label.en + ' ' + st.id).toLowerCase()}));
  M.workflows.slice().reverse().forEach(w => items.push({grp:'Workflow', icon:(M.statusMeta[w.status] || {}).icon, tone:(M.statusMeta[w.status] || {}).tone, label:w.workflow_id, sub:`${w.batch_id} · ${M.statusMeta[w.status].label} · ${w.pipeline_job_id || ''}`, run:() => A.go('detail', {wfId:w.workflow_id, attempt:null, node:null}), key:(w.workflow_id + ' ' + w.batch_id + ' ' + (w.pipeline_job_id || '') + ' ' + w.status + ' ' + (w.error ? w.error.code : '') + ' ' + w.input.object).toLowerCase()}));
  M.dlq.slice().reverse().forEach(d => items.push({grp:'DLQ', icon:'archive-x', tone:'dlq', label:d.dead_letter_id, sub:`${d.workflow_id} · ${d.error_code} · ${M.dlqStatusMeta[d.status].label}`, run:() => { A.state.dlqSel = d.dead_letter_id; A.go('dlq'); }, key:(d.dead_letter_id + ' ' + d.workflow_id + ' ' + d.error_code + ' ' + d.failure_category).toLowerCase()}));
  return items;
}
A.openPalette = () => {
  const ov = $('#overlay');
  ov.innerHTML = `<div class="scrim" data-close><div class="dialog" role="dialog" aria-modal="true" aria-label="명령 팔레트"><div class="pal-in">${A.icon('search')}<input id="palQ" placeholder="Workflow ID, Batch, PipelineJob, DLQ ID, 오류 코드, 화면 이름…" autocomplete="off"><span class="kbd">ESC</span></div><div class="pal-list" id="palList" role="listbox"></div></div></div>`;
  const all = palItems(); let sel = 0, shown = [];
  const q = $('#palQ'), list = $('#palList');
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    const terms = t.split(/\s+/).filter(Boolean);
    shown = all.filter(i => terms.every(x => i.key.includes(x)));
    const byG = {}; shown.forEach(i => (byG[i.grp] = byG[i.grp] || []).push(i));
    shown = []; let html = '';
    Object.keys(byG).forEach(g => { const arr = byG[g].slice(0, t ? 12 : (g === 'Workflow' ? 6 : 9)); html += `<div class="pal-grp">${esc(g)} · ${byG[g].length}</div>`; arr.forEach(i => { html += `<div class="pal-item ${i.tone ? 'tone-' + i.tone : ''}" role="option" data-i="${shown.length}" aria-selected="${shown.length === sel}"><span style="color:var(--tc,var(--ink-3))">${A.icon(i.icon)}</span><div style="min-width:0"><div class="mono" style="font-size:12.5px">${esc(i.label)}</div><div class="sub">${esc(i.sub)}</div></div><span class="kbd">↵</span></div>`; shown.push(i); }); });
    list.innerHTML = html || '<div class="empty"><b>일치하는 항목이 없습니다</b>Workflow ID 일부(예: ko-0022)나 오류 코드(예: QUOTA)로 검색해 보세요.</div>';
  };
  const close = () => { ov.innerHTML = ''; };
  q.addEventListener('input', () => { sel = 0; draw(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(shown.length - 1, sel + 1); draw(); e.preventDefault(); scrollSel(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); scrollSel(); }
    else if (e.key === 'Enter') { const it = shown[sel]; if (it) { close(); it.run(); } }
    else if (e.key === 'Escape') close();
  });
  const scrollSel = () => { const el = list.querySelector('[aria-selected="true"]'); if (el) el.scrollIntoView({block: 'nearest'}); };
  list.addEventListener('click', e => { const it = e.target.closest('.pal-item'); if (it) { close(); shown[+it.dataset.i].run(); } });
  ov.firstElementChild.addEventListener('click', e => { if (e.target.hasAttribute('data-close')) close(); });
  draw(); q.focus();
};
$('#openPalette').addEventListener('click', A.openPalette);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); A.openPalette(); }
  if (e.key === 'Escape') { if ($('#overlay').innerHTML) $('#overlay').innerHTML = ''; }
});

/* ---------- modal ---------- */
A.modal = (title, bodyHTML, footHTML = '', wide = false) => {
  const ov = $('#overlay');
  ov.innerHTML = `<div class="scrim" data-close><div class="dialog ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlg-head"><h3>${title}</h3><button class="btn icon ghost" data-x aria-label="닫기">${A.icon('x')}</button></div><div class="dlg-body">${bodyHTML}</div>${footHTML ? `<div class="dlg-foot">${footHTML}</div>` : ''}</div></div>`;
  const d = ov.firstElementChild;
  d.addEventListener('click', e => { if (e.target.hasAttribute('data-close') || e.target.closest('[data-x]')) ov.innerHTML = ''; });
  return d;
};
A.closeModal = () => { $('#overlay').innerHTML = ''; };
A.csvModal = (rows, label) => {
  const csv = M.results.toCSV(rows);
  const head = csv.split('\r\n').slice(0, 401).join('\n');
  const d = A.modal(`CSV 보기/복사 · ${esc(label)}`, `<div class="note">${F.number(rows.length)}행 · ${F.bytes(new Blob([csv]).size)} · RFC 4180. 미리보기는 처음 400행까지이며, 복사 버튼은 전체 내용을 복사합니다.</div><textarea class="in mono" id="csvText" readonly style="min-height:360px;font-size:11px;white-space:pre">${esc(head)}</textarea>`,
    `<button class="btn" data-x>닫기</button><button class="btn primary" id="csvCopy">${A.icon('copy')}전체 CSV 복사</button>`, true);
  $('#csvCopy', d).addEventListener('click', () => { A.copy(csv, $('#csvText', d)); });
};

/* boot */
A.boot = () => {
  const h = (location.hash || '').replace('#', '');
  if (A.views[h]) A.state.view = h;
  if (A.state.view === 'detail' && !A.state.wfId) A.state.wfId = (M.workflows.find(w => w.status === 'RUNNING') || M.workflows[0]).workflow_id;
  document.documentElement.classList.add('boot');
  setTimeout(() => document.documentElement.classList.remove('boot'), 2200);
  paintClock(); renderView(true);
  sim.start(); paintSim();
  M.on('sim', paintSim);
};
})();
</script>
<script>
/* ===== AIPO Atlas — topology canvas (U2 / U3) ===== */
(function(){

const STG = Object.fromEntries(M.stages.map(s => [s.id, s]));

    retry:      {stage:'retry', x:360, y:420, w:230, h:200, title:'Retry Controller', i:9},
    dlq:        {stage:'dlq', x:360, y:850, w:230, h:200, title:'Dead Letter', i:10},

}
let N = layout();
const R = id => N[id];
const pt = (id, side, f = .5) => { const n = R(id); return side === 'l' ? [n.x, n.y + n.h * f] : side === 'r' ? [n.x + n.w, n.y + n.h * f] : side === 't' ? [n.x + n.w * f, n.y] : [n.x + n.w * f, n.y + n.h]; };
const curve = (a, b, horiz = true) => { const dx = (b[0] - a[0]) * .5, dy = (b[1] - a[1]) * .5; return horiz ? `M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}` : `M${a[0]},${a[1]} C${a[0]},${a[1] + dy} ${b[0]},${b[1] - dy} ${b[0]},${b[1]}`; };

  const V = (a, b, label, extra = {}) => { const A1 = pt(a, extra.as || 'b', extra.af ?? .5), B1 = pt(b, extra.bs || 't', extra.bf ?? .5); return Object.assign({k: a + '>' + b, d: curve(A1, B1, false), label, lx: (A1[0] + B1[0]) / 2 + 8, ly: (A1[1] + B1[1]) / 2 + 4, anchor: 'start'}, extra); };

  const wl = pt('workflows', 'l', .45), vr = [vx.x + vx.w, vx.y + Math.min(70, vx.h * .3)];

  const fA = [vx.x, vx.y + 70], fB = pt('retry', 'r', .3), rA = pt('retry', 'r', .72), rB = [vx.x, Math.max(vx.y + vx.h - 80, vx.y + 150)];
  const rp = pt('replay', 't', .5), rgx = 1125, rgB = R('registry_queue').y + R('registry_queue').h;
  return [
    Object.assign(H('gcs_input', 'event_bus', 'Object Finalized'), {i:1}),
    Object.assign(H('event_bus', 'ingress', 'CloudEvent push'), {i:2}),
    Object.assign(H('ingress', 'registry_queue', 'register', {bf: .46}), {i:3}),
    Object.assign(H('registry_queue', 'scheduler', 'admission'), {i:4}),
    {k:'scheduler>workflows', d:curve(sw, wt, false), label:'slot reserved', lx:sw[0] + 14, ly:(sw[1] + wt[1]) / 2 + 4, anchor:'start', i:5},
    {k:'workflows>vertex', d:curve(wl, vr), label:'PipelineJob', lx:(wl[0] + vr[0]) / 2, ly:Math.min(wl[1], vr[1]) - 7, i:6},
    {k:'vertex>results', d:curve(vb, rt, false), label:'SUCCESS', tone:'success', lx:vb[0] + 10, ly:(vb[1] + rt[1]) / 2 + 4, anchor:'start', i:7},
    Object.assign(H('results', 'res_csv', '', {af: .17}), {tone:'success', i:8}),
    Object.assign(H('results', 'res_bq', '', {af: .72}), {tone:'success', i:8}),

function fit(mode){

const STAGE_SVC = {gcs_input: 'cloud-storage', event_bus: 'eventarc', registry_queue: 'firestore', scheduler: 'scheduler', workflows: 'pipeline-orchestrator', vertex: 'vertex-ai-pipelines', results: 'result-commit', retry: 'retry-controller', dlq: 'dlq-manager', ingress: 'event-ingress'};
function evAsLog(e){ return {ts: e.ts, severity: e.severity || 'INFO', service: 'event-registry', component: 'event-registry', message: `${e.name}${e.workflow_id ? ' · ' + e.workflow_id : ''}${e.label ? ' · ' + e.label : ''}`, _ev: e.event_id}; }
function stageLogs(id, d){
  const seen = new Set(), out = [];
  const push = l => { const k = l._ev || l.log_id || l.insertId || (l.ts + '|' + l.message); if (seen.has(k)) return; seen.add(k); out.push(l); };
  (d.logs || []).forEach(push);
  M.logs.recent(400).filter(l => stageLogMatch(id, l)).forEach(push);
  (d.events || []).forEach(e => push(evAsLog(e)));
  return out.sort((a, b) => a.ts - b.ts).slice(-50);
}
function heartbeatLine(id){
  const m = (M.stageDetail(id, {limit: 1}) || {}).metrics || {};
  const pick = Object.entries(m).filter(([k, v]) => v == null || typeof v !== 'object' || Array.isArray(v)).slice(0, 3).map(([k, v]) => `${k}=${fmtMetric(k, v)}`).join(' · ');
  return {ts: M.now(), severity: 'DEBUG', service: STAGE_SVC[id] || id, component: (STAGE_SVC[id] || id) + '/monitor', message: `상태 점검 OK · ${pick || '변화 없음'}`};
}
function appendLog(l){

function thrBuckets(){
  const B = 5 * 60 * 1000;
  const done = M.workflows.filter(w => w.status === 'SUCCEEDED' && w.completed_at);
  const fm = M.metrics.fiveMin; const dayStart = fm.ts[0];
  const today = done.filter(w => w.completed_at >= dayStart);
  const last = Math.max(dayStart, ...today.map(w => w.completed_at), fm.ts[fm.ts.length - 1]);
  const ts = []; for (let t = dayStart; t <= last; t += B) ts.push(t);

}

const cf = {retryReason: '', b0: null, b1: null, auditQ: ''};
function localAudit(action, target, before, after, reason){
  const me = A.me(); const t = M.now();
  M.audit.unshift({audit_id: 'aud-ui-' + String(M.audit.length + 1).padStart(4, '0'), ts: t, timestamp: F.iso(t), actor: me.id, actorName: me.name, role: me.role, action, target, before, after, reason, request_id: 'req-' + Math.random().toString(16).slice(2, 14), source_ip: '10.20.20.' + (100 + M.audit.length)});
}
function auditHTML(){
  const list = M.audit.filter(a => !cf.auditQ || (a.action + a.target + a.actorName + (a.reason || '')).toLowerCase().includes(cf.auditQ.toLowerCase())).slice(0, 40);
  return `<div class="tbl-wrap" style="max-height:460px"><table class="t"><thead><tr><th>시각</th><th>운영자</th><th>Action</th><th>대상</th><th>Before → After</th><th>사유</th><th>요청</th></tr></thead><tbody>${list.map(a => `<tr><td class="mono muted">${F.dateTime(a.ts).slice(5)}</td><td>${esc(a.actorName)} <span class="muted mono" style="font-size:10.5px">${esc(a.role)}</span></td><td class="mono" style="font-size:11px;font-weight:600">${esc(a.action)}</td><td class="mono" style="font-size:11px">${esc(a.target)}</td><td class="mono" style="font-size:10.5px;max-width:300px;white-space:normal"><span class="muted">${esc(JSON.stringify(a.before))}</span> → ${esc(JSON.stringify(a.after))}</td><td class="wrap" style="font-size:11.5px">${esc(a.reason || '—')}</td><td class="mono muted" style="font-size:10.5px">${esc(a.request_id)}<br>${esc(a.source_ip)}</td></tr>`).join('')}</tbody></table></div>`;
}

  mount(root){ this.root = root; this.paint(); this.unsub = [M.on('audit', () => { const b = $('#cfAudit'); if (b) b.innerHTML = auditHTML(); }), M.on('config', () => this.paint())];
    root.addEventListener('click', e => {
      if (e.target.closest('#rtApply')) { const b0 = +$('#rt-b0').value, b1 = +$('#rt-b1').value, r = $('#rt-reason').value.trim(); if (r.length < 4) { $('#rt-reason').focus(); A.toast('Retry 정책 변경 사유를 입력하세요.'); return; } if (!A.can('config.write')) { A.toast('현재 계정은 Retry 정책 변경 권한이 없습니다.'); return; } M.actions.updateRetryPolicy({backoffSeconds: [b0, b1]}, {operator: A.state.operator, reason: r}); A.toast(`Backoff를 ${b0}s → ${b1}s로 변경했습니다. 다음 Retry부터 적용됩니다.`); return; }
      const sv = e.target.closest('[data-svc]'); if (sv) { const s = M.config.services.find(x => x.id === sv.dataset.svc); if (!A.can('config.write')) { A.toast('서비스 활성화 변경 권한이 없습니다.'); this.paint(); return; } s.enabled = !s.enabled; localAudit('CONFIG_UPDATED', 'service:' + s.id, {enabled: !s.enabled}, {enabled: s.enabled}, '설정 화면에서 서비스 활성화 변경'); A.toast(`${esc(s.name)} ${s.enabled ? '활성화' : '비활성화'} · 감사 로그 기록`); this.paint(); return; }
      const ap = e.target.closest('[data-ap]'); if (ap) { const p = M.config.alertPolicies.find(x => x.id === ap.dataset.ap); p.enabled = !p.enabled; localAudit('CONFIG_UPDATED', 'alertPolicy:' + p.id, {enabled: !p.enabled}, {enabled: p.enabled}, '알림 정책 토글'); A.toast(`알림 정책 "${esc(p.name)}" ${p.enabled ? '켜짐' : '꺼짐'}`); this.paint(); return; }
    });
    root.addEventListener('input', e => { if (e.target.id === 'cf-aq') { cf.auditQ = e.target.value; $('#cfAudit').innerHTML = auditHTML(); } });
  },
  unmount(){ (this.unsub || []).forEach(u => u()); },
  paint(){
    const root = this.root; const c = M.config; const drift = c.drift(); const tf = c.terraformDefaults;
    const ae = document.activeElement && document.activeElement.id;
    root.innerHTML = `<div class="sheet">${sheetHead('SHEET S-06 · SYSTEM CONFIGURATION', '시스템 설정', `Terraform 변수가 기본값이고, 운영 중 바꾼 값은 Runtime Configuration에 저장됩니다. 두 값이 다르면 Drift로 표시합니다. 현재 계정: <b>${esc(A.me().name)}</b> (${esc(A.me().role)})`, `<div style="min-width:200px">${A.operatorSelect('cf-op')}</div>`)}
      <section class="plate flush" style="border-color:var(--st-retry)"><header><h2>${A.icon('git-branch')} Terraform 기본값 ↔ Runtime 설정 Drift</h2><span class="ref">${drift.length} keys drifted</span></header><div class="tbl-wrap"><table class="t"><thead><tr><th>Key</th><th class="r">Terraform</th><th class="r">Runtime</th><th>변경자</th><th>변경 시각</th><th>사유</th></tr></thead><tbody>${drift.map(d => `<tr><td class="idc">${esc(d.key)}</td><td class="mono r muted">${esc(d.terraform)}</td><td class="mono r" style="color:var(--st-retry);font-weight:700">${esc(d.runtime)}</td><td>${esc(A.opName(d.changedBy))}</td><td class="mono muted">${d.changedAt ? F.dateTime(d.changedAt) : '—'}</td><td class="wrap" style="font-size:11.5px">${esc(d.reason || '—')}</td></tr>`).join('') || '<tr><td colspan="6"><div class="empty"><b>Drift 없음</b>Runtime 값이 Terraform 기본값과 같습니다.</div></td></tr>'}</tbody></table></div><div class="body"><div class="note warn">Drift를 유지하려면 <span class="mono">infrastructure/environments/prod/terraform.tfvars</span>에 반영하는 PR을 올리세요. 다음 <span class="mono">terraform apply</span>가 Runtime 값을 덮어쓰지 않습니다(운영 값은 Firestore <span class="mono">languages/*</span>, <span class="mono">capacity/*</span> 우선).</div></div></section>
      <div class="split s-55">
        <section class="plate flush"><header><h2>Language · Global Capacity</h2><button class="btn sm" data-go="capacity">${A.icon('sliders')}Capacity 화면에서 변경</button></header><div class="tbl-wrap"><table class="t"><thead><tr><th>언어</th><th class="r">동시 상한</th><th class="r">TF 기본</th><th class="r">Batch</th><th class="r">가중치</th><th class="r">시작/분</th><th>상태</th></tr></thead><tbody>${c.languages.map(l => `<tr><td>${A.lang(l.code)} ${esc(l.name)}</td><td class="mono r">${l.maxConcurrent}</td><td class="mono r ${tf['languages.' + l.code + '.maxConcurrent'] !== l.maxConcurrent ? 'sev-WARNING' : 'muted'}">${tf['languages.' + l.code + '.maxConcurrent'] ?? '—'}</td><td class="mono r">${l.batchSize}</td><td class="mono r">${l.priorityWeight}</td><td class="mono r">${l.maxStartsPerMinute}</td><td>${l.paused ? '<span class="pill tone-cancelled">일시 중지</span>' : l.enabled ? '<span class="pill tone-success">활성</span>' : '<span class="pill tone-cancelled">비활성</span>'}</td></tr>`).join('')}<tr><td><b>Global</b></td><td class="mono r"><b>${c.global.maxConcurrent}</b></td><td class="mono r ${tf['global.maxConcurrent'] !== c.global.maxConcurrent ? 'sev-WARNING' : 'muted'}">${tf['global.maxConcurrent']}</td><td></td><td></td><td class="mono r">${c.global.maxStartsPerMinute}</td><td></td></tr></tbody></table></div></section>
        <section class="plate"><header><h2>Retry Configuration</h2><span class="ref">§4.3 · 자동 실행 최대 ${c.retry.maxAttempts}회 고정</span></header><div class="body" style="display:grid;gap:12px;grid-template-columns:minmax(0,1fr)">
          <pre class="code">retry:
  max_retries: ${c.retry.maxRetries}        # 고정 (Attempt 1 + 재실행 2)
  backoff_seconds: [${c.retry.backoffSeconds.join(', ')}]
  non_retryable: [${c.retry.nonRetryable.join(', ')}]
  limited_retry: ${JSON.stringify(c.retry.limitedRetry)}</pre>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><label class="field"><span>Backoff #1 (초)</span><input class="in mono" id="rt-b0" type="number" value="${c.retry.backoffSeconds[0]}" style="width:100px"></label><label class="field"><span>Backoff #2 (초)</span><input class="in mono" id="rt-b1" type="number" value="${c.retry.backoffSeconds[1]}" style="width:100px"></label><label class="field" style="flex:1;min-width:180px"><span>변경 사유 (필수)</span><input class="in" id="rt-reason" placeholder="예: quota 회복 시간 고려해 2차 backoff 연장"></label><button class="btn primary" id="rtApply">적용</button></div>
          <div class="tbl-wrap"><table class="t"><thead><tr><th>오류 유형</th><th>처리 정책</th><th>Retry</th></tr></thead><tbody>${Object.entries(M.failureCategoryMeta).map(([k, m]) => `<tr><td>${A.icon(m.icon)} ${esc(m.label)} <span class="mono muted" style="font-size:10.5px">${k}</span></td><td>${esc(m.policy)}</td><td>${m.retryable ? `<span class="pill tone-retry">${A.icon('rotate-ccw')}${m.maxRetries != null ? m.maxRetries + '회' : '최대 2회'}</span>` : `<span class="pill tone-dlq">${A.icon('archive-x')}즉시 DLQ</span>`}</td></tr>`).join('')}</tbody></table></div>
        </div></section>
      </div>
      <div class="split s-55">
        <section class="plate"><header><h2>Workflow Timeout · Queue Priority</h2></header><div class="body"><dl class="kv">
          <dt>Workflow timeout</dt><dd class="mono">${c.workflowTimeoutMin}분 ${tf.workflowTimeoutMin !== c.workflowTimeoutMin ? `<span class="sev-WARNING">(TF ${tf.workflowTimeoutMin}분 · DRIFT)</span>` : ''}</dd>
          <dt>PipelineJob timeout</dt><dd class="mono">${c.pipelineTimeoutMin}분 · 초과 시 취소 확인 후 Retry 판정</dd>
          <dt>Reservation lease</dt><dd class="mono">${c.reservationLeaseMin}분 · Lease 만료만으로 Slot 반환하지 않음 (Reconciler 확인)</dd>
          <dt>Queue 정책</dt><dd class="mono">${esc(c.queuePolicy.mode)} · 언어 간 ${esc(c.queuePolicy.crossLanguage)}</dd>
          <dt>Aging</dt><dd class="mono">${c.queuePolicy.aging.enabled ? `${c.queuePolicy.aging.boostPerMinutes}분마다 +1, 최대 +${c.queuePolicy.aging.maxBoost}` : '꺼짐'}</dd>
          <dt>선택 순서</dt><dd>높은 Priority → 오래 대기 → FIFO</dd></dl></div></section>
        <section class="plate flush"><header><h2>Pipeline Version</h2><span class="ref">기본 ${esc(c.defaultPipelineVersion)}</span></header><div class="tbl-wrap"><table class="t"><thead><tr><th>버전</th><th>상태</th><th class="r">트래픽</th><th>모델 / Judge</th><th>Template</th><th>메모</th></tr></thead><tbody>${c.pipelineVersionDetails.map(v => `<tr><td class="idc">${esc(v.version)}</td><td><span class="pill ${v.status === 'STABLE' ? 'tone-success' : v.status === 'CANARY' ? 'tone-running' : 'tone-cancelled'}">${esc(v.status)}</span></td><td class="mono r">${v.trafficPct}%</td><td class="mono" style="font-size:11px">${esc(v.modelUnderTest)}<br><span class="muted">${esc(v.judgeModel)}</span></td><td class="mono muted cellwrap" style="font-size:10.5px;min-width:190px">${esc(v.templateUri)}</td><td class="wrap" style="font-size:11.5px">${esc(v.notes)}</td></tr>`).join('')}</tbody></table></div></section>
      </div>
      <section class="plate flush"><header><h2>서비스 활성화 상태</h2><span class="ref">Cloud Run · ${esc(M.meta.region)}</span></header><div class="tbl-wrap"><table class="t"><thead><tr><th>활성</th><th>서비스</th><th>상태</th><th>버전 · Revision</th><th class="r">Instances</th><th class="r">Error rate</th><th class="r">p95</th><th>최근 배포</th><th>Service Account</th></tr></thead><tbody>${c.services.map(s => `<tr><td><input type="checkbox" class="switch" data-svc="${s.id}" ${s.enabled ? 'checked' : ''} aria-label="${esc(s.name)} 활성화"></td><td><b>${esc(s.name)}</b>${s.note ? `<div class="muted" style="font-size:11px;white-space:normal;max-width:260px">${esc(s.note)}</div>` : ''}</td><td><span class="pill ${s.status === 'HEALTHY' ? 'tone-success' : 'tone-retry'}">${A.icon(s.status === 'HEALTHY' ? 'check-circle' : 'alert-triangle')}${esc(s.status)}</span></td><td class="mono" style="font-size:11px">${esc(s.version)}<br><span class="muted">${esc(s.revision)}</span></td><td class="mono r">${s.instances} <span class="muted">(${s.minInstances}–${s.maxInstances})</span></td><td class="mono r ${s.errorRate > .01 ? 'sev-ERROR' : ''}">${F.pct(s.errorRate, 2)}</td><td class="mono r">${s.p95LatencyMs}ms</td><td class="mono muted">${F.dateTime(s.lastDeployAt).slice(5)}</td><td class="mono muted" style="font-size:10.5px">${esc(s.serviceAccount)}</td></tr>`).join('')}</tbody></table></div></section>
      <div class="split s-55">
        <section class="plate flush"><header><h2>알림 정책</h2><span class="ref">§7.5</span></header><div class="tbl-wrap"><table class="t"><thead><tr><th>켜기</th><th>정책</th><th>조건</th><th>심각도</th><th>채널</th></tr></thead><tbody>${c.alertPolicies.map(p => `<tr><td><input type="checkbox" class="switch" data-ap="${p.id}" ${p.enabled ? 'checked' : ''} aria-label="${esc(p.name)}"></td><td><b>${esc(p.name)}</b><div class="mono muted" style="font-size:10.5px">${esc(p.metric)}</div></td><td class="mono cellwrap" style="font-size:11px;min-width:170px">${esc(p.condition)}</td><td><span class="pill ${p.severity === 'CRITICAL' ? 'tone-failed' : 'tone-retry'}">${esc(p.severity)}</span></td><td class="mono muted" style="font-size:10.5px">${p.channels.map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div></section>
        <section class="plate flush"><header><h2>운영자 권한 (RBAC)</h2><span class="ref">§10.2</span></header><div class="tbl-wrap"><table class="t"><thead><tr><th>권한</th><th>Viewer</th><th>Operator</th><th>Admin</th></tr></thead><tbody>${c.rolePermissions.map(p => `<tr><td>${esc(p.permission)} <span class="mono muted" style="font-size:10px">${esc(p.key)}</span></td>${['Viewer', 'Operator', 'Admin'].map(r => `<td>${p[r] ? `<span style="color:var(--st-success)">${A.icon('check')}</span>` : '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="body" style="display:flex;gap:6px;flex-wrap:wrap">${M.operators.map(o => `<span class="chip">${A.icon('user')} ${esc(o.name)} · ${o.role} · ${esc(o.team)}</span>`).join('')}</div></section>
      </div>
      <section class="plate flush"><header><h2>${A.icon('history')} 감사 로그</h2><label class="field" style="min-width:220px"><input class="in" id="cf-aq" value="${esc(cf.auditQ)}" placeholder="Action, 대상, 운영자, 사유 검색"></label></header><div id="cfAudit">${auditHTML()}</div></section>
    </div>`;
    if (ae) { const el = document.getElementById(ae); if (el) el.focus(); }
  },
  update(){}
};
})();
</script>
<script>window.ATLAS.boot();</script>
