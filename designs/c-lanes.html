    const verNote = `<div class="note ${vers.length > 1 || (orig && orig.pipeline_version !== w.pipeline_version) ? 't-retry' : ''}" style="margin-top:12px">${ic('layers','sm')} Pipeline 버전 ${vers.length > 1 ? `<b>변경됨</b>: ${vers.join(' → ')}` : `<b>${esc(w.pipeline_version)}</b> 고정`}${orig ? ` · 원본(${esc(shortWf(orig.workflow_id))})은 <b>${esc(orig.pipeline_version)}</b>${orig.pipeline_version !== w.pipeline_version ? ' → Replay 시 버전 변경' : ''}` : ''}</div>`;
    const reps = M.replays.filter(r => r.original_workflow_id === w.workflow_id || r.replay_workflow_id === w.workflow_id);
    const repHtml = `<div class="eyebrow" style="margin:12px 0 6px">수동 Replay 기록</div>${reps.length ? reps.map(r => `<div class="note t-dlq" style="margin-bottom:6px"><b class="mono">${esc(r.replay_id)}</b> · ${esc(r.status)} · cycle ${r.replay_cycle} · ${esc(r.pipeline_version_from)} → ${esc(r.pipeline_version_to)}<br><span class="muted">요청 ${esc(opName(r.requested_by))} · 승인 ${esc(opName(r.approved_by))} · ${F.dateTime(r.created_at)}</span><br>${esc(r.reason)}<div style="margin-top:4px;display:flex;gap:6px"><button class="btn sm" data-wf="${esc(r.original_workflow_id)}">원본 ${esc(shortWf(r.original_workflow_id))}</button>${r.replay_workflow_id ? `<button class="btn sm" data-wf="${esc(r.replay_workflow_id)}">Replay ${esc(shortWf(r.replay_workflow_id))}</button>` : ''}<a class="btn sm ghost" href="#/dlq?id=${esc(r.dead_letter_id)}">${esc(r.dead_letter_id)}</a></div></div>`).join('') : '<div class="muted" style="font-size:12px">이 Workflow와 연결된 Replay 없음</div>'}`;
    $('#wfHist').innerHTML = (cards ? `<div style="display:flex;flex-direction:column;gap:8px">${cards}</div>` : `<div class="empty">아직 실행된 Attempt가 없습니다</div>`) + diff + verNote + repHtml;
  },
  /* logs */
  logPass(lg){ const f = S.wf.lf; const sevO = ['DEBUG','INFO','NOTICE','WARNING','ERROR','CRITICAL'];
    if (f.sev && sevO.indexOf(lg.severity) < sevO.indexOf(f.sev)) return false;
    if (f.comp && lg.component !== f.comp && lg.service !== f.comp) return false;
    if (f.evk && !f.evk.ids.has(lg.log_id)) return false;
    if (f.ev && lg.event_type !== f.ev) return false;
    if (f.att && String(lg.attempt) !== f.att) return false;
    if (f.q && !((lg.message + ' ' + (lg.stack_trace||'') + ' ' + lg.component + ' ' + lg.trace_id).toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true; },
  logRow(lg, isNew){ const tone = (M.severityMeta[lg.severity]||{}).tone; const err = lg.severity === 'ERROR' || lg.severity === 'CRITICAL';
    return `<div class="lg ${err ? 'err' : ''}" ${isNew ? 'style="animation:lnIn .8s var(--ease-out)"' : ''}><button data-lgx="${esc(lg.log_id)}"><span class="dim">${L.ic('chevron-right','sm')}</span><span class="muted" title="${esc(lg.timestamp)}">${S.wf.tz === 'UTC' ? esc(new Date(lg.ts).toISOString().slice(11, 23)) + 'Z' : F.timeMs(lg.ts)}</span><span class="sev t-${tone}">${esc(lg.severity)}</span><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lg.component || lg.service)}</span><span class="msg">${esc(lg.message)}${lg.stack_trace ? ' <span class="pill t-failed" style="height:16px;font-size:9.5px">stack trace</span>' : ''}</span></button></div>`; },
  logCount(){ const n = $$('#wfLogs .lg').length; $('#wfLogN').textContent = `${n}줄 · trace ${F.shortHash(this.w().trace_id, 12)}`; },
  filteredLogs(){ return M.getLogs(S.wf.id).filter(lg => this.logPass(lg)); },
  paintLogs(){ const logs = this.filteredLogs().slice().reverse().slice(0, 500); const box = $('#wfLogs'); box.innerHTML = logs.map(l => this.logRow(l)).join('') || '<div class="empty" style="margin:10px">필터에 맞는 로그가 없습니다</div>'; this.logCount(); },
  bindLogs(w){
    const logs = M.getLogs(w.workflow_id);
    const comps = [...new Set(logs.map(l => l.component || l.service))];
    const evs = [...new Set(logs.map(l => l.event_type).filter(Boolean))];
    const f = S.wf.lf;
    $('#wfLF').innerHTML = `<label class="fld"><span>Severity ≥</span><select class="inp" data-lf="sev"><option value="">전체</option>${['INFO','NOTICE','WARNING','ERROR'].map(s => `<option ${f.sev===s?'selected':''}>${s}</option>`).join('')}</select></label>
      <label class="fld"><span>Component</span><select class="inp" data-lf="comp"><option value="">전체</option>${comps.map(c => `<option ${f.comp===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="fld"><span>Event</span><select class="inp" data-lf="ev"><option value="">전체</option>${f.evk ? `<option value="__evk" selected>⟶ ${esc(f.evk.name)} (타임라인)</option>` : ''}${evs.map(c => `<option ${!f.evk && f.ev===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="fld"><span>Attempt</span><select class="inp" data-lf="att"><option value="">전체</option>${(w.attempts||[]).map(a => `<option ${f.att==a.attempt?'selected':''}>${a.attempt}</option>`).join('')}</select></label>
      <label class="fld"><span>검색 (message · stack · trace)</span><input class="inp" data-lf="q" value="${esc(f.q)}" placeholder="Traceback, quota…"></label>`;
    $('#wfLF').addEventListener('input', e => { const k = e.target.dataset.lf; if (!k) return; if (k === 'ev'){ if (e.target.value === '__evk') return; S.wf.lf.evk = null; this.paintTimeline(this.w()); } S.wf.lf[k] = e.target.value; this.paintChips(); this.paintLogs(); });
    $$('#wfTz [data-tz]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.tz === S.wf.tz)); b.onclick = () => { S.wf.tz = b.dataset.tz; $$('#wfTz [data-tz]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); this.paintLogs(); }; });
    this.paintChips();
    $('#wfLogCopy').onclick = () => { const t = this.filteredLogs().map(l => JSON.stringify(l)).join('\n'); L.copyText(t, $('#wfLogs')); };
    $('#wfLogExp').onclick = () => { const t = this.filteredLogs().map(l => JSON.stringify(l)).join('\n'); L.downloadText(t, `${w.workflow_id}-logs.jsonl`, 'application/x-ndjson'); };
    this.paintLogs();
  },
  onClick(ev){
    const n = ev.target.closest('[data-node]'); if (n){ this.selectNode(n.dataset.node); return; }
    const a = ev.target.closest('[data-att]'); if (a){ S.wf.attempt = +a.dataset.att; S.wf.node = null; this.paintDag(this.w()); L.renderCrumbs(); return; }
    const lc = ev.target.closest('[data-logcomp]'); if (lc){ S.wf.lf.comp = lc.dataset.logcomp; S.wf.lf.att = String(S.wf.attempt); this.bindLogsRefresh(); $('#wfLogs').scrollIntoView({behavior: L.motionOK() ? 'smooth' : 'auto', block:'center'}); return; }
    const el = ev.target.closest('[data-evlog]'); if (el){ const e = M.getEvents(S.wf.id).find(x => x.event_id === el.dataset.evid); if (!e) return;
      if (S.wf.lf.evk && S.wf.lf.evk.id === e.event_id){ S.wf.lf.evk = null; } else { S.wf.lf.evk = this.evLink(e); S.wf.lf.ev = ''; }
      this.paintTimeline(this.w()); this.bindLogsRefresh();
      if (S.wf.lf.evk){ toast(`로그 필터: ${esc(e.name)} → ${S.wf.lf.evk.ids.size}줄 (${esc(S.wf.lf.evk.how)})`, 'queued'); const lb = $('#wfLChip'); if (lb && window.innerWidth < 1100) lb.scrollIntoView({behavior: L.motionOK() ? 'smooth' : 'auto', block:'start'}); }
      return; }
    const cx = ev.target.closest('[data-lfclear]'); if (cx){ const k = cx.dataset.lfclear; if (k === 'all') S.wf.lf = {sev:'', comp:'', ev:'', att:'', q:'', evk:null}; else S.wf.lf[k] = k === 'evk' ? null : ''; this.paintTimeline(this.w()); this.bindLogsRefresh(); return; }
    const lx = ev.target.closest('[data-lgx]'); if (lx){ const row = lx.parentElement; const open = row.querySelector('.x'); if (open){ open.remove(); lx.firstElementChild.style.transform = ''; return; } const lg = M.getLogs(S.wf.id).find(l => l.log_id === lx.dataset.lgx); if (!lg) return; lx.firstElementChild.style.transform = 'rotate(90deg)'; row.insertAdjacentHTML('beforeend', `<div class="x">${lg.stack_trace ? `<div class="eyebrow" style="margin:4px 0">Error Stack Trace</div><pre class="code" style="color:var(--st-failed)">${esc(lg.stack_trace)}</pre>` : ''}<div class="eyebrow" style="margin:8px 0 4px;display:flex;gap:8px;align-items:center">JSON payload <button class="btn sm" data-copy="${esc(JSON.stringify(lg, null, 2))}">${L.ic('copy','sm')}복사</button><button class="btn sm" data-trace="${esc(lg.trace_id)}">trace ${esc(F.shortHash(lg.trace_id, 8))}</button></div><pre class="code">${jsonHtml(lg)}</pre></div>`); return; }
    const tr = ev.target.closest('[data-trace]'); if (tr){ S.wf.lf.q = tr.dataset.trace; this.bindLogsRefresh(); toast('Trace ID로 필터링 — Cloud Trace 연동 (Mock)', 'queued'); return; }
    if (ev.target.closest('#wfCancel')){ S.wf.cancel = true; this.paintHero(this.w()); L.hydrateIcons($('#wfHero')); setTimeout(() => { const i = $('#wfCancelReason'); if (i) i.focus(); }, 30); return; }
    if (ev.target.closest('#wfCancelNo')){ S.wf.cancel = false; this.paintHero(this.w()); L.hydrateIcons($('#wfHero')); return; }
    if (ev.target.closest('#wfCancelYes')){ const r = $('#wfCancelReason').value.trim(); if (!r){ $('#wfCancelReason').focus(); toast('취소 사유를 입력하세요', 'retry'); return; } try { M.actions.cancelWorkflow(S.wf.id, {operator:S.operator, reason:r}); toast(`${esc(S.wf.id)} 취소 요청 · 감사 로그 기록`, 'success'); } catch(e){ toast('취소 실패: ' + esc(e.message), 'failed'); } S.wf.cancel = false; this.paintAll(this.w()); return; }
  },
  /* timeline event → related log lines. Events and logs use different vocabularies
     (TASK_PREPROCESS_COMPLETED vs component=preprocess + TASK_COMPLETED), so map, then fall back to a time window. */
  evLink(e){
    const logs = M.getLogs(S.wf.id);
    const sameAtt = l => e.attempt == null || l.attempt == null || l.attempt === e.attempt;
    const ALIAS = {DEAD_LETTER_PUBLISHED:['DEAD_LETTER_ROUTED','DEAD_LETTER_STORED'], VALIDATION_COMPLETED:['VALIDATION_COMPLETED','IDEMPOTENCY_CHECK'], EVENT_RECEIVED:['EVENT_RECEIVED','IDEMPOTENCY_CHECK']};
    const types = ALIAS[e.name] || [e.name];
    let hit = logs.filter(l => types.includes(l.event_type) && Math.abs(l.ts - e.ts) < 90000);
    let how = 'event_type 일치 · ±90s';
    const m = /^TASK_(.+)_(STARTED|COMPLETED|FAILED)$/.exec(e.name);
    if (!hit.length && m){
      const CMAP = {PREPROCESS:['preprocess'], INTENT_EVAL:['intent_eval'], RESPONSE_EVAL:['response_eval'], LATENCY_CHECK:['latency_check'], AGGREGATION:['aggregate'], PERSIST:['persist'], EVALUATION:['intent_eval','response_eval']};
      const comps = CMAP[m[1]] || [m[1].toLowerCase()];
      const tt = {STARTED:['TASK_STARTED'], COMPLETED:['TASK_COMPLETED','TASK_METRICS'], FAILED:['TASK_FAILED']}[m[2]];
      hit = logs.filter(l => comps.includes(l.component) && sameAtt(l) && (tt.includes(l.event_type) || (m[2] === 'FAILED' && (l.severity === 'ERROR' || l.severity === 'CRITICAL'))));
      how = `component ${comps.join('/')} · ${tt.join('/')}${e.attempt ? ' · A' + e.attempt : ''}`;
    }
    if (!hit.length){ hit = logs.filter(l => sameAtt(l) && Math.abs(l.ts - e.ts) <= 5000); how = '이벤트 시각 ±5s 시간 창'; }
    if (!hit.length){ hit = logs.slice().sort((a, b) => Math.abs(a.ts - e.ts) - Math.abs(b.ts - e.ts)).slice(0, 5); how = '이벤트 시각에 가장 가까운 로그 5줄'; }
    return {id:e.event_id, name:e.name, ts:e.ts, attempt:e.attempt, how, ids:new Set(hit.map(l => l.log_id))};
  },
  paintChips(){
    const f = S.wf.lf, box = $('#wfLChip'); if (!box) return;
    const ch = [];
    if (f.evk) ch.push(['evk', `${ic('clock','sm')}타임라인 <b class="mono">${esc(f.evk.name)}</b>${f.evk.attempt ? ` A${f.evk.attempt}` : ''} · ${F.timeMs(f.evk.ts)} <span class="muted">— ${esc(f.evk.how)}</span>`]);
    if (f.ev) ch.push(['ev', `Event <b class="mono">${esc(f.ev)}</b>`]);
    if (f.sev) ch.push(['sev', `Severity ≥ <b>${esc(f.sev)}</b>`]);
    if (f.comp) ch.push(['comp', `Component <b class="mono">${esc(f.comp)}</b>`]);
    if (f.att) ch.push(['att', `Attempt <b>${esc(f.att)}</b>`]);
    if (f.q) ch.push(['q', `검색 <b class="mono">${esc(f.q.length > 24 ? f.q.slice(0, 24) + '…' : f.q)}</b>`]);
    box.hidden = !ch.length;
    box.innerHTML = ch.map(([k, h]) => `<span class="lchip">${h}<button data-lfclear="${k}" aria-label="필터 해제">${ic('x','sm')}</button></span>`).join('') + (ch.length > 1 ? `<button class="btn sm ghost" data-lfclear="all">모두 해제</button>` : '');
    L.hydrateIcons(box);
  },
  bindLogsRefresh(){ const w = this.w(); $('#wfLF').outerHTML = '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:8px" class="lfil" id="wfLF"></div>'; this.bindLogs(w); },
  update(){ const w = this.w(); if (!w) return; const keepCancel = document.activeElement && document.activeElement.id === 'wfCancelReason'; if (!keepCancel) this.paintHero(w); this.paintSummary(w); this.paintDag(w); this.paintHist(w); L.hydrateIcons($('#scr-wf')); },
};
})();
</script>
<script>
/* ===================== DLQ · Results · Analytics · Config · init ===================== */
(function(){
'use strict';
const L = window.LANES; const { M, F, $, $$, esc, ic, LANGS, langOf, SM, toneOf, pill, langTag, shortWf, dur, pct, rel, tm, dt, S, go, SCREENS, can, opName, toast, idBtn, jsonHtml, chart, C, base, axX, axY, LCOL, TCOL, tween, tok } = L;
const DSM = M.dlqStatusMeta, FCM = M.failureCategoryMeta, FRM = M.failureReasonMeta;

/* ---------------- S5 DLQ ---------------- */
SCREENS.dlq = {
  mount(el, r){
    const D = S.dlq; const id = r.q.get('id'); if (id){ D.active = id; D.step = 0; } else if (!D.active){ const f = M.dlq.filter(d => d.status === 'PENDING_REVIEW').sort((a, b) => b.created_at - a.created_at)[0]; if (f) D.active = f.dead_letter_id; }
    el.innerHTML = `
    <div class="s-head"><div><div class="eyebrow">Screen 5 · Recovery</div><h1>DLQ Operations</h1><p>최종 실패와 비복구성 오류가 격리된 Dead Letter. 로그를 확인한 뒤 <b>영구 실패 → 종료</b>, <b>일시 장애 → 수동 Replay</b> (새 Replay Cycle 생성 → 언어 대기열 재등록 → Capacity 확보 → Workflows 재실행).</p></div>
      <div class="fchips" id="dqSt"></div></div>
    <div class="dlqcats" id="dqCats"></div>
    <div class="filters f4">
      <label class="fld"><span>Language</span><select class="inp" id="dqLang"><option value="">전체</option>${LANGS.map(l => `<option value="${l}">${esc(langOf(l).name)}</option>`).join('')}</select></label>
      <label class="fld"><span>상태</span><select class="inp" id="dqStatus"><option value="">전체</option>${Object.entries(DSM).map(([k, m]) => `<option value="${k}">${esc(m.label)}</option>`).join('')}</select></label>
      <label class="fld"><span>발생 시각</span><select class="inp" id="dqSince"><option value="">전체 기간</option><option value="3600000">최근 1시간</option><option value="86400000">최근 24시간</option><option value="259200000">최근 3일</option></select></label>
      <label class="fld"><span>선택</span><span style="display:flex;gap:6px"><button class="btn" id="dqSelAll" type="button">검토 대기 전체 선택</button><button class="btn ghost" id="dqSelNone" type="button">해제</button></span></label>
    </div>
    <div class="split">
      <div style="min-width:0">
        <div class="panel flush"><div class="scroll-x"><table class="tbl" id="dqT"></table></div></div>
        <div id="dqBatch"></div>
        <div class="panel" style="margin-top:14px"><div class="panel-h"><h2 class="sec">${ic('repeat')}Replay 결과</h2><span class="r muted" style="font-size:11px">replays/{replay_id}</span></div><div class="scroll-x"><table class="tbl" id="dqRep"></table></div></div>
      </div>
      <aside class="panel inspector" id="dqInsp"></aside>
    </div>`;
    $('#dqLang').value = D.lang; $('#dqStatus').value = D.status; $('#dqSince').value = D.since;
    ['dqLang','dqStatus','dqSince'].forEach(k => $('#' + k).addEventListener('change', e => { D[{dqLang:'lang', dqStatus:'status', dqSince:'since'}[k]] = e.target.value; this.paint(); }));
    $('#dqSelAll').addEventListener('click', () => { this.rows().filter(d => d.status === 'PENDING_REVIEW').forEach(d => D.sel.add(d.dead_letter_id)); this.paint(); });
    $('#dqSelNone').addEventListener('click', () => { D.sel.clear(); D.batchStep = 0; this.paint(); });
    el.addEventListener('click', this._c = this._c || (e => this.onClick(e)));
    el.addEventListener('change', this._ch = this._ch || (e => { const c = e.target.closest('[data-sel]'); if (c){ c.checked ? S.dlq.sel.add(c.dataset.sel) : S.dlq.sel.delete(c.dataset.sel); this.paintBatch(); } }));
    this.paint();
  },
  rows(){ const D = S.dlq; const now = M.now(); return M.dlq.filter(d => (!D.cat || d.failure_category === D.cat) && (!D.lang || d.language === D.lang) && (!D.status || d.status === D.status) && (!D.since || now - d.created_at <= +D.since)).sort((a, b) => b.created_at - a.created_at); },
  paint(){ this.paintHead(); this.paintTable(); this.paintBatch(); this.paintInsp(); this.paintReplays(); L.hydrateIcons($('#scr-dlq')); },
  paintHead(){
    const by = {}; M.dlq.forEach(d => by[d.status] = (by[d.status]||0) + 1);
    $('#dqSt').innerHTML = Object.entries(DSM).map(([k, m]) => `<span class="pill t-${m.tone}">${ic(m.icon)}${esc(m.label)} <b class="mono">${by[k]||0}</b></span>`).join('');
    const cat = {}; M.dlq.forEach(d => { const c = cat[d.failure_category] = cat[d.failure_category] || {n:0, p:0}; c.n++; if (d.status === 'PENDING_REVIEW') c.p++; });
    $('#dqCats').innerHTML = Object.entries(FCM).map(([k, m]) => `<button data-cat="${k}" aria-pressed="${S.dlq.cat === k}"><span>${ic(m.icon,'sm')}${esc(m.label)}</span><b>${(cat[k]||{}).n||0}</b><small>${(cat[k]||{}).p ? `<span style="color:var(--st-dlq)">검토 대기 ${cat[k].p}</span> · ` : ''}${esc(m.policy)}</small></button>`).join('');
  },
  paintTable(){
    const rows = this.rows(); const D = S.dlq;
    const groups = {}; rows.forEach(d => (groups[d.failure_category] = groups[d.failure_category] || []).push(d));
    $('#dqT').innerHTML = `<thead><tr><th style="width:28px"></th><th>Dead Letter</th><th>언어</th><th>Error Code</th><th class="r">Attempts</th><th>상태</th><th>담당</th><th>발생</th></tr></thead><tbody>${Object.entries(groups).map(([cat, list]) => `<tr><td colspan="8" style="background:var(--surface-2);font-weight:700;font-size:11.5px">${ic(FCM[cat].icon,'sm')} ${esc(FCM[cat].label)} <span class="muted" style="font-weight:500">· ${list.length}건 · 정책: ${esc(FCM[cat].policy)}</span></td></tr>${list.map(d => `<tr class="click ${D.active === d.dead_letter_id ? 'sel' : ''}" data-dl="${d.dead_letter_id}"><td><input type="checkbox" class="chk" data-sel="${d.dead_letter_id}" ${D.sel.has(d.dead_letter_id) ? 'checked' : ''} ${['REPLAYING','APPROVED','CLOSED','REPLAYED'].includes(d.status) ? 'disabled title="Replay 진행/종료된 항목은 선택 불가"' : ''} aria-label="선택"></td><td class="mono">${esc(d.dead_letter_id)}<div class="dim" style="font-size:10px">${esc(d.workflow_id)}</div></td><td>${langTag(d.language)}</td><td><span class="mono" style="color:var(--st-failed);font-size:11px;display:inline-flex;align-items:center;gap:4px">${ic('alert-triangle','sm')}${esc(d.error_code)}</span><div class="muted trunc" style="font-size:10.5px;max-width:240px">${esc(d.failure_reason)}</div></td><td class="r mono">${d.attempts}</td><td>${pill(d.status, DSM)}</td><td class="muted">${d.assigned_operator ? esc(opName(d.assigned_operator)) : '—'}</td><td class="mono muted">${F.date(d.created_at).slice(5)} ${F.hm(d.created_at)}</td></tr>`).join('')}`).join('') || `<tr><td colspan="8"><div class="empty">${ic('check-circle')}조건에 맞는 DLQ 항목이 없습니다</div></td></tr>`}</tbody>`;
  },
  paintBatch(){
    const D = S.dlq, n = D.sel.size, host = $('#dqBatch'); if (!host) return;
    if (!n){ host.innerHTML = ''; D.batchStep = 0; return; }

    this.paint();
    el.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = $('#cf-' + a.dataset.jump); t.scrollIntoView({behavior:L.motionOK() ? 'smooth' : 'auto'}); }));
    const need = (id) => { const v = $('#' + id).value.trim(); if (!v){ $('#' + id).focus(); toast('변경 사유를 입력하세요', 'retry'); } return v; };
    const guard = () => { if (!can('config.write')){ toast(`권한 없음 — ${esc(S.role)} 역할은 설정을 변경할 수 없습니다`, 'failed'); return false; } return true; };
    $('#cfLangApply').addEventListener('click', () => { if (!guard()) return; const reason = need('cfLangReason'); if (!reason) return; let n = 0; M.languages.forEach(l => { const patch = {}; ['maxConcurrent','maxStartsPerMinute','priorityWeight'].forEach(k => { const i = $(`[data-cl="${l.code}:${k}"]`); if (i && +i.value !== l[k]) patch[k] = +i.value; }); const en = $(`[data-cl="${l.code}:enabled"]`); if (en && en.checked !== l.enabled) patch.enabled = en.checked; if (Object.keys(patch).length){ M.actions.updateLanguage(l.code, patch, {operator:S.operator, reason}); n++; } }); toast(n ? `${n}개 언어 설정 변경 · drift 갱신` : '변경 없음', n ? 'success' : 'queued'); $('#cfLangReason').value = ''; this.paint(); });
    $('#cfGA').addEventListener('click', () => { if (!guard()) return; const r = need('cfGR'); if (!r) return; M.actions.setGlobalCapacity(+$('#cfG').value, {operator:S.operator, reason:r}); toast('Global Capacity 변경', 'success'); this.paint(); });
    $('#cfRA').addEventListener('click', () => { if (!guard()) return; const r = need('cfRR'); if (!r) return; M.actions.updateRetryPolicy({maxRetries:+$('#cfRM').value, backoffSeconds:[+$('#cfB0').value, +$('#cfB1').value]}, {operator:S.operator, reason:r}); toast('Retry 정책 변경', 'success'); this.paint(); });
    $('#cfTA').addEventListener('click', () => { if (!guard()) return; const r = need('cfTR'); if (!r) return; const before = {workflowTimeoutMin:cfg.workflowTimeoutMin, pipelineTimeoutMin:cfg.pipelineTimeoutMin, reservationLeaseMin:cfg.reservationLeaseMin}; cfg.workflowTimeoutMin = +$('#cfWT').value; cfg.pipelineTimeoutMin = +$('#cfPT').value; cfg.reservationLeaseMin = +$('#cfLT').value; cfg.runtimeConfig.workflowTimeoutMin = cfg.workflowTimeoutMin; cfg.runtimeConfig.pipelineTimeoutMin = cfg.pipelineTimeoutMin; addAudit('CONFIG_UPDATED', 'timeouts', before, {workflowTimeoutMin:cfg.workflowTimeoutMin, pipelineTimeoutMin:cfg.pipelineTimeoutMin, reservationLeaseMin:cfg.reservationLeaseMin}, r); toast('Timeout 변경 · 신규 Execution부터 적용', 'success'); this.paint(); });
    $('#cfQAp').addEventListener('click', () => { if (!guard()) return; const r = need('cfQR'); if (!r) return; const before = JSON.parse(JSON.stringify(cfg.queuePolicy)); cfg.queuePolicy.mode = $('#cfQM').value; cfg.queuePolicy.crossLanguage = $('#cfQC').value; cfg.queuePolicy.aging.enabled = $('#cfQA').checked; addAudit('CONFIG_UPDATED', 'queuePolicy', before, JSON.parse(JSON.stringify(cfg.queuePolicy)), r); toast('Queue 정책 변경', 'success'); this.paint(); });
    $('#cfDVA').addEventListener('click', () => { if (!can('version.promote')){ toast('권한 없음 — 버전 승격은 Admin', 'failed'); return; } const b = cfg.defaultPipelineVersion; cfg.defaultPipelineVersion = $('#cfDV').value; cfg.runtimeConfig.defaultPipelineVersion = cfg.defaultPipelineVersion; addAudit('PIPELINE_VERSION_PROMOTED', 'defaultPipelineVersion', {version:b}, {version:cfg.defaultPipelineVersion}, 'UI 변경'); toast(`default → ${esc(cfg.defaultPipelineVersion)}`, 'success'); this.paint(); });
    $('#cfOp').addEventListener('change', e => { const o = M.operators.find(x => x.id === e.target.value); S.operator = o.id; S.role = o.role; paintWho(); toast(`${esc(o.name)} (${o.role}) 로 전환 — 권한에 따라 버튼이 비활성화됩니다`, 'queued'); L.route(); });
    el.addEventListener('change', this._ch = this._ch || (e => {
      const sv = e.target.closest('[data-svc]'); if (sv){ if (!guard()){ sv.checked = !sv.checked; return; } const s = cfg.services.find(x => x.id === sv.dataset.svc); s.enabled = sv.checked; addAudit('CONFIG_UPDATED', 'services.' + s.id + '.enabled', {enabled:!s.enabled}, {enabled:s.enabled}, 'UI 토글'); toast(`${esc(s.name)} ${s.enabled ? '활성화' : '비활성화'}`, s.enabled ? 'success' : 'retry'); this.paintAudit(); }
      const ap = e.target.closest('[data-ap]'); if (ap){ if (!guard()){ ap.checked = !ap.checked; return; } const p = cfg.alertPolicies.find(x => x.id === ap.dataset.ap); p.enabled = ap.checked; addAudit('CONFIG_UPDATED', 'alertPolicies.' + p.id, {enabled:!p.enabled}, {enabled:p.enabled}, 'UI 토글'); toast(`알림 정책 「${esc(p.name)}」 ${p.enabled ? 'ON' : 'OFF'}`, 'queued'); this.paintAudit(); }
    }));
    const h = location.hash.split('#')[2]; if (h && $('#cf-' + h)) setTimeout(() => $('#cf-' + h).scrollIntoView(), 50);
  },
  paint(){
    const cfg = M.config; const dr = cfg.drift();
    $('#cfDrift').innerHTML = `<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><span class="pill t-${dr.length ? 'retry' : 'success'}">${ic(dr.length ? 'alert-triangle' : 'check-circle')}${dr.length}개 키 drift</span><span class="muted" style="font-size:11.5px">infrastructure/environments/prod/terraform.tfvars ↔ Firestore runtime_config</span></div>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Key</th><th>Terraform → Runtime</th><th>변경자</th><th>시각</th><th>사유</th></tr></thead><tbody>${dr.map(d => `<tr><td class="mono">${esc(d.key)}</td><td><span class="drift-v"><s>${esc(JSON.stringify(d.terraform))}</s>${ic('arrow-right','sm')}<b>${esc(JSON.stringify(d.runtime))}</b></span></td><td>${esc(opName(d.changedBy))}</td><td class="mono muted">${d.changedAt ? F.dateTime(d.changedAt) : '—'}</td><td style="font-size:11.5px">${esc(d.reason||'')}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">drift 없음</div></td></tr>'}</tbody></table></div>
      <details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:11.5px">terraform plan 미리보기 (runtime 값을 기본값으로 반영할 경우)</summary><pre class="code" style="margin-top:6px">${esc(dr.map(d => `  ~ ${d.key}\n      - ${JSON.stringify(d.terraform)}\n      + ${JSON.stringify(d.runtime)}`).join('\n') || 'No changes.')}\n\nPlan: 0 to add, ${dr.length} to change, 0 to destroy.</pre></details>`;
    $('#cfLang').innerHTML = `<thead><tr><th>언어</th><th>Enabled</th><th>상태</th><th>maxConcurrent</th><th>maxStarts/분</th><th>priorityWeight</th><th class="r">batchSize</th><th class="r">Backlog 임계</th><th class="r">p95 대기 SLO</th></tr></thead><tbody>${M.languages.map(l => { const tf = k => cfg.terraformDefaults['languages.' + l.code + '.' + k]; const inp = k => `<input class="inp mono" data-cl="${l.code}:${k}" type="number" value="${l[k]}" style="width:70px;${tf(k) != null && tf(k) !== l[k] ? 'border-color:var(--st-retry)' : ''}" title="Terraform 기본값 ${tf(k)}"> <span class="dim mono" style="font-size:10px">tf ${tf(k)}</span>`; return `<tr><td>${langTag(l.code)}</td><td><span class="toggle"><input type="checkbox" data-cl="${l.code}:enabled" ${l.enabled ? 'checked' : ''} aria-label="${esc(l.name)} enabled"><i></i></span></td><td>${l.paused ? '<span class="pill t-cancelled">PAUSED</span>' : '<span class="pill t-success">ACTIVE</span>'}</td><td>${inp('maxConcurrent')}</td><td>${inp('maxStartsPerMinute')}</td><td>${inp('priorityWeight')}</td><td class="r mono">${l.batchSize}</td><td class="r mono">${l.backlogAlertThreshold}</td><td class="r mono">${dur(l.p95WaitSloSec*1000)}</td></tr>`; }).join('')}</tbody>`;
    $('#cfSvc').innerHTML = `<thead><tr><th>서비스</th><th>Enabled</th><th>상태</th><th>버전 · Revision</th><th class="r">Instances</th><th class="r">Error rate</th><th class="r">p95</th><th>Service Account</th></tr></thead><tbody>${cfg.services.map(s => `<tr><td><b>${esc(s.name)}</b><div class="muted mono" style="font-size:10px">${esc(s.runtime)} · ${esc(s.region)}</div>${s.note ? `<div style="font-size:10.5px;color:var(--st-retry)">${esc(s.note)}</div>` : ''}</td><td><span class="toggle"><input type="checkbox" data-svc="${s.id}" ${s.enabled ? 'checked' : ''} aria-label="${esc(s.name)}"><i></i></span></td><td><span class="pill t-${s.status === 'HEALTHY' ? 'success' : 'retry'}">${ic(s.status === 'HEALTHY' ? 'check-circle' : 'alert-triangle')}${s.status}</span></td><td class="mono" style="font-size:11px">${esc(s.version)} · ${esc(s.revision)}</td><td class="r mono">${s.instances} <span class="dim">(${s.minInstances}–${s.maxInstances})</span></td><td class="r mono">${pct(s.errorRate, 2)}</td><td class="r mono">${F.number(s.p95LatencyMs)}ms</td><td class="mono muted" style="font-size:10px">${esc(s.serviceAccount)}</td></tr>`).join('')}</tbody>`;
    $('#cfAl').innerHTML = `<thead><tr><th>정책</th><th>Enabled</th><th>Metric · 조건</th><th>심각도</th><th>채널</th><th class="r">열린 알림</th></tr></thead><tbody>${cfg.alertPolicies.map(p => `<tr><td><b>${esc(p.name)}</b><div class="mono dim" style="font-size:10px">${esc(p.id)}</div></td><td><span class="toggle"><input type="checkbox" data-ap="${p.id}" ${p.enabled ? 'checked' : ''} aria-label="${esc(p.name)}"><i></i></span></td><td class="mono" style="font-size:11px">${esc(p.metric)}<div class="muted">${esc(p.condition)}</div></td><td><span class="pill t-${p.severity === 'CRITICAL' ? 'failed' : 'retry'}">${p.severity}</span></td><td class="mono muted" style="font-size:10.5px">${p.channels.map(esc).join('<br>')}</td><td class="r mono">${M.alerts.filter(a => a.policy_id === p.id && a.status !== 'RESOLVED').length}</td></tr>`).join('')}</tbody>`;
    this.paintAudit(); L.hydrateIcons($('#scr-config'));
  },
  paintAudit(){
    const a = M.audit.slice(0, 60);
    $('#cfAud').innerHTML = `<thead><tr><th>시각</th><th>운영자</th><th>Action</th><th>대상</th><th>Before → After</th><th>사유</th><th>Request</th></tr></thead><tbody>${a.map(x => `<tr><td class="mono muted" style="white-space:nowrap">${F.date(x.ts).slice(5)} ${F.time(x.ts)}</td><td><b>${esc(x.actorName || opName(x.actor))}</b><div class="muted" style="font-size:10.5px">${esc(x.role)}</div></td><td class="mono" style="font-size:11px">${esc(x.action)}</td><td class="mono" style="font-size:11px">${esc(x.target)}</td><td class="mono" style="font-size:10.5px;max-width:280px;overflow-wrap:anywhere"><span class="dim">${esc(JSON.stringify(x.before))}</span> → ${esc(JSON.stringify(x.after))}</td><td style="font-size:11.5px">${esc(x.reason||'')}</td><td class="mono dim" style="font-size:10px">${esc(x.request_id)}<br>${esc(x.source_ip)}</td></tr>`).join('')}</tbody>`;
  },
  update(){ if (this._aN !== M.audit.length){ this._aN = M.audit.length; this.paintAudit(); } },
};

function paintWho(){ const o = M.operators.find(x => x.id === S.operator); $('#whoName').textContent = o.name; $('#whoRole').textContent = o.role; $('#whoAv').textContent = o.name.slice(0, 1); }
M.on('audit', () => { if (S.screen === 'config') SCREENS.config.paintAudit(); });
M.on('dlq', d => { if (d && d.status === 'PENDING_REVIEW' && S.screen !== 'dlq') toast(`DLQ 신규 격리 · <b class="mono">${esc(d.dead_letter_id)}</b> ${esc(d.error_code)}`, 'dlq'); });

/* ---------------- init ---------------- */
paintWho(); L.paintThemeBtn(); L.hydrateIcons(document.querySelector('.hdr'));
L.sim.start(); L.paintSim();
$('#clock').textContent = F.time(M.now()); $('#clockDate').textContent = F.dateKo(M.now());
L.route();
})();
</script>
