<title>AIPO Lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Fira+Code:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: "Lanes" — the console is a live scheduler BOARD; language swimlanes are rows, state-machine phases are columns, a 2h time river sits on top. Editorial-data: hairline rules, ink monochrome, status colour carries meaning. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f6f7f9; --sunken:#e3e6ea; --overlay:rgba(17,20,24,.42);
  --ink:#101318; --ink-2:#39414c; --ink-3:#69717d; --ink-4:#9aa1ab;
  --line:#dadee4; --line-2:#c3c9d1; --rule:#101318;
  --accent:#101318; --accent-ink:#ffffff; --focus:#2a78d6; --mark:#fff1a8; --mark-ink:#4a3c00;
  --st-success:#1f8f4e; --st-running:#2a78d6; --st-queued:#7a8190; --st-retry:#c27a00; --st-failed:#d23f3f; --st-dlq:#7d3cc8; --st-cancelled:#5c6370;
  --l-ko:#2a78d6; --l-en:#eb6834; --l-ja:#1baf7a; --l-es:#eda100;
  /* non-language categorical series (cost lines, pipeline versions): hues kept away from the language + status sets */
  --c-1:#4c4fb8; --c-2:#b0407a; --c-3:#0f8a8a; --c-4:#7a6a1e; --c-5:#8a5a3c; --c-6:#5f7d9c; --c-7:#9a9fa8;
  --shadow-1:0 1px 2px rgba(16,19,24,.06),0 1px 1px rgba(16,19,24,.04);
  --shadow-2:0 10px 30px -10px rgba(16,19,24,.28),0 2px 6px rgba(16,19,24,.08);
  --shadow-3:0 -18px 50px -20px rgba(16,19,24,.45);
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-disp:'Do Hyeon','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --f-mono:'Fira Code',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-1:4px; --r-2:7px; --r-3:12px;
  --ease:cubic-bezier(.2,.7,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --gut:16px; --hdr:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --surface:#14171c; --surface-2:#1a1e24; --sunken:#0f1216; --overlay:rgba(0,0,0,.6);
    --ink:#eaedf1; --ink-2:#bcc2cb; --ink-3:#8a929e; --ink-4:#5d6571;
    --line:#252a32; --line-2:#353c47; --rule:#eaedf1;
    --accent:#eaedf1; --accent-ink:#0b0d10; --focus:#3987e5; --mark:#4d4100; --mark-ink:#ffe680;
    --st-success:#3fb871; --st-running:#3987e5; --st-queued:#9aa0aa; --st-retry:#e0a42a; --st-failed:#e66767; --st-dlq:#a77ff0; --st-cancelled:#8b929c;
    --l-ko:#3987e5; --l-en:#d95926; --l-ja:#199e70; --l-es:#c98500; --c-1:#8487f0; --c-2:#e070a8; --c-3:#2fb8b8; --c-4:#b8a24a; --c-5:#c08a68; --c-6:#8fa8c4; --c-7:#6f747d;
    --shadow-1:0 1px 0 rgba(255,255,255,.03); --shadow-2:0 14px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);
    --shadow-3:0 -20px 60px -20px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#14171c; --surface-2:#1a1e24; --sunken:#0f1216; --overlay:rgba(0,0,0,.6);
  --ink:#eaedf1; --ink-2:#bcc2cb; --ink-3:#8a929e; --ink-4:#5d6571;
  --line:#252a32; --line-2:#353c47; --rule:#eaedf1;
  --accent:#eaedf1; --accent-ink:#0b0d10; --focus:#3987e5; --mark:#4d4100; --mark-ink:#ffe680;
  --st-success:#3fb871; --st-running:#3987e5; --st-queued:#9aa0aa; --st-retry:#e0a42a; --st-failed:#e66767; --st-dlq:#a77ff0; --st-cancelled:#8b929c;
  --l-ko:#3987e5; --l-en:#d95926; --l-ja:#199e70; --l-es:#c98500; --c-1:#8487f0; --c-2:#e070a8; --c-3:#2fb8b8; --c-4:#b8a24a; --c-5:#c08a68; --c-6:#8fa8c4; --c-7:#6f747d;
  --shadow-1:0 1px 0 rgba(255,255,255,.03); --shadow-2:0 14px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);
  --shadow-3:0 -20px 60px -20px rgba(0,0,0,.85);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:.01em}
.muted{color:var(--ink-3)} .dim{color:var(--ink-4)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
svg.i.sm{width:12px;height:12px} svg.i.lg{width:18px;height:18px}
.spin{animation:spin 1.4s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

/* tones */
.t-success{--tc:var(--st-success)} .t-running{--tc:var(--st-running)} .t-queued{--tc:var(--st-queued)} .t-retry{--tc:var(--st-retry)} .t-failed{--tc:var(--st-failed)} .t-dlq{--tc:var(--st-dlq)} .t-cancelled{--tc:var(--st-cancelled)}
.L-ko{--lc:var(--l-ko)} .L-en{--lc:var(--l-en)} .L-ja{--lc:var(--l-ja)} .L-es{--lc:var(--l-es)}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 6px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--tc,var(--ink-2));background:color-mix(in srgb,var(--tc,var(--ink-3)) 13%,transparent);border:1px solid color-mix(in srgb,var(--tc,var(--ink-3)) 28%,transparent)}
.pill svg.i{width:12px;height:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc,var(--lc,var(--ink-3)));flex:none}
.lang{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;white-space:nowrap}
.lang::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lc)}
.sev{font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:3px;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}

/* header */
.hdr{position:sticky;top:0;z-index:40;height:var(--hdr);display:flex;align-items:center;gap:14px;padding:0 var(--gut);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none}
.brand-mark{width:28px;height:28px;display:grid;grid-template-rows:repeat(4,1fr);gap:2px;padding:4px;border-radius:6px;background:var(--accent)}
.brand-mark i{display:block;border-radius:1px;background:var(--accent-ink);transform-origin:left;animation:laneGrow 2.8s var(--ease) infinite}
.brand-mark i:nth-child(1){width:70%;--d:0s}.brand-mark i:nth-child(2){width:95%;animation-delay:.25s}.brand-mark i:nth-child(3){width:45%;animation-delay:.5s}.brand-mark i:nth-child(4){width:30%;animation-delay:.75s}
@keyframes laneGrow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
.brand-t{line-height:1.05}
.brand-t b{display:block;font:400 19px/1 var(--f-disp);letter-spacing:.02em}
.brand-t span{font-size:10.5px;color:var(--ink-3);font-weight:500}
.mockflag{font:600 9.5px/1 var(--f-mono);letter-spacing:.08em;padding:4px 6px;border-radius:3px;color:var(--mark-ink);background:var(--mark);border:1px dashed color-mix(in srgb,var(--mark-ink) 40%,transparent);white-space:nowrap}
.nav{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunken);margin-left:6px;min-width:0;overflow:hidden}
.nav a{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;text-decoration:none;font-weight:600;font-size:12.5px;color:var(--ink-3);white-space:nowrap;transition:color .2s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav .nav-pill{position:absolute;top:3px;left:3px;height:30px;border-radius:7px;background:var(--surface);box-shadow:var(--shadow-1),0 0 0 1px var(--line);transition:transform .45s var(--ease-out),width .45s var(--ease-out);pointer-events:none}
.nav a span.cnt{font:500 10px/1 var(--f-mono);padding:2px 4px;border-radius:3px;background:color-mix(in srgb,var(--st-dlq) 16%,transparent);color:var(--st-dlq)}
.nav-wrap{position:relative;display:flex;align-items:center;min-width:0}
.nav-wrap .menu-btn{display:none}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.simctl{display:flex;align-items:center;gap:6px;height:34px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.clock{font:500 12px/1 var(--f-mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live{width:7px;height:7px;border-radius:50%;background:var(--st-success);box-shadow:0 0 0 0 color-mix(in srgb,var(--st-success) 60%,transparent);animation:pulse 1.6s infinite}
.live.off{background:var(--ink-4);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st-success) 55%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.speed{display:flex;gap:1px;background:var(--sunken);padding:2px;border-radius:6px}
.speed button{border:0;background:transparent;font:600 11px/1 var(--f-mono);padding:5px 6px;border-radius:4px;cursor:pointer;color:var(--ink-3)}
.speed button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.who{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;background:var(--ink);color:var(--accent-ink)}
.menu-pop{position:absolute;top:calc(var(--hdr) - 6px);left:var(--gut);right:var(--gut);z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;animation:pop .25s var(--ease-out) backwards}
.menu-pop a{padding:12px;border-radius:8px;text-decoration:none;font-weight:600;display:flex;gap:8px;align-items:center}
.menu-pop a[aria-current="page"]{background:var(--sunken)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}

/* subbar */
.subbar{display:flex;align-items:center;gap:10px;padding:10px var(--gut);min-height:44px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);min-width:0;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--ink-2);font-weight:600}
.crumbs a:hover{text-decoration:underline}
.crumbs .cur{color:var(--ink);font-weight:700}
.ticker{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);min-width:0;max-width:56%;overflow:hidden;white-space:nowrap}
.ticker .tk{display:inline-flex;align-items:center;gap:6px;animation:tkIn .5s var(--ease-out) backwards}
@keyframes tkIn{from{opacity:0;transform:translateY(8px)}}

/* main */
main{padding:18px var(--gut) 64px;max-width:1680px;margin:0 auto}
.screen{animation:screenIn .5s var(--ease-out) backwards}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 16px;flex-wrap:wrap}
.s-head h1{margin:0;font:400 30px/1 var(--f-disp);letter-spacing:.01em}
.s-head p{margin:6px 0 0;color:var(--ink-3);font-size:12.5px;max-width:720px}
.eyebrow{font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h2.sec{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em}
h2.sec .eyebrow{margin-left:auto;font-weight:500;letter-spacing:.04em;text-transform:none}
.rule{border:0;border-top:2px solid var(--rule);margin:26px 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-12-8{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);padding:14px 16px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:22px}
.panel-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.chart{width:100%;height:240px;min-width:0}
.chart.sm{height:180px} .chart.lg{height:300px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll-y{overflow-y:auto}
.empty{display:grid;place-items:center;gap:6px;padding:28px 12px;color:var(--ink-3);text-align:center;font-size:12px;border:1px dashed var(--line-2);border-radius:var(--r-2)}

/* buttons, inputs */
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-4)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink) !important;border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.15)}
.btn.warn{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 40%,var(--line))}
.btn.dlqb{background:var(--st-dlq);border-color:var(--st-dlq);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:24px;padding:0 8px;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.inp,select.inp,textarea.inp{height:30px;padding:0 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);min-width:0;width:100%}
textarea.inp{height:auto;padding:8px 9px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid color-mix(in srgb,var(--focus) 45%,transparent);outline-offset:0;border-color:var(--focus)}
.seg{display:inline-flex;background:var(--sunken);padding:2px;border-radius:7px;gap:1px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 9px;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.chk{width:14px;height:14px;accent-color:var(--ink)}
.toggle{position:relative;display:inline-block;width:32px;height:18px;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle i{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .25s var(--ease-out)}
.toggle input:checked+i{background:var(--st-success)}
.toggle input:checked+i::after{transform:translateX(14px)}
.toggle input:focus-visible+i{outline:2px solid var(--focus);outline-offset:2px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;z-index:1;text-align:left;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:background .12s}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:color-mix(in srgb,var(--st-running) 8%,transparent)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.flash td{animation:rowFlash 1.4s var(--ease)}
@keyframes rowFlash{from{background:color-mix(in srgb,var(--st-running) 18%,transparent)}}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:12px;margin:0}
.kv dt{color:var(--ink-3);font-weight:500}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre.code{margin:0;padding:10px 12px;border-radius:6px;background:var(--sunken);font:12px/1.55 var(--f-mono);overflow:auto;max-height:340px;white-space:pre;color:var(--ink-2)}
pre.code .k{color:var(--st-running)} pre.code .s{color:var(--st-success)} pre.code .n{color:var(--st-retry)} pre.code .b{color:var(--st-dlq)}
.copy-id{border:0;background:transparent;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.copy-id:hover{text-decoration:underline dotted}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-top:2px solid var(--rule);border-bottom:1px solid var(--line)}
.kpi{padding:12px 14px 14px;border-right:1px solid var(--line);min-width:0;position:relative}
.kpi:last-child{border-right:0}
.kpi .lbl{font-size:11px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:400 36px/1.05 var(--f-disp);margin-top:6px;letter-spacing:.01em;white-space:nowrap}
.kpi .v small{font-size:16px;color:var(--ink-3);margin-left:2px}
.kpi .sub{font-size:11px;line-height:1.35;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.kpi .bar{position:absolute;left:0;top:-2px;height:2px;background:var(--tc);width:28px}
.kpi.bump .v{animation:bump .6s var(--ease)}
@keyframes bump{30%{color:var(--tc,var(--ink));transform:translateY(-2px)}}

/* ---------- BOARD ---------- */
.board-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-bottom:12px}
.strip{display:flex;gap:0;border-top:2px solid var(--rule);flex-wrap:wrap}
.strip .m{padding:8px 16px 4px 0;margin-right:16px;border-right:1px solid var(--line);min-width:96px}
.strip .m:last-child{border-right:0}
.strip .m b{display:block;font:400 28px/1 var(--f-disp);white-space:nowrap}
.strip .m>span{font-size:11px;color:var(--ink-3);font-weight:600;display:flex;gap:4px;align-items:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}

.river{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);padding:10px 12px 6px;margin-bottom:14px}
.river-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.river svg{display:block}
.river .lane-lbl{font:600 11px var(--f-body);fill:var(--ink-2)}
.river .axis{font:10px var(--f-mono);fill:var(--ink-3)}
.river .grid-l{stroke:var(--line);stroke-width:1}
.river .span{cursor:pointer;transition:opacity .2s}
.river .span:hover{opacity:.7}
.river .nowline{stroke:var(--ink);stroke-width:1.2}
.river .nowlbl{font:600 10px var(--f-mono);fill:var(--ink)}

.intake{display:flex;align-items:stretch;gap:0;margin-bottom:10px;overflow-x:auto}
.intake .src{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-2);cursor:pointer;text-align:left;min-width:200px;transition:border-color .15s,transform .15s}
.intake .src:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.intake .src b{font:400 20px/1 var(--f-disp)}
.intake .src small{display:block;font-size:10.5px;color:var(--ink-3)}
.intake .src .ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--sunken)}
.intake .wire{flex:1;min-width:60px;position:relative;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 10px)}
.intake .wire i{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--st-running);animation:wire 2.4s linear infinite}
.intake .wire i:nth-child(2){animation-delay:.8s;background:var(--st-queued)} .intake .wire i:nth-child(3){animation-delay:1.6s}
@keyframes wire{from{left:0;opacity:0}10%{opacity:1}90%{opacity:1}to{left:calc(100% - 8px);opacity:0}}

.board-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden}
.board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.board{--lane-w:212px;display:grid;grid-template-columns:var(--lane-w) minmax(118px,.9fr) minmax(150px,1.15fr) minmax(118px,.85fr) minmax(250px,1.9fr) minmax(130px,.9fr) minmax(150px,1fr) minmax(150px,1fr);min-width:1320px;position:relative}
.flowrail{grid-column:1/-1;height:92px;position:relative;border-bottom:1px solid var(--line);background:var(--surface-2)}
.flowrail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flowrail .fr-lbl{position:absolute;left:14px;top:8px;font:600 10px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.5}
.edge.ok{stroke:color-mix(in srgb,var(--st-success) 55%,var(--line-2))}
.edge.rt{stroke:var(--st-retry);stroke-dasharray:4 3}
.edge.dl{stroke:var(--st-dlq)}
.edge.rp{stroke:var(--st-dlq);stroke-dasharray:2 4;opacity:.7}
.edge-lbl{font:500 9.5px var(--f-mono);fill:var(--ink-3);paint-order:stroke;stroke:var(--surface-2);stroke-width:4px;stroke-linejoin:round}
.node-lbl{font:600 9.5px var(--f-body);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.tok{pointer-events:none}
.colh{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px 9px;border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-width:0;transition:background .15s}
.colh:hover{background:var(--surface-2)}
.colh:hover .colh-more{opacity:1;transform:none}
.colh .k{font:600 9.5px/1 var(--f-mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;display:flex;gap:5px;align-items:center}
.colh .t{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.colh .n{font:400 22px/1 var(--f-disp);margin-left:auto;position:absolute;right:12px;top:12px}
.colh .s{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.colh .colh-more{position:absolute;right:10px;bottom:8px;font-size:10px;color:var(--ink-3);opacity:0;transform:translateY(3px);transition:.2s}
.colh.lead{cursor:default;border-left:0;background:var(--surface-2)}
.colh .tick{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--tc,var(--ink));transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-out)}
.colh:hover .tick{transform:scaleX(1)}
.lanehd{display:flex;flex-direction:column;gap:7px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);position:relative;min-width:0;cursor:pointer}
.lanehd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc)}
.lanehd:hover{background:var(--sunken)}
.lanehd .nm{display:flex;align-items:baseline;gap:6px}
.lanehd .nm b{font-weight:800;font-size:14px}
.lanehd .nm code{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.lanehd .st{margin-left:auto}
.lanehd .cap{display:flex;align-items:baseline;gap:4px}
.lanehd .cap b{font:400 26px/1 var(--f-disp)}
.lanehd .cap span{font:400 15px/1 var(--f-disp);color:var(--ink-3)}
.lanehd .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:10.5px;color:var(--ink-3)}
.lanehd .meta b{color:var(--ink);font-weight:700;font-size:11.5px}
.lanehd .meta .over{color:var(--st-failed)}
.slots{display:grid;grid-template-columns:repeat(var(--cols,10),1fr);gap:2px;max-width:184px}
.slot{height:9px;border-radius:2px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:background .4s var(--ease),box-shadow .4s}
.slot.on{background:var(--tc);box-shadow:none}
.slot.on.pulse{animation:slotIn .7s var(--ease-out)}
@keyframes slotIn{0%{transform:scaleY(.2);filter:brightness(1.6)}}
.slot.orphan{background:repeating-linear-gradient(135deg,var(--st-retry) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--st-retry)}
.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;min-height:118px;min-width:0;position:relative;transition:background .3s}
.cell.c-run{background:color-mix(in srgb,var(--st-running) 3%,transparent)}
.cell.c-retry{background:color-mix(in srgb,var(--st-retry) 4%,transparent)}
.cell.c-dlq{background:color-mix(in srgb,var(--st-dlq) 4%,transparent)}
.cell .more{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:5px;border:1px dashed var(--line-2);font:500 10.5px var(--f-mono);color:var(--ink-3);background:transparent;cursor:pointer}
.cell .more:hover{color:var(--ink);border-color:var(--ink-3)}
.cell .zero{font-size:10.5px;color:var(--ink-4);padding:4px 2px}
.bc{position:relative;display:flex;align-items:center;gap:7px;width:100%;max-width:100%;padding:5px 7px 5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;font-size:11px;line-height:1.25;will-change:transform;transition:border-color .15s,box-shadow .2s}
.bc:hover{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 14%,transparent)}
.bc::before{content:"";position:absolute;left:-1px;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--tc)}
.bc .ring{width:26px;height:26px;flex:none}
.bc .ring circle{fill:none;stroke-width:3.2}
.bc .ring .bg{stroke:var(--sunken)}
.bc .ring .fg{stroke:var(--tc);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.bc .ring text{font:600 7.5px var(--f-mono);fill:var(--ink-2);text-anchor:middle;dominant-baseline:central}
.bc .bt{min-width:0;flex:1}
.bc .id{font:600 11px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.bc .sb{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px;min-width:0}
.bc .sb .sbt{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc .sb svg{flex:none}
.bc .att{flex:none;font:600 9.5px/1 var(--f-mono);padding:3px 4px;border-radius:3px;background:var(--sunken);color:var(--ink-2)}
.bc .att.hot{background:color-mix(in srgb,var(--st-retry) 18%,transparent);color:var(--st-retry)}
.bc.mini{width:auto;max-width:calc(50% - 3px);flex:1 1 calc(50% - 3px);padding:4px 6px 4px 7px;gap:5px}
.bc.mini .ring{width:18px;height:18px}
.bc.mini .ring text{display:none}
.bc.mini .sb{display:none}
.c-run .bc{width:calc(50% - 3px)}
.bc.flash{animation:cardFlash 1.2s var(--ease)}
@keyframes cardFlash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tc) 70%,transparent),var(--shadow-1)}100%{box-shadow:0 0 0 10px transparent,var(--shadow-1)}}
.bc.born{animation:born .6s var(--ease-out) backwards}
@keyframes born{from{opacity:0;transform:scale(.7)}}
.bc .node-tag{font:500 9.5px var(--f-mono);color:var(--tc)}
.board-foot{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.feed{display:flex;flex-direction:column;gap:0;font-size:11.5px}
.feed .ev{display:grid;grid-template-columns:62px 18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.feed .ev.new{animation:evIn .6s var(--ease-out)}
.ovev-p{display:flex;flex-direction:column}
.ovev{flex:1 1 0;min-height:420px;max-height:none}
@media (max-width:1100px){.ovev{flex:none;max-height:460px}}
@keyframes evIn{from{background:color-mix(in srgb,var(--st-running) 14%,transparent);transform:translateX(-6px)}}
.feed .ev .nm{font:500 11px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .ev .tm{font:11px var(--f-mono);color:var(--ink-3)}

/* drawer (bottom sheet) */
.scrim{position:fixed;inset:0;z-index:70;background:var(--overlay);animation:fade .25s backwards}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;height:min(78vh,760px);background:var(--surface);border-top:2px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:sheetUp .45s var(--ease-out) backwards}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet.closing{animation:sheetDown .3s var(--ease) forwards}
@keyframes sheetDown{to{transform:translateY(100%)}}
.sheet-grip{width:44px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0}
.sheet-h{display:flex;align-items:flex-start;gap:14px;padding:10px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-h h3{margin:0;font:400 24px/1.1 var(--f-disp)}
.sheet-h .svc{font:500 11px var(--f-mono);color:var(--ink-3)}
.sheet-h .x{margin-left:auto}
.sheet-tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.sheet-tabs button{position:relative;border:0;background:transparent;padding:10px 12px;font-weight:700;font-size:12px;color:var(--ink-3);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.sheet-tabs button[aria-selected="true"]{color:var(--ink)}
.sheet-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink)}
.sheet-tabs .c{font:500 10px var(--f-mono);color:var(--ink-3);background:var(--sunken);padding:2px 5px;border-radius:3px}
.sheet-b{flex:1;overflow:auto;padding:14px 20px 24px}
.stagepick{display:flex;gap:6px;flex-wrap:wrap}
.stagepick button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;gap:5px;align-items:center}
.stagepick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stream{font:11.5px/1.6 var(--f-mono);background:var(--sunken);border-radius:6px;padding:8px 0;max-height:52vh;overflow:auto}
.stream .ln{display:grid;grid-template-columns:96px 66px 150px minmax(0,1fr);gap:10px;padding:1px 12px;white-space:nowrap}
.stream .ln .msg{white-space:pre-wrap;overflow-wrap:anywhere}
.stream .ln.new{animation:lnIn .8s var(--ease-out)}
@keyframes lnIn{from{background:color-mix(in srgb,var(--st-running) 18%,transparent)}}
.stream .ln:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.evrow{border-bottom:1px solid var(--line)}
.evrow>button{display:grid;grid-template-columns:90px 16px minmax(160px,220px) minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 4px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:12px}
.evrow>button:hover{background:var(--surface-2)}
.evrow .chev{transition:transform .2s}
.evrow[open-row] .chev{transform:rotate(90deg)}
.evrow pre{margin:0 0 10px 26px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;border-top:2px solid var(--rule)}
.mgrid .m{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mgrid .m span{font-size:11px;color:var(--ink-3);font-weight:600}
.mgrid .m b{display:block;font:400 26px/1.1 var(--f-disp);margin-top:4px;overflow-wrap:anywhere}
.mgrid .m b.s{font:600 12px/1.4 var(--f-mono)}
.mgrid .m.wide{grid-column:span 2}
.mgrid .m b.s .kvs{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px}
.mgrid .m b.s .kv1{display:inline-flex;align-items:baseline;gap:5px;padding:2px 7px;border-radius:4px;background:var(--sunken);font:500 11px/1.4 var(--f-mono);color:var(--ink-2)}
.mgrid .m b.s .kv1 b{display:inline;font:700 12px/1.4 var(--f-mono);margin:0;color:var(--ink)}

/* modal */
.modal{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);animation:modalIn .35s var(--ease-out) backwards}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%) scale(.98)}}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:15px}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.scrim.m{z-index:80}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--ink);color:var(--accent-ink);box-shadow:var(--shadow-2);font-size:12px;animation:toastIn .4s var(--ease-out) backwards}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* side panel (detail inspector) */
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.inspector{position:sticky;top:calc(var(--hdr) + 12px);max-height:calc(100vh - var(--hdr) - 24px);overflow:auto}
.inspector.pop{animation:inspIn .35s var(--ease-out)}
@keyframes inspIn{from{opacity:.3;transform:translateX(10px)}}

/* Detail */
.wf-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-bottom:2px solid var(--rule);padding-bottom:14px;margin-bottom:14px}
.wf-hero h1{margin:4px 0 0;font:600 20px/1.2 var(--f-mono);letter-spacing:-.02em;overflow-wrap:anywhere}
.wf-hero .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface);margin-bottom:14px}
.sum>div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.sum>div>span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.sum>div b{font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.sum>div.w2{grid-column:span 2} .sum>div.w3{grid-column:span 3}
.statemap{display:flex;gap:0;align-items:center;overflow-x:auto;padding:4px 0 2px}
.statemap .sm{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;font-size:10px;color:var(--ink-3);position:relative}
.statemap .sm i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);z-index:1}
.statemap .sm.done i{background:var(--tc);border-color:var(--tc)}
.statemap .sm.cur i{box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 25%,transparent);animation:curp 1.6s infinite}
@keyframes curp{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tc) 10%,transparent)}}
.statemap .sm.done,.statemap .sm.cur{color:var(--ink)}
.statemap .sm::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.statemap .sm:first-child::before{display:none}
.statemap .sm.done::before,.statemap .sm.cur::before{background:var(--tc)}
.dag{display:block;width:100%;min-width:760px}
.dag .nd{cursor:pointer}
.dag .nd rect.box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2;transition:stroke .2s}
.dag .nd:hover rect.box{stroke:var(--ink-3)}
.dag .nd.sel rect.box{stroke:var(--ink);stroke-width:2}
.dag .nd.fail rect.box{stroke:var(--st-failed);stroke-width:2;fill:color-mix(in srgb,var(--st-failed) 7%,var(--surface))}
.dag .nd .ttl{font:700 12px var(--f-body);fill:var(--ink)}
.dag .nd .sub{font:10.5px var(--f-mono);fill:var(--ink-3)}
.dag .nd .bar-bg{fill:var(--sunken)}
.dag .nd .bar-fg{transition:width .8s var(--ease)}
.dag .ed{fill:none;stroke:var(--line-2);stroke-width:1.6}
.dag .ed.on{stroke:var(--st-running);stroke-dasharray:5 5;animation:dash 0.9s linear infinite}
.dag .ed.ok{stroke:color-mix(in srgb,var(--st-success) 60%,var(--line-2))}
@keyframes dash{to{stroke-dashoffset:-10}}
.dag .glow{fill:none;stroke:var(--st-failed);stroke-width:6;opacity:.18;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{opacity:.04}}
.tl{position:relative;margin:0;padding:0 0 0 18px;list-style:none}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:5px 0;font-size:12px}
.tl li::before{content:"";position:absolute;left:-17px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--tc,var(--ink-4))}
.tl li.new{animation:evIn .6s var(--ease-out)}
.tl li .nm{font:600 11.5px var(--f-mono)}
.tl li .lb{color:var(--ink-3);font-size:11px}
.tl .gap{font:10px var(--f-mono);color:var(--ink-4);padding-left:96px}
.logbox{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.lg{border-bottom:1px solid var(--line);font:11.5px/1.5 var(--f-mono)}
.lg>button{display:grid;grid-template-columns:14px 100px 66px 130px minmax(0,1fr);gap:8px;width:100%;padding:5px 10px;border:0;background:transparent;text-align:left;cursor:pointer;align-items:start}
.lg>button:hover{background:var(--surface-2)}
.lg .msg{white-space:pre-wrap;overflow-wrap:anywhere}
.lg.err>button{background:color-mix(in srgb,var(--st-failed) 6%,transparent)}
.lg .x{padding:0 10px 10px 32px}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;align-items:center}
.lchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 4px 3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--st-running) 40%,var(--line));background:color-mix(in srgb,var(--st-running) 8%,var(--surface));font-size:11px;color:var(--ink-2);min-width:0}
.lchip>b{color:var(--ink)}
.lchip .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lchip button{display:inline-grid;place-items:center;width:18px;height:18px;border:0;border-radius:50%;background:transparent;color:var(--ink-3);cursor:pointer;flex:none}
.lchip button:hover{background:var(--sunken);color:var(--ink)}
.tl li .nm[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 14%,transparent);border-radius:3px;outline:1px solid color-mix(in srgb,var(--tc) 45%,transparent);outline-offset:1px}
@media (max-width:720px){
  .lg>button{grid-template-columns:14px auto auto minmax(0,1fr);gap:4px 8px}
  .lg>button>span:nth-child(4){max-width:100%}
  .lg .msg{grid-column:2/-1}
  .lg .x{padding-left:12px}
}
.attempts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* capacity screen */

.slots.lg .slot{height:26px;border-radius:4px}
.capocc{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}

.capstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.capstats div span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.stepper button{width:28px;height:28px;border:0;background:var(--surface-2);cursor:pointer;font-weight:700}
.stepper input{width:46px;height:28px;border:0;text-align:center;background:var(--surface);font:600 13px var(--f-mono)}
.note{font-size:11.5px;padding:8px 10px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--tc,var(--ink-4));color:var(--ink-2)}

.formrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;font-size:12px}

/* heatmap & results */
.hm{display:grid;gap:2px;font-size:11px}
.hm .h{font-weight:700;color:var(--ink-3);font-size:10.5px;padding:4px;text-align:center}
.hm .rl{font-weight:600;padding:4px 8px 4px 0;white-space:nowrap;display:flex;align-items:center}
.hm .c{height:34px;border-radius:3px;display:grid;place-items:center;font:600 11px var(--f-mono);cursor:pointer;transition:transform .15s,outline .15s;position:relative}
.hm .c:hover{transform:scale(1.06);z-index:1;outline:2px solid var(--ink)}
.hm .c.sel{outline:2px solid var(--ink)}
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface);margin-bottom:14px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:999px;background:var(--sunken);font-size:11px;font-weight:600}
.fchip button{border:0;background:transparent;cursor:pointer;color:var(--ink-3);padding:0 2px;display:grid}
.filters.f4{grid-template-columns:repeat(4,minmax(0,1fr))}

.filecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-left:4px solid var(--st-success);border-radius:var(--r-2);background:var(--surface);margin-bottom:14px}
.filecard .uri{font:600 12.5px var(--f-mono);overflow-wrap:anywhere}
.multis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.multi{border-top:3px solid var(--lc);padding-top:8px;min-width:0}
.multi h4{margin:0;display:flex;align-items:baseline;gap:6px;font-size:12px}
.multi h4 b{font:400 24px/1 var(--f-disp);margin-left:auto}
.utt{display:flex;flex-direction:column;gap:10px}
.utt .q{font-size:15px;font-weight:600;line-height:1.45}
.utt .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.utt .cmp>div{padding:8px 10px;border-radius:6px;background:var(--surface-2);font-size:12px;min-width:0;overflow-wrap:anywhere}
.utt .cmp>div span{display:block;font-size:10px;color:var(--ink-3);font-weight:700;margin-bottom:2px}
.utt .cmp>div.bad{background:color-mix(in srgb,var(--st-failed) 9%,transparent)}
.score{display:flex;align-items:center;gap:10px}
.score .track{flex:1;height:8px;border-radius:4px;background:var(--sunken);position:relative;overflow:hidden}
.score .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--tc)}
.score .track b{position:absolute;left:70%;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:8px 10px;font-size:11.5px;color:var(--ink-3)}

.dlqcats small{font-size:10px;color:var(--ink-4);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batchbar{position:sticky;bottom:12px;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--accent-ink);box-shadow:var(--shadow-2);margin-top:12px;flex-wrap:wrap;animation:pop .3s var(--ease-out) backwards}
.batchbar .inp{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--accent-ink) 30%,transparent);flex:1;min-width:180px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--st-dlq)}
.confirm{border:1px solid color-mix(in srgb,var(--st-dlq) 40%,var(--line));background:color-mix(in srgb,var(--st-dlq) 5%,var(--surface));border-radius:8px;padding:12px;animation:pop .3s var(--ease-out) backwards}

/* config */
.cfg-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--hdr) + 12px)}
.cfg-nav a{padding:7px 10px;border-radius:6px;text-decoration:none;font-weight:600;font-size:12px;color:var(--ink-2)}
.cfg-nav a:hover{background:var(--sunken)}
.cfg{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px}
.cfg section{scroll-margin-top:calc(var(--hdr) + 12px)}
.drift-v{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-mono)}
.drift-v s{color:var(--ink-4)}
.drift-v b{color:var(--st-retry)}
.perm-y{color:var(--st-success)} .perm-n{color:var(--ink-4)}

function toast(msg, tone='running'){
  if (tone === 'success') $$('#toasts .toast[data-tone="retry"]').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.dataset.tone = tone; t.title = '클릭하여 닫기'; t.addEventListener('click', () => t.remove());
  t.innerHTML = `<span class="t-${tone}" style="color:var(--tc)">${ic(tone==='success'?'check-circle':tone==='failed'?'alert-triangle':'info')}</span><div>${msg}</div>`;
  $('#toasts').appendChild(t);
  const all = $$('#toasts .toast'); if (all.length > 4) all.slice(0, all.length - 4).forEach(x => x.remove());
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3200);
}
async function copyText(text, fallbackEl){
  try { await navigator.clipboard.writeText(text); toast('클립보드에 복사했습니다', 'success'); return true; }
  catch(e){
    if (fallbackEl){ fallbackEl.focus(); if (fallbackEl.select) fallbackEl.select(); else { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
    toast('클립보드 권한이 없어 텍스트를 선택했습니다. ⌘/Ctrl+C 로 복사하세요', 'retry'); return false;
  }
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c){ e.stopPropagation(); copyText(c.dataset.copy); }
});
function tween(el, to, fmt=(v)=>F.number(Math.round(v))){
  if (!el) return;
  const from = el._v == null ? to : el._v; el._v = to;
  if (!motionOK() || from === to || typeof to !== 'number'){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = 700;
  cancelAnimationFrame(el._raf);
  const step = now => { const k = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
  const card = el.closest('.kpi'); if (card){ card.classList.remove('bump'); void card.offsetWidth; card.classList.add('bump'); }
}

document.addEventListener('mousemove', e => { if (tip.hidden) return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 10; if (y + h > innerHeight - 8) y = e.clientY - h - 10; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });

/* ---------- JSON pretty ---------- */
function jsonHtml(o){
  const s = JSON.stringify(o, null, 2) || '';
  return esc(s).replace(/(&quot;[^&]*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+\.?\d*(e[+-]?\d+)?)/g, (m, str, colon, bool, n) => {
    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (bool) return `<span class="b">${bool}</span>`;
    return `<span class="n">${m}</span>`;
  });
}

function downloadText(text, filename, type='text/plain'){
  try { const b = new Blob([text], {type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(`${esc(filename)} 내보내기`, 'success'); }
  catch(e){ toast('다운로드가 차단되었습니다', 'retry'); }
}

  const c = echarts.init(el, null, {renderer:'canvas'});

}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path0, qs] = h.split('?'); const path = (path0||'').split('#')[0];
  const parts = (path||'').split('/').filter(Boolean);
  return { screen: parts[0] || 'board', arg: parts.slice(1).map(decodeURIComponent).join('/'), q: new URLSearchParams(qs||'') };
}
const go = h => { if (location.hash !== h) location.hash = h; else route(); };
const SCREENS = {};
let mounted = null;
function route(){
  const r = parseHash();
  if (!SCREENS[r.screen]) { go('#/board'); return; }
  S.route = r;
  const prev = S.screen; S.screen = r.screen;
  $$('#main > .screen').forEach(s => { s.hidden = s.dataset.screen !== r.screen; });
  const el = $('#scr-' + r.screen);
  if (prev !== r.screen || mounted !== r.screen){ el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
  if (window.__closeSheet && prev !== r.screen) window.__closeSheet(true);
  clearCharts();
  SCREENS[r.screen].mount(el, r);
  mounted = r.screen;
  hydrateIcons(el);
  renderNav(); renderCrumbs();
  if (prev !== r.screen) window.scrollTo({top:0, behavior: 'auto'});
}

function rethemeAll(){ charts.forEach(r => { try { r.c.dispose(); } catch(e){} r.c = echarts.init(r.el, null, {renderer:'canvas'}); r.c.setOption(r.optFn()); }); if (SCREENS[S.screen].retheme) SCREENS[S.screen].retheme(); }
try { const t = localStorage.getItem('aipo-lanes-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme){ paintThemeBtn(); rethemeAll(); } });

/* ---------- simulator ---------- */
const sim = M.createSimulator({speed:1});
let dirty = false;
sim.on('tick', snap => {
  $('#clock').textContent = F.time(snap.now); $('#clockDate').textContent = F.dateKo(snap.now);
  if (!dirty){ dirty = true; requestAnimationFrame(() => { dirty = false; const s = SCREENS[S.screen]; if (s && s.update) s.update(snap); const d = $('#navDlq'); if (d) d.textContent = M.dlq.filter(x => x.status === 'PENDING_REVIEW').length; if (window.__sheetTick) window.__sheetTick(); }); }
});
function paintSim(){
  const r = sim.isRunning();
  $('#simToggle').innerHTML = ic(r ? 'pause' : 'play');
  $('#simToggle').setAttribute('aria-label', r ? '시뮬레이터 일시정지' : '시뮬레이터 재개');
  $('#liveDot').classList.toggle('off', !r);
  $$('#speed button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === sim.getSpeed())));
}
$('#simToggle').addEventListener('click', () => { sim.isRunning() ? sim.stop() : sim.start(); paintSim(); toast(sim.isRunning() ? '시뮬레이터 재개' : '시뮬레이터 일시정지 — 가상 시계 정지', 'queued'); });
$('#speed').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sim.setSpeed(+b.dataset.s); paintSim(); });
// ticker of transitions
const tickerQ = [];
M.on('transition', t => {
  const m = SM[t.to]; if (!m) return;
  tickerQ.unshift(`<span class="tk t-${m.tone}">${ic(m.icon,'sm')}<b class="mono" style="color:var(--ink)">${esc(shortWf(t.workflow_id))}</b> ${esc((SM[t.from]||{}).label||t.from)} → <b style="color:var(--tc)">${esc(m.label)}</b></span>`);
  tickerQ.length = 3;
  $('#ticker').innerHTML = tickerQ.filter(Boolean).join('<span class="dim">·</span>');
});

/* expose */
window.LANES = { M, F, $, $$, esc, ic, hydrateIcons, motionOK, LANGS, langOf, SM, toneOf, pill, langTag, shortWf, dur, pct, num, rel, tm, dt, tok, LCOL, TCOL, idBtn, S, can, opName, toast, copyText, tween, openModal, closeModal, jsonHtml, csvModal, downloadText, chart, clearCharts, charts, C, base, axX, axY, kstLabel, kstDayLabel, go, route, SCREENS, wfHref, renderCrumbs, renderNav, sim, paintSim, paintThemeBtn };
})();
</script>
<script>
/* ===================== Board · Time river · Stage sheet ===================== */
(function(){
'use strict';
const L = window.LANES; const { M, F, $, $$, esc, ic, motionOK, LANGS, langOf, SM, toneOf, pill, langTag, shortWf, dur, pct, rel, tm, S, go, SCREENS, tween } = L;

const COLS = [
  {id:'intake', k:'01', t:'수신·검증', states:['RECEIVED','VALIDATED'], stages:['ingress','event_bus','gcs_input'], tone:'queued', icon:'shield-check', svc:'Cloud Run Ingress'},
  {id:'queue', k:'02', t:'대기열', states:['QUEUED'], stages:['registry_queue'], tone:'queued', icon:'list-ordered', svc:'Firestore Pending Queue', cap:8, mini:true},
  {id:'reserve', k:'03', t:'슬롯 예약', states:['RESERVED'], stages:['scheduler'], tone:'queued', icon:'lock', svc:'Language-aware Scheduler'},
  {id:'run', k:'04', t:'실행', states:['DISPATCHING','RUNNING'], stages:['vertex','workflows'], tone:'running', icon:'cpu', svc:'Cloud Workflows → Vertex AI', cap:12},
  {id:'retry', k:'05', t:'재시도 대기', states:['RETRY_WAIT'], stages:['retry'], tone:'retry', icon:'rotate-ccw', svc:'Retry Controller · 60s/300s'},
  {id:'done', k:'06', t:'완료', states:['SUCCEEDED'], stages:['results'], tone:'success', icon:'file-check', svc:'Result CSV → BigQuery', cap:3, recent:true},
  {id:'dlq', k:'07', t:'DLQ · 종료', states:['DEAD_LETTERED','CANCELLED','TIMED_OUT'], stages:['dlq','workflows'], tone:'dlq', icon:'archive-x', svc:'DLQ Manager · Manual Replay', cap:3, recent:true},
];
const COL_OF = {}; COLS.forEach((c, i) => c.states.forEach(s => COL_OF[s] = i));
L.COLS = COLS; L.COL_OF = COL_OF;

const cardEls = new Map(); let lastCol = new Map(); let built = false; let root;

function ring(pctv, txt){
  const r = 10, C = 2 * Math.PI * r, off = C * (1 - Math.max(0, Math.min(1, pctv||0)));
  return `<svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle class="bg" cx="13" cy="13" r="${r}"/><circle class="fg" cx="13" cy="13" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 13 13)"/><text x="13" y="13.5">${esc(txt)}</text></svg>`;
}
function cardSub(w){
  const now = M.now();
  switch (w.status){
    case 'RUNNING': { const n = w.current_node && M.DAG_TEMPLATE.find(d => d.id === w.current_node); return `<span class="node-tag">${esc(n ? n.labelKo.replace(/\s*\(.*\)$/, '') : '집계')}</span>`; }
    case 'DISPATCHING': return 'PipelineJob 생성 중';
    case 'QUEUED': return `대기 ${dur(now - (w.queued_at||w.created_at))} · P${w.priority}`;
    case 'RESERVED': return `슬롯 확보 · ${rel(w.reserved_at)}`;
    case 'RECEIVED': return '스키마 검증 중';
    case 'VALIDATED': return '멱등성 확인 완료';
    case 'RETRY_WAIT': return `재시도 ${w.retry_at ? F.relative(w.retry_at) : ''} · ${esc((w.error||{}).code||'')}`;
    case 'SUCCEEDED': return w.result ? `PASS ${Math.round(w.result.passRate * 100)}%` : '결과 커밋';
    case 'DEAD_LETTERED': return esc((w.error||{}).code || 'DLQ');
    case 'CANCELLED': return `취소 · ${esc(w.cancelled_by ? L.opName(w.cancelled_by) : '')}`;
    case 'TIMED_OUT': return '시간 초과';
  }
  return SM[w.status].label;
}
function cardHtml(w, mini){
  const m = SM[w.status];
  const p = w.status === 'SUCCEEDED' ? 1 : (w.progress ? w.progress.pct : 0);
  const txt = ['RUNNING','SUCCEEDED'].includes(w.status) ? Math.round(p*100) : (w.status==='QUEUED' ? 'P'+w.priority : '');
  return `${ring(p, txt)}<span class="bt"><span class="id">${w.replay_of ? ic('repeat','sm') : ''}${esc(mini ? '#' + shortWf(w.workflow_id).split('-').pop() : shortWf(w.workflow_id))}</span><span class="sb" title="${esc(SM[w.status].label + ' · ' + String(cardSub(w)).replace(/<[^>]+>/g, '') + (w.status === 'RUNNING' && w.progress ? ` · ${w.progress.processed}/${w.progress.total} 발화` : '') + (w.completed_at ? ' · ' + rel(w.completed_at) : ''))}">${ic(m.icon,'sm')}<span class="sbt">${cardSub(w)}</span></span></span>${w.attempt>0?`<span class="att${w.attempt>1?' hot':''}" title="attempt ${w.attempt}/3">A${w.attempt}</span>`:''}`;
}

function laneData(){
  const cap = M.getCapacity(); const byL = {}; cap.languages.forEach(l => byL[l.code] = l); return {cap, byL};
}

function build(el){
  root = el;
  el.innerHTML = `
  <div class="s-head">
    <div><div class="eyebrow">Orchestration · Live Board</div><h1>언어 레인 스케줄러 보드</h1>
    <p>행은 언어별 레인(Capacity Slot), 열은 Workflow 상태 머신 단계입니다. 배치 카드는 시뮬레이터 틱마다 다음 단계로 이동합니다. <b>열 머리글</b>을 누르면 단계 상세(GCS 객체·이벤트·진행 로그·메트릭), <b>카드</b>를 누르면 Pipeline Detail로 이동합니다.</p></div>
    <div class="legend" id="bLegend"></div>
  </div>
  <div class="strip" id="bStrip"></div>
  <div style="height:14px"></div>
  <div class="river" id="river">
    <div class="river-h"><h2 class="sec">${ic('activity')}Time river <span class="muted" style="font-weight:500">— 레인별 Workflow 구간 (대기 · 실행 · 재시도 Backoff)</span></h2>
      <div class="seg" id="rWin" style="margin-left:auto" role="group" aria-label="시간 범위"><button data-w="30">30분</button><button data-w="60">1시간</button><button data-w="120">2시간</button></div></div>
    <div class="scroll-x"><div id="riverSvg"></div></div>
  </div>
  <div class="intake" id="intake"></div>
  <div class="board-wrap">
    <div class="board-scroll" id="boardScroll">
      <div class="board" id="board">
        <div class="flowrail" id="flowrail"><span class="fr-lbl">State flow</span><svg id="railSvg"></svg></div>
        <div class="colh lead"><span class="k">${ic('layers','sm')}Lane</span><span class="t">언어 · Capacity</span><span class="s">active / max · backlog · 대기</span></div>
        ${COLS.map((c, i) => `<button class="colh t-${c.tone}" data-col="${i}" aria-label="${c.t} 단계 상세 열기"><span class="k">${c.k} ${ic(c.icon,'sm')}</span><span class="t">${c.t}</span><span class="n" id="cn-${c.id}">0</span><span class="s">${c.svc}</span><span class="colh-more">상세 ${ic('arrow-right','sm')}</span><span class="tick"></span></button>`).join('')}
        ${LANGS.map(code => `<div class="lanehd L-${code}" data-lane="${code}" role="button" tabindex="0" aria-label="${langOf(code).name} Capacity 화면으로" id="lh-${code}"></div>${COLS.map((c, i) => `<div class="cell c-${c.id}" data-cell="${code}:${i}"></div>`).join('')}`).join('')}
      </div>
    </div>
    <div class="board-foot"><span class="eyebrow">Legend</span><div class="legend" id="bLegend2"></div><span class="muted" style="margin-left:auto;font-size:11px">카드 링 = 평가 진행률(발화 처리/전체) · A<i>n</i> = Attempt · ${ic('repeat','sm')} = Replay Cycle</span></div>
  </div>
  <div class="grid g-12-8" style="margin-top:14px">
    <div class="panel"><div class="panel-h"><h2 class="sec">${ic('zap')}실시간 전환 스트림</h2><span class="r muted" style="font-size:11px">Firestore state transitions</span></div><div class="feed" id="bFeed"></div></div>
    <div class="panel"><div class="panel-h"><h2 class="sec">${ic('bell')}열린 알림</h2><span class="r"><a class="btn sm" href="#/overview">개요에서 보기</a></span></div><div id="bAlerts"></div></div>
  </div>`;
  const tones = [['success','성공'],['running','실행'],['queued','대기'],['retry','재시도'],['failed','실패'],['dlq','DLQ'],['cancelled','취소']];
  const lg = tones.map(([t, l]) => `<span class="t-${t}"><i class="dot"></i>${l}</span>`).join('');
  $('#bLegend2', el).innerHTML = lg;
  $('#bLegend', el).innerHTML = LANGS.map(c => `<span class="lang L-${c}">${esc(langOf(c).name)}</span>`).join('');
  // events
  el.querySelectorAll('.colh[data-col]').forEach(b => b.addEventListener('click', () => { const c = COLS[+b.dataset.col]; openStage(c.stages[0], c.stages, c.t); }));
  el.querySelectorAll('.lanehd').forEach(h => { const f = () => go('#/capacity?lang=' + h.dataset.lane); h.addEventListener('click', f); h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }); });
  $('#rWin', el).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.board.win = +b.dataset.w; renderRiver(); paintWin(); });
  el.addEventListener('click', e => {
    const mo = e.target.closest('[data-more]');
    if (mo){ const [lang, ci] = mo.dataset.more.split(':'); const c = COLS[+ci]; if (c.id === 'dlq') go('#/explorer?language=' + lang + '&status=' + c.states.join(',')); else go('#/explorer?language=' + lang + '&status=' + c.states.join(',')); }
  });
  built = true;
  paintWin();
}
function paintWin(){ $$('#rWin button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.w === S.board.win))); }

/* ---- strip ---- */
function renderStrip(){
  const o = M.overview(), cap = o.capacity;
  const items = [
    ['gauge', 'Global Slot', `${cap.global.active}<span class="muted" style="font-size:18px">/${cap.global.max}</span>`, null],
    ['loader', '실행 중', o.running, 'running'],
    ['clock', '대기', o.pending, 'queued'],
    ['rotate-ccw', 'Retry 대기', o.retryWaiting, 'retry'],
    ['archive-x', 'DLQ 검토 대기', o.dlqPendingReview, 'dlq'],
    ['check-circle', '오늘 완료', o.completedToday, 'success'],
    ['target', '오늘 평가 발화', o.utterancesEvaluatedToday, null],
    ['shield-check', '발화 PASS율', null, 'success'],
  ];
  const st = $('#bStrip');
  if (!st.dataset.b){
    st.innerHTML = items.map((it, i) => `<div class="m ${it[3]?'t-'+it[3]:''}"><span style="${it[3]?'color:var(--tc)':''}">${ic(it[0],'sm')}<span style="color:var(--ink-3)">${it[1]}</span></span><b id="bs${i}"></b></div>`).join('');
    st.dataset.b = 1;
  }
  $('#bs0').innerHTML = items[0][2];
  [1,2,3,4,5,6].forEach(i => tween($('#bs' + i), items[i][2]));
  tween($('#bs7'), o.utterancePassRateToday * 100, v => v.toFixed(1) + '%');
}

/* ---- intake rail ---- */
function renderIntake(){
  const g = M.stageDetail('gcs_input', {limit:5}).metrics, e = M.stageDetail('event_bus', {limit:5}).metrics, i = M.stageDetail('ingress', {limit:5}).metrics;
  $('#intake').innerHTML = `
   <button class="src" data-stage="gcs_input"><span class="ic">${ic('upload-cloud')}</span><span><small>gs://bixby-utterance-input</small><b>${F.number(g.objectsToday)}</b> <span class="muted" style="font-size:11px">객체 오늘 · ${F.number(g.utterancesToday)} 발화 · 마지막 ${rel(g.lastUploadAt)}</span></span></button>
   <span class="wire" aria-hidden="true"><i></i><i></i><i></i></span>
   <button class="src" data-stage="event_bus"><span class="ic">${ic('radio')}</span><span><small>Eventarc · Pub/Sub</small><b>${F.number(e.deliveredToday)}</b> <span class="muted" style="font-size:11px">전달 · p95 ${F.number(e.p95DeliveryLatencyMs)}ms · backlog ${e.subscriptionBacklog}</span></span></button>
   <span class="wire" aria-hidden="true"><i></i><i></i><i></i></span>
   <button class="src" data-stage="ingress"><span class="ic">${ic('shield-check')}</span><span><small>Cloud Run Event Ingress</small><b>${F.number(i.validatedToday)}</b> <span class="muted" style="font-size:11px">검증 · 중복 무시 ${i.duplicatesIgnoredToday} · 오류 ${i.validationErrorsToday}</span></span></button>
   <span class="wire" aria-hidden="true" style="max-width:80px"><i></i></span>
   <span class="muted" style="align-self:center;font-size:11px;padding:0 8px;white-space:nowrap">${ic('arrow-right','sm')} 레인 대기열로</span>`;
  $$('#intake [data-stage]').forEach(b => b.addEventListener('click', () => openStage(b.dataset.stage, ['gcs_input','event_bus','ingress'], '수신·검증')));
}

/* ---- lane headers ---- */
const prevActive = {};
function renderLanes(byL){
  LANGS.forEach(code => {
    const c = byL[code]; if (!c) return;
    const orphan = M.reservations.filter(r => r.status === 'ORPHANED' && r.language === code).length;
    const cols = c.max > 12 ? Math.ceil(c.max / 2) : Math.max(c.max, 5);
    const cells = [];
    for (let k = 0; k < c.running; k++) cells.push('<i class="slot on t-running" title="RUNNING"></i>');
    for (let k = 0; k < c.dispatching; k++) cells.push('<i class="slot on t-running" style="opacity:.6" title="DISPATCHING"></i>');
    for (let k = 0; k < c.reserved; k++) cells.push('<i class="slot on t-queued" title="RESERVED"></i>');
    for (let k = 0; k < orphan; k++) cells.push('<i class="slot orphan" title="ORPHANED reservation (Reconciler 복구 대기)"></i>');
    while (cells.length < c.max) cells.push('<i class="slot"></i>');
    const grew = (prevActive[code] != null && c.active > prevActive[code]);
    if (grew){ for (let k = prevActive[code]; k < c.active && k < cells.length; k++) cells[k] = cells[k].replace('slot on', 'slot on pulse'); }
    prevActive[code] = c.active;
    const stTone = {OK:'success', SATURATED:'retry', BACKLOGGED:'failed', PAUSED:'cancelled', DISABLED:'cancelled'}[c.status] || 'queued';
    const stLbl = {OK:'정상', SATURATED:'포화', BACKLOGGED:'적체', PAUSED:'일시중지', DISABLED:'비활성'}[c.status] || c.status;
    const p95bad = c.p95WaitSec > c.p95WaitSloSec;
    $('#lh-' + code).innerHTML = `
      <div class="nm"><b>${esc(c.name)}</b><code>${code} · w${c.priorityWeight}</code><span class="st"><span class="pill t-${stTone}">${ic(c.status==='OK'?'check-circle':c.status==='PAUSED'?'pause-circle':'alert-triangle')}${stLbl}</span></span></div>
      <div class="cap"><b>${c.active}</b><span>/ ${c.max}</span><span class="muted" style="font:500 10.5px var(--f-body);margin-left:6px">slot · ${pct(c.utilization,0)}</span></div>
      <div class="slots" style="--cols:${cols}">${cells.join('')}</div>
      <div class="meta"><span>Backlog <b class="${c.backlog > c.backlogAlertThreshold ? 'over' : ''}">${c.backlog}</b></span><span>처리 <b>${c.throughputPerHour}</b>/h</span><span>평균 대기 <b>${dur(c.avgWaitSec*1000)}</b></span><span>p95 <b class="${p95bad?'over':''}">${dur(c.p95WaitSec*1000)}</b></span></div>`;
  });
}

/* ---- cards with FLIP ---- */
function renderCards(animate){
  const wfs = M.workflows;
  const buckets = {}; LANGS.forEach(l => COLS.forEach((c, i) => buckets[l + ':' + i] = []));
  wfs.forEach(w => { const i = COL_OF[w.status]; if (i == null) return; const k = w.language + ':' + i; if (buckets[k]) buckets[k].push(w); });
  const today0 = M.now() - 864e5;
  // column counts
  COLS.forEach((c, i) => { let n = 0; LANGS.forEach(l => { n += c.recent ? buckets[l+':'+i].filter(w => (w.completed_at||w.updated_at) > today0).length : buckets[l+':'+i].length; }); tween($('#cn-' + c.id), n); });
  const first = new Map();
  if (animate) cardEls.forEach((el, id) => { if (el.isConnected) first.set(id, el.getBoundingClientRect()); });
  const placed = new Set();
  LANGS.forEach(l => COLS.forEach((c, i) => {
    const cell = root.querySelector(`[data-cell="${l}:${i}"]`);
    let list = buckets[l + ':' + i];
    if (c.recent) list = list.slice().sort((a, b) => (b.completed_at||b.updated_at) - (a.completed_at||a.updated_at));
    else if (c.id === 'queue') list = list.slice().sort((a, b) => (b.priority - a.priority) || (a.queued_at - b.queued_at));
    else if (c.id === 'run') list = list.slice().sort((a, b) => (b.status === 'RUNNING') - (a.status === 'RUNNING') || (b.progress.pct - a.progress.pct));
    const total = c.recent ? list.filter(w => (w.completed_at||w.updated_at) > today0).length : list.length;
    const cap = c.cap || 99; const vis = list.slice(0, cap);
    const frag = document.createDocumentFragment();
    vis.forEach(w => {
      let el = cardEls.get(w.workflow_id);
      if (!el){ el = document.createElement('button'); el.className = 'bc'; el.dataset.wf = w.workflow_id; cardEls.set(w.workflow_id, el); el._new = true; }
      const sig = w.status + '|' + w.attempt + '|' + (w.progress ? w.progress.processed : 0) + '|' + (w.current_node||'') + '|' + Math.floor(M.now()/20000);
      if (el._sig !== sig){ el.innerHTML = cardHtml(w, c.mini); el._sig = sig; }
      el.className = `bc t-${toneOf(w.status)}${c.mini ? ' mini' : ''}`;
      el.setAttribute('aria-label', `${w.workflow_id} ${SM[w.status].label} attempt ${w.attempt}`);
      el.title = `${w.workflow_id} · ${SM[w.status].label}${w.error ? ' · ' + w.error.code : ''}`;
      frag.appendChild(el); placed.add(w.workflow_id);
    });
    const extra = list.length - vis.length;
    cell.innerHTML = '';
    cell.appendChild(frag);
    if (!vis.length) cell.insertAdjacentHTML('beforeend', `<span class="zero">—</span>`);
    if (extra > 0) cell.insertAdjacentHTML('beforeend', `<button class="more" data-more="${l}:${i}" title="Pipeline Explorer에서 모두 보기">+${extra}${c.recent ? ` · 오늘 ${total}` : ''}</button>`);
  }));
  cardEls.forEach((el, id) => { if (!placed.has(id)){ el.remove(); cardEls.delete(id); } });
  if (!animate || !motionOK()) { cardEls.forEach(el => el._new = false); return; }
  cardEls.forEach((el, id) => {
    const a = first.get(id);
    if (el._new){ el._new = false; if (built && first.size) { el.classList.remove('born'); void el.offsetWidth; el.classList.add('born'); } return; }
    if (!a) return;

    for (let k = 0; k < c.dispatching; k++) cells.push('<i class="slot on t-running" style="opacity:.6" title="DISPATCHING"></i>');
    for (let k = 0; k < c.reserved; k++) cells.push('<i class="slot on t-queued" title="RESERVED"></i>');
    for (let k = 0; k < orphan; k++) cells.push('<i class="slot orphan" title="ORPHANED"></i>');
    while (cells.length < c.max) cells.push('<i class="slot"></i>');
    row.querySelector('[data-slots]').style.setProperty('--cols', cols);

      ['p95 대기', dur(c.p95WaitSec*1000), c.p95WaitSec > c.p95WaitSloSec, `SLO ${dur(c.p95WaitSloSec*1000)}`],
      ['처리량', c.throughputPerHour + '/h', false, `${F.number(c.utterancesPerHour)} 발화/h`],
      ['Retry 대기', c.retryWait, false, `실행 ${c.running} · 예약 ${c.reserved}`],
    ].map(([k, v, bad, s]) => `<div><span>${k}</span><b class="${bad?'bad':''}">${v}</b>${s ? `<span class="muted" style="font-size:10.5px">${s}</span>` : ''}</div>`).join('');
    { const ws = M.workflows.filter(w => w.language === c.code);
      const run = ws.filter(w => ['RUNNING','DISPATCHING','RESERVED'].includes(w.status)).sort((a, b) => (b.progress ? b.progress.pct : 0) - (a.progress ? a.progress.pct : 0));
      const q = ws.filter(w => w.status === 'QUEUED').sort((a, b) => (b.priority - a.priority) || (a.queued_at - b.queued_at));
      const rt = ws.filter(w => w.status === 'RETRY_WAIT');
      const chip = (w, extra) => `<button class="capchip t-${toneOf(w.status)}" data-wf="${esc(w.workflow_id)}" title="${esc(w.workflow_id)} · ${esc(SM[w.status].label)}"><span style="color:var(--tc)">${ic(SM[w.status].icon,'sm')}</span><span class="mono">${esc(shortWf(w.workflow_id))}</span><span class="muted">${extra}</span></button>`;
      row.querySelector('[data-occ]').innerHTML = `<div class="eyebrow">슬롯 점유 · ${run.length}/${c.max}</div><div class="capchips">${run.slice(0, 12).map(w => chip(w, w.status === 'RUNNING' && w.progress ? Math.round(w.progress.pct * 100) + '%' : esc(SM[w.status].label))).join('') || '<span class="muted" style="font-size:11px">점유 없음</span>'}${run.length > 12 ? `<span class="muted" style="font-size:11px">+${run.length - 12}</span>` : ''}</div>
        <div class="eyebrow" style="margin-top:8px">다음 Admission 후보 <span class="dim">(priority → FIFO)</span>${rt.length ? ` · Retry 대기 ${rt.length}` : ''}</div><div class="capchips">${q.slice(0, 6).map((w, i) => chip(w, `#${i + 1} · P${w.priority} · ${dur(M.now() - (w.queued_at || w.created_at))}`)).join('') || '<span class="muted" style="font-size:11px">대기열 비어 있음 — 슬롯이 비면 즉시 Admission</span>'}${q.length > 6 ? `<a class="muted" style="font-size:11px" href="#/explorer?language=${c.code}&status=QUEUED">+${q.length - 6} 더 보기</a>` : ''}${rt.map(w => chip(w, `재시도 ${w.retry_at ? F.relative(w.retry_at) : ''}`)).join('')}</div>`; }

    $$('[data-f]', row).forEach(i => { if (!i.dataset.dirty) i.value = langOf(c.code)[i.dataset.f]; });

const EXF = ['q','workflow_id','pipeline_job_id','language','status','pipeline_version','batch_id','event_type','error_code','from','to','retries','sort'];

    $('#exReset').addEventListener('click', () => go('#/explorer'));
    $('#exCsv').addEventListener('click', () => { const rows = this.rows(); const cols = ['workflow_id','language','status','attempt','pipeline_version','batch_id','event_type','pipeline_job_id','waitMs','runMs','error_code','input_uri','created_at']; const lines = [cols.join(',')].concat(rows.map(w => [w.workflow_id, w.language, w.status, w.attempt, w.pipeline_version, w.batch_id, w.event_type, w.pipeline_job_id, w.waitMs||'', w.runMs||'', (w.error||{}).code||'', w.input.uri, F.iso(w.created_at)].join(','))); L.openModal({title:'Workflow 목록 CSV', body:`<textarea class="inp mono" id="exCsvT" readonly style="height:50vh;font-size:11px">${esc(lines.join('\r\n'))}</textarea>`, foot:`<button class="btn" id="exDl">${ic('download')}다운로드</button><button class="btn pri" id="exCp">${ic('copy')}복사</button>`, onMount(m){ m.querySelector('#exCp').addEventListener('click', () => L.copyText(lines.join('\r\n'), m.querySelector('#exCsvT'))); m.querySelector('#exDl').addEventListener('click', () => L.downloadText('﻿' + lines.join('\r\n'), 'workflows.csv', 'text/csv')); }}); });
    this.paint();
  },
  rows(){
    const f = S.explorer; const flt = {sort: f.sort || 'created_desc'};
    if (f.language) flt.language = f.language; if (f.status) flt.status = f.status.split(','); if (f.pipeline_version) flt.pipeline_version = f.pipeline_version;
    if (f.batch_id) flt.batch_id = f.batch_id; if (f.event_type) flt.event_type = f.event_type; if (f.error_code) flt.error_code = f.error_code;
    if (f.retries) flt.hasRetries = true;
    const toMs = s => { if (!s) return null; const d = new Date(s + ':00+09:00'); return isNaN(d) ? null : d.getTime(); };
    if (toMs(f.from)) flt.from = toMs(f.from); if (toMs(f.to)) flt.to = toMs(f.to);
    if (f.q) flt.q = f.q;

    const maxT = Math.max(1, ...show.map(w => (w.waitMs||0) + runOf(w).ms + (w.attempts||[]).reduce((s, a) => s + (a.backoffSec||0)*1000, 0)));
    $('#exN').innerHTML = `${F.number(rows.length)}<span class="muted" style="font-weight:500"> / ${M.workflows.length} workflows</span>${rows.length > 250 ? ' <span class="muted" style="font-weight:500">(상위 250 표시)</span>' : ''}`;

      const bo = (w.attempts||[]).reduce((s, a) => s + (a.backoffSec||0)*1000, 0); const ro = runOf(w);

      return `<tr class="click" data-wf="${esc(w.workflow_id)}"><td class="mono">${w.replay_of ? ic('repeat','sm') + ' ' : ''}${esc(w.workflow_id)}<div class="dim" style="font-size:10px">${esc(w.pipeline_job_id || '—')}</div></td><td>${langTag(w.language)}</td><td>${pill(w.status)}</td><td class="mono">${esc(w.pipeline_version)}</td><td class="r mono" style="${w.attempt>1?'color:var(--st-retry);font-weight:700':''}">${Math.max(0, w.attempt-1)}</td><td>${bar}</td><td class="r mono">${dur(w.waitMs)}</td><td class="r mono">${ro.ms ? dur(ro.ms) + (ro.live ? '<div class="dim" style="font-size:10px">경과 · 진행 중</div>' : '') : '—'}</td><td class="mono muted trunc" title="${esc(w.input.uri)}">${esc(w.input.object)} · ${F.number(w.input.utteranceCount)}건</td><td>${w.error ? `<span class="mono t-failed" style="color:var(--tc);font-size:11px">${esc(w.error.code)}</span><div class="dim" style="font-size:10px">${esc(w.error.node||'')}</div>` : '<span class="dim">—</span>'}</td><td class="mono muted">${F.date(w.created_at).slice(5)} ${F.hm(w.created_at)}</td></tr>`; }).join('') || `<tr><td colspan="11"><div class="empty">${ic('search')}조건에 맞는 Workflow가 없습니다 — 필터를 줄여 보세요</div></td></tr>`}</tbody>`;

<script>
/* ===================== S4 Pipeline Detail ===================== */
(function(){
'use strict';
const L = window.LANES; const { M, F, $, $$, esc, ic, langOf, SM, toneOf, pill, langTag, shortWf, dur, pct, rel, tm, dt, S, go, SCREENS, can, opName, toast, idBtn, jsonHtml } = L;
const NSM = M.nodeStatusMeta, ASM = M.attemptStatusMeta;
const POS = {preprocess:[0,1], intent_eval:[1,0], response_eval:[1,1], latency_check:[1,2], aggregate:[2,1], persist:[3,1]};
const NW = 196, NH = 66, CX = 236, RY = 84, PADX = 16, PADY = 14;
let unsub = [];

function evTone(e){ if (/FAILED|TIMEOUT|DEAD_LETTER/.test(e.name) || e.severity === 'ERROR') return 'failed'; if (/RETRY/.test(e.name) || e.severity === 'WARNING') return 'retry'; if (/SUCCEEDED|COMPLETED|COMMITTED/.test(e.name)) return 'success'; if (/CANCEL/.test(e.name)) return 'cancelled'; if (/STARTED|SUBMITTED|RESERVED/.test(e.name)) return 'running'; return 'queued'; }

function dagSvg(att, sel){
  const dag = att.dag || [];
  const W = PADX*2 + CX*3 + NW, H = PADY*2 + RY*2 + NH;
  const pos = id => { const p = POS[id] || [0,0]; return {x: PADX + p[0]*CX, y: PADY + p[1]*RY}; };
  const byId = {}; dag.forEach(n => byId[n.id] = n);
  const edges = []; dag.forEach(n => (n.deps||[]).forEach(d => { const a = pos(d), b = pos(n.id); const src = byId[d]; const cls = n.status === 'RUNNING' ? 'on' : (src && src.status === 'SUCCEEDED' && n.status !== 'PENDING' && n.status !== 'SKIPPED') ? 'ok' : ''; const x1 = a.x + NW, y1 = a.y + NH/2, x2 = b.x, y2 = b.y + NH/2, mx = (x1 + x2) / 2; edges.push(`<path class="ed ${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}"/><path d="M${x2-7},${y2-4} L${x2-1},${y2} L${x2-7},${y2+4}" fill="none" stroke="var(--line-2)" stroke-width="1.5"/>`); }));
  const nodes = dag.map(n => {
    const p = pos(n.id), m = NSM[n.status] || {tone:'queued', icon:'circle', label:n.status};
    const prog = n.progress ? n.progress.pct : (n.status === 'SUCCEEDED' ? 1 : 0);
    const fail = n.status === 'FAILED';
    const sub = n.status === 'RUNNING' ? `${F.number(n.progress.processed)}/${F.number(n.progress.total)} · ${Math.round(prog*100)}%` : n.duration_ms ? dur(n.duration_ms) : m.label;
    return `<g class="nd t-${m.tone}${fail ? ' fail' : ''}${sel === n.id ? ' sel' : ''}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.labelKo)} ${esc(m.label)}" transform="translate(${p.x},${p.y})">
      ${fail ? `<rect class="glow" x="-4" y="-4" width="${NW+8}" height="${NH+8}" rx="10"/>` : ''}
      <rect class="box" width="${NW}" height="${NH}" rx="7"/>
      <rect x="0" y="0" width="4" height="${NH}" rx="2" fill="var(--tc)"/>
      <g transform="translate(12,12)" style="color:var(--tc)"><svg width="15" height="15" viewBox="0 0 24 24" class="i" style="width:15px;height:15px">${iconInner(m.icon)}</svg></g>
      <text class="ttl" x="34" y="24">${esc(n.labelKo)}</text>${n.labelKo.length <= 6 ? `<text class="sub" x="${NW-10}" y="24" text-anchor="end">${esc(n.id)}</text>` : ''}
      <text class="sub" x="12" y="46">${esc(sub)}${n.resources && n.resources.gpu ? ' · GPU' : ''}</text>
      <text class="sub" x="${NW-10}" y="46" text-anchor="end" style="fill:var(--tc);font-weight:600">${esc(m.label)}</text>
      <rect class="bar-bg" x="12" y="54" width="${NW-24}" height="4" rx="2"/><rect class="bar-fg" x="12" y="54" width="${((NW-24)*prog).toFixed(1)}" height="4" rx="2" fill="var(--tc)"/>
    </g>`;
  });
  return `<svg class="dag" viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="Pipeline DAG">${edges.join('')}${nodes.join('')}</svg>`;
}
function iconInner(n){ const tmp = L.ic(n); return tmp.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, ''); }

function nodePanel(w, att, nodeId){
  const n = (att.dag || []).find(x => x.id === nodeId) || (att.dag||[])[0]; if (!n) return '<div class="empty">노드 없음</div>';
  const m = NSM[n.status] || {};
  const r = n.resources || {};
